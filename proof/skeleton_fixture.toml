# blank-then-recovered: happy, answered otherwise (PAGE_ANSWER_VARIANTS).
[[scenario]]
name = "blank-then-recovered"

# churro-native: Two real-format Churro page responses: one that parses, and one the provider cut mid-element, retained unparseable.
[[scenario]]
name = "churro-native"

# churro-truncation: A visibly cut, still-parseable Churro response: the transport said `length`, the text is kept, truncated is true, and nothing completes or re-asks it.
[[scenario]]
name = "churro-truncation"

# refused-page: The Door refuses page 2: no witness and no reader is shown it.
[[scenario]]
name = "refused-page"

# refused-first-page: The Door refuses page 1, the page both acts start on.
[[scenario]]
name = "refused-first-page"

# genuinely-empty-witness: Churro returns an empty body for page 1: a completed empty reading, never a missing or failed attempt.
[[scenario]]
name = "genuinely-empty-witness"

# ink-free-page: A third, scenario-only page of uniform paper with no declared act; every chair reads it and returns nothing.
[[scenario]]
name = "ink-free-page"

# ink-free-page-unwitnessed: The same page with no response declared for it: Chandra and Churro end `not-run`.
[[scenario]]
name = "ink-free-page-unwitnessed"

# not-run-witness: Churro is never asked about page 1.
[[scenario]]
name = "not-run-witness"

# malformed-witness: Churro's page 1 body could not be retained: a failed attempt that holds no other witness.
[[scenario]]
name = "malformed-witness"

# malformed-capabilities: Churro's page 1 response declares a capability record that is not an object.
[[scenario]]
name = "malformed-capabilities"

# dots-table: Surya tags page 2 a Table, so a roster that routes dots.mocr to index and table pages seats it there; it reads the page's one row.
[[scenario]]
name = "dots-table"

# dots-no-record: The record detector finds nothing on page 2, so a routed dots.mocr reads it; DAI has nothing to read there.
[[scenario]]
name = "dots-no-record"

# dots-cut-off: page 2 tagged a Table, and dots.mocr's answer cut at its bound: broken JSON, retained and never salvaged.
[[scenario]]
name = "dots-cut-off"

