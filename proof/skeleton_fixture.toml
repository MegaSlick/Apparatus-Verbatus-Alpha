[[scenario]]
name = "happy"

# witness-capabilities: Chandra reports its own confidence and format capabilities on page 1; both are retained as testimony and grade nothing.
[[scenario]]
name = "witness-capabilities"

# page-review: Its page 2 answer cites no boxed id, so the page accounting holds that entry.
[[scenario]]
name = "page-review"

# page-no-act: Its page 2 answer names one `other` entry and no act, on a page the record detector finds nothing on.
[[scenario]]
