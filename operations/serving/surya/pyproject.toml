# Surya's own environment. Surya pins Pillow and OpenCV versions the project's
# environment cannot share, so it runs here, apart, through `runner.py`, and the
# Designator reads only the JSON the runner writes. `uv.lock` pins every package
# byte; the pod syncs it with `uv sync --locked` (operations/pod/README.md).
#
# Licence record (CONTRIBUTING.md):
#   surya-ocr==0.22.1   Apache-2.0 (code)   github.com/datalab-to/surya
# Its weights are fetched at run setup, never stored in this tree.
[project]
name = "verbatus-surya"
version = "0.0.0"
description = "Surya text-line and layout detection, run apart for the Designator"
requires-python = "==3.12.*"
dependencies = ["surya-ocr==0.22.1"]

[tool.uv]
required-version = "==0.12.1"
# Nothing here is a package to build: the runner is a script.
package = false
# The pod is the one place this environment runs.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Surya caps Pillow below 11, but every Pillow security fix since is in 12.x. Upstream's
# own pull request to lift the cap (datalab-to/surya#519) passes Surya's test suite on
# Pillow 12.2, so this environment takes the patched release.
override-dependencies = ["pillow==12.3.0"]
