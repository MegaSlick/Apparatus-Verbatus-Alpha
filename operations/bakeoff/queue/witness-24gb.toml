  "operations.bakeoff.native.chandra_native", "run",
  "--pages", "/workspace/private/bakeoff-pages", "--out", "/workspace/private/bakeoff/witness-cache",
  "--store-root", "/workspace/private/model-store", "--label", "chandra-native"]

[[arms]]
name = "churro-native"
time_box_min = 20
cut = "never"
gpu = true
install = [".venv/bin/python", "-m", "operations.bakeoff.native.churro_native", "install",
