  "--store-root", "/workspace/private/model-store", "--label", "churro-native"]

# dots.mocr: skipped only if its install fails (plan 4.3). Its weights are fetched as
# its preparation (nothing is fetched when they are on the volume).
[[arms]]
name = "dots-mocr"
time_box_min = 25
cut = "install-failed"
gpu = true
install = [".venv/bin/python", "-m", "operations.bakeoff.native.dots_mocr", "install",
  "--venv-dir", "/workspace/private/bakeoff/venvs/dots-mocr"]
prepare = ["/workspace/private/bakeoff/venvs/dots-mocr/bin/python", "-m",
  "operations.bakeoff.native.dots_mocr", "fetch", "--store-root", "/workspace/private/model-store"]
command = ["/workspace/private/bakeoff/venvs/dots-mocr/bin/python", "-m",
  "operations.bakeoff.native.dots_mocr", "run",
  "--pages", "/workspace/private/bakeoff-pages", "--out", "/workspace/private/bakeoff/witness-cache",
  "--store-root", "/workspace/private/model-store", "--label", "dots-mocr"]

# --- CTC line arms (cards/kraken-ppocrv6.md, pylaia-*.md, party.md, surya-recogniser.md)
# CPU arms, beside the GPU arms above; `cpu_threads` (top) says how many run at once. Each
# arm's `--threads` is its share. Every arm carries its own install and fetch (both do
# nothing when already done), so an arm never depends on another arm's preparation.
# Time boxes are the cards' 4-vCPU measurements for 73 pages at about 30 lines a page.

# The two shared line sources come first; the arms that read their crops wait for them.
# surya-lines: the repository's Surya runner (its own environment, CPU, 35-66 s a page at
# 8 threads) over every page, then the crops. Its weights: the model store's verified
# bundle, else /workspace/private/bakeoff/surya-bundle, fetched there if absent.
[[arms]]
name = "surya-lines"
time_box_min = 70
cut = "never"
gpu = false
writes = "_lines/surya"
install = [".venv/bin/python", "-m", "operations.bakeoff.lines.surya_rec", "install"]
prepare = [".venv/bin/python", "-m", "operations.bakeoff.lines.surya_lines", "bundle", "--store-root", "/workspace/private/model-store", "--bundle-dir", "/workspace/private/bakeoff/surya-bundle"]
command = [".venv/bin/python", "-m", "operations.bakeoff.lines.surya_lines", "run", "--pages", "/workspace/private/bakeoff-pages", "--lines-dir", "/workspace/private/bakeoff/surya-docs", "--out", "/workspace/private/bakeoff/witness-cache", "--store-root", "/workspace/private/model-store", "--bundle-dir", "/workspace/private/bakeoff/surya-bundle", "--threads", "8"]

# blla-lines: kraken's segmenter, about 80 s a page on 4 vCPU (half of it a one-thread filter).
[[arms]]
name = "blla-lines"
time_box_min = 100
cut = "never"
gpu = false
writes = "_lines/blla"
install = [".venv/bin/python", "-m", "operations.bakeoff.lines.kraken_ppocr", "install"]
command = [".venv/bin/python", "-m", "operations.bakeoff.lines.blla", "prepare", "--pages", "/workspace/private/bakeoff-pages", "--out", "/workspace/private/bakeoff/witness-cache", "--threads", "4"]

# kraken (cards/kraken-*.md): CPU, no LM. A -blla arm is kraken's own one-command path
# (segment -bl ocr), so it segments again: about 80 s a page plus 2-3 s a line. A -surya
# arm recognises the cached Surya crops (about 1.5 min a page).

[[arms]]
name = "kraken-ppocrv6-blla"
time_box_min = 190
cut = "never"
gpu = false
install = [".venv/bin/python", "-m", "operations.bakeoff.lines.kraken_ppocr", "install"]
prepare = [".venv/bin/python", "-m", "operations.bakeoff.lines.kraken_ppocr", "fetch", "--store-root", "/workspace/private/model-store"]
command = [".venv/bin/python", "-m", "operations.bakeoff.lines.kraken_ppocr", "run", "--lines", "blla", "--pages", "/workspace/private/bakeoff-pages", "--out", "/workspace/private/bakeoff/witness-cache", "--store-root", "/workspace/private/model-store", "--threads", "4"]

