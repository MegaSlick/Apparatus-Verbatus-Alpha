# Codex seats — the GPT half of the roster.
#
# One line per seat:
#   <name> <model> <effort> <sandbox> <workroot> <timeout-seconds>
# Blank lines and lines beginning with # are ignored. Parsed as data, never
# sourced: a config that executes is a config that can do anything.
#
# This file exists because effort is otherwise inherited by accident. Codex
# reads ~/.codex/config.toml, which travels with neither a clone nor a pod.
# `seat.sh` passes --ignore-user-config, so the model, effort, sandbox and
# working-root values come from this tracked line. Authentication, environment,
# PATH remains a property of the machine; the positive execution ceiling is
# the final tracked field.
#
# Seat efforts allowed here: none minimal low medium high xhigh max ultra.
#
# `ultra` is the guarded one, and it is allowed only on a condition. It couples
# maximum reasoning to automatic delegation, and a transcript showed a model
# narrating delegation it did not perform — which is why the effort was kept out
# of this file to begin with: nothing it says about its own work can be taken as
# evidence that the work happened. That reasoning has not been retired; it is
# what the condition is made of.
#
# The condition Tyrel admitted `ultra` under is that such a seat leaves external
# evidence instead of a report. In practice: it must be a writing seat, its
# workroot must be WORKCOPY — a durable working copy outside this repository,
# taken from a frozen snapshot — and what it did is read from the diff against
# that snapshot rather than from its narration. An `ultra` seat that is
# read-only, or that writes into a tray that is gone before it can be diffed, is
# the exact case the original exclusion was written for and is still refused.
# `test_seat.py` enforces that condition; it is not a matter of remembering.
#
# The CLI does not check an effort against the model that receives it: Luna
# accepted `ultra`, which its own catalog does not list. A wrong effort will
# not reliably fail loudly, which is the whole argument for naming seats here
# instead of typing flags per call.
#
# <workroot> is the seat's working root, relative to the repository, or the
# token TMPTRAY meaning "a fresh temporary directory outside the tree".
#
# The ceiling in the last field has a wrapper maximum (`max_timeout_s` in
# seat.sh), and a seat above it is refused rather than trimmed. That maximum is
# not a security boundary — whoever edits a line here can edit that constant
# too. It is a typo guard, aimed at the one realistic accident: an extra digit
# turning ninety minutes of paid API into fifteen hours on a laptop that was
# closed hours ago, with nothing downstream to notice. A seat that genuinely
# needs longer gets the constant raised in a tracked, reviewed edit.
#
# There is no model allowlist, deliberately. A list of permitted names goes
# stale at the next release, and a guard that must be edited to keep working
# eventually gets edited to stop working — this repository has already been bitten
# by that shape once, in the push gate. `seat.sh` checks the model's SHAPE
# instead: a plain name, not an option, a path or a word break. Whether the name
# exists is Codex's question, and it answers it loudly.
#
# The sandbox evidence is contradictory. One probe said an in-repository `-C`
# exposed the enclosing Git repository; later forced-shell probes did not
# reproduce that result. The exact designated-folder case remains unmeasured.
# `seat.sh` therefore rejects in-repository writing conservatively. TMPTRAY is
# not called safe: it is ephemeral and a seat there may reach the wider system
# temp area. The build seat remains only until Tyrel decides whether GPT keeps
# writing at all and, if so, where durable output belongs.

# The two audit seats are the same effort and the same sandbox on purpose. They
# exist to run one identical prompt across two vendlines and be compared, so any
# difference in the reports has to come from the model rather than from the
# configuration. Their ceiling is far above `judge`'s because a full-diff audit
# that gets killed at ten minutes produces nothing readable at all: the report
# is written last, so the timeout deletes the answer instead of shortening it.
# `seat.sh` tells each seat its own deadline, so the number below is what the
# model is told, and the two can never drift apart.

# name         model                  effort   sandbox          workroot  timeout
scout          gpt-5.3-codex-spark    low      read-only        .         600
build          gpt-5.6-terra          medium   workspace-write  TMPTRAY   600
judge          gpt-5.6-sol            high     read-only        .         600
orchestrate    gpt-5.6-sol            high     read-only        .         600
audit-sol      gpt-5.6-sol            high     read-only        .         2700
audit-terra    gpt-5.6-terra          high     read-only        .         2700

# The fix seat. Ultra, and writing — the two settings this file was most
# cautious about, together. It is bounded three ways rather than by effort:
# it works in a copy outside this repository, that copy has had its git remote
# removed so no push is possible by construction, and every change it makes is
# read from a diff against a frozen snapshot rather than from its own report.
# 90 minutes because it is working a 106-item ledger, and seat.sh tells it so.
fix-sol        gpt-5.6-sol            ultra    workspace-write  WORKCOPY  5400
