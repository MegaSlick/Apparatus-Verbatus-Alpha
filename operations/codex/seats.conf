# Named read-only Codex evidence seats.
#
#   <name> <model> <effort> <timeout-seconds>
#
# The wrapper supplies read-only sandboxing, repository root, closed stdin,
# deadline, and user-config isolation. Claude's main session owns orchestration
# and synthesis; no Codex seat writes or acts as an independent orchestrator.

scout       gpt-5.3-codex-spark low  600
judge       gpt-5.6-sol         high 600
audit-sol   gpt-5.6-sol         high 2700
audit-terra gpt-5.6-terra       high 2700

# Design seats. Max effort and the full hour, for whole-system design work rather
# than review of one commit: the question is what the system should be, which is
# slower to answer than whether a diff is correct. Added at Tyrel's direction
# (2026-07-31) for the system-coherence design; the review seats above are
# unchanged and remain what a reviewer pass uses.
design-sol   gpt-5.6-sol   max 3600
design-terra gpt-5.6-terra max 3600
