# Codex seats — the GPT half of the roster.
#
# One line per seat:  <name> <model> <effort> <sandbox> <workroot>
# Blank lines and lines beginning with # are ignored. Parsed as data, never
# sourced: a config that executes is a config that can do anything.
#
# This file exists because effort is otherwise inherited by accident. Codex
# reads ~/.codex/config.toml, which is Tyrel's desktop setting (currently
# xhigh) and travels with neither a clone nor a pod. `seat.sh` passes
# --ignore-user-config, so every value a call runs under comes from this line
# and a reviewer can read it. `.claude/agents/` does the same job for Claude.
#
# Efforts the API accepts: none minimal low medium high xhigh max
# `ultra` is a client-side level on Sol and Terra meaning max reasoning plus
# automatic task delegation. It is NOT required for delegation — the
# collaboration tools are present at every effort (see
# workbench/active/ORCHESTRATION_FINDINGS.md) — so no seat spends it.
#
# The CLI does not check an effort against the model that receives it: Luna
# accepted `ultra`, which its own catalog does not list. A wrong effort will
# not reliably fail loudly, which is the whole argument for naming seats here
# instead of typing flags per call.
#
# <workroot> is the seat's working root, relative to the repository, or the
# token TMPTRAY meaning "a fresh temporary directory outside the tree".
#
# Measured 2026-07-27, because the first version of this file claimed the
# opposite and was wrong: `-C <dir>` does NOT bound a workspace-write sandbox.
# The boundary resolves to an ancestor — the enclosing git repository when
# there is one. A seat rooted at `autoclave` therefore gets write access to the
# WHOLE repository, which is the reverse of the quarantine.
#
# What the sandbox does enforce is the outside: a seat rooted outside the tree
# was refused an absolute-path write into the repository by the OS
# ("operation not permitted"). So the drafting seat runs outside the repository
# altogether, and this session carries its output into `autoclave/` after
# reading it — which is also what the quarantine says should happen, since no
# byte should enter the tree that a reviewed session did not place there.

# name         model                  effort   sandbox          workroot
scout          gpt-5.3-codex-spark    low      read-only        .
build          gpt-5.6-terra          medium   workspace-write  TMPTRAY
judge          gpt-5.6-sol            high     read-only        .
orchestrate    gpt-5.6-sol            high     read-only        .
