# The windows onto the old work, mounted read-only into every chamber.
#
# Tyrel ruled 2026-08-04: a chamber that cannot see how the previous pipeline
# worked reinvents it badly. His case, and it is a fair one: a seat with no
# window decided to refuse PDFs outright, when the old pipeline had taken PDFs
# at stage one all along. Seeing the function, and why it worked, is engineering
# input. Copying the bytes is still forbidden — CLAUDE.md's Quarantine section is
# unchanged, and every line that enters this repository is still written new and
# justified.
#
# This file is why the window persists between sessions. Before it, the window
# was opt-in through `AUTOCLAVE_WINDOW` and every session had to remember; four
# seats built System 03 with no window at all because one session did not.
#
# Paths are machine-specific and this is an alpha shortcut, recorded as one in
# `workbench/standing/ALPHA_SHORTCUTS.md`. A path that does not exist is skipped
# with a note rather than failing the chamber, so this file is harmless in a
# clone on another machine.

# The old pipeline at /window — the **deployable bundle only**, never the working
# repository. Tyrel ruled 2026-08-04, correcting this file's first version: "Don't
# include the full ocr_pipeline folder!! It doesn't need the full corpus and images …
# I don't want the container to see all the ancient stale notes that accumulated over
# the months of work, just the code as it was when I mostly worked."
#
# This is that: `lean_pipeline_v3`, the single versioned artifact that ships to a pod
# and is unpacked there. 44 files, 1.2 MB, code only — `deploy/lean/`, `local/`,
# `remote/`, `training/`. It carries `LEAN_BUNDLE_RECEIPT.json`, a sha256 per file plus
# a whole-bundle digest and the `source_git_commit` it was cut from, so what a chamber
# reads is a named, verifiable revision rather than a working tree that has moved on.
# `local/build_lean_bundle.py`, inside the bundle, is what builds it; the matching
# `.tar.gz` beside it is what is actually shipped.
#
# The working repository is 5.5 GB with ~31,500 real register images and months of
# accumulated notes. None of that belongs in a chamber, and pointing at the bundle
# removes the need to mask any of it.
WINDOW_OCR=/Users/tyrel/ocr_pipeline/releases/lean_pipeline_v3_20260720_ac36b274426a

# The audit and gap notes the specs cite by path, at /stage — `40_gap_notes/1_exemplar.md`
# and its siblings are named in spec 03 itself.
WINDOW_STAGE=/Users/tyrel/Temp_Stage

# Directories masked to empty inside those mounts because they hold real
# register images. A chamber has open network egress, so a readable image is a
# sendable one — this is the same reasoning that masks `private/`, `workbench/`
# and `scriptorium/` on `/src`, applied to material that is not ours to disclose.
#
# `WINDOW_OCR_MASKS` is empty and that is not an oversight: the deployment bundle
# contains no images at all, verified by scanning it. The masking that used to be
# needed here was an artefact of pointing at the whole repository, and narrowing the
# window removed the problem rather than hiding it. Leave it empty unless the window
# is ever widened again — and if it is, the corpus directories come back first.
#
# The `Temp_Stage` entries below are probe scratch directories holding 39 images, not
# the audit content. Verified 2026-08-04 by scanning the tree for image extensions;
# the check that proves the mask holds runs inside a chamber, not here.
WINDOW_OCR_MASKS=""
WINDOW_STAGE_MASKS="_audit_features_probe _challenge_probe _probe _probe3 _probe4"
