# The airlock onto the old pipeline. Read-only, and the code inside is CONTAMINATED.
#
# **Tyrel ruled 2026-08-04:** "I don't want code blindly copied over [but] seeing its
# function and how and why things were working really does help the engineering." And:
# treat the original code as contaminated — "it is for reference to help plan and
# engineer issues not to copy line by line."
#
# So this is an airlock, not a source tree. What crosses it is understanding: how a
# stage was shaped, what it got right, which failure it was working around, why a
# decision was made. **No line, no function, no file crosses.** Everything in this
# repository is written new here and justified against the goals and the governance,
# and a line nobody can justify does not enter whoever typed it — CLAUDE.md,
# Quarantine. A chamber that pastes an old function has failed the task, not saved
# time.
#
# The window exists because the alternative was proved worse. Four seats built
# System 03 with no window at all, and one decided to refuse PDFs outright — while the
# old pipeline had taken PDFs at stage one all along, counting pages at the door and
# rasterising each page once downstream. A seat with the airlock found that in minutes.
#
# This file is why it persists between sessions. Before it, the window was opt-in
# through `AUTOCLAVE_WINDOW` and every session had to remember; the one that forgot
# cost a night.

# --- What is mounted -------------------------------------------------------------
#
# **The pipeline code, from the working tree, and nothing else.**
#
# Not the whole repository — Tyrel ruled that too: "Don't include the full ocr_pipeline
# folder!! It doesn't need the full corpus and images ... I don't want the container to
# see all the ancient stale notes that accumulated over the months of work, just the
# code as it was when I mostly worked." The repository is 5.5 GB, ~31,500 real register
# images, and months of dated notes. None of that belongs in a chamber.
#
# **Why not the release bundle**, which was this file's second version and looked
# tidier: `releases/lean_pipeline_v3_20260720_...` was cut from a 2026-07-19 commit and
# is **186 commits stale**. `remote/build_inbox_manifest.py` — the PDF door itself, the
# single most relevant file to the current rebuild — has changed since. A receipted
# artifact that is wrong is worse than a working tree that is right. The bundle stays
# available at that path if a session ever wants the exact shipped revision.
#
# `training/` is deliberately absent: its working tree carries datasets — act slices,
# fools_gold, synth_data — which are transcriptions of real records, and a chamber has
# open network egress. Add it deliberately, masked, if a training question ever needs it.
WINDOW_OCR_ROOT=/Users/tyrel/ocr_pipeline
WINDOW_OCR_DIRS="remote local deploy"

# The audit and gap notes the specs cite by path — `40_gap_notes/1_exemplar.md` is named
# in spec 03 itself. Mounted at /stage.
WINDOW_STAGE=/Users/tyrel/Temp_Stage

# Masked because they hold 39 real images between them, and a readable image is a
# sendable one. Probe scratch, not audit content.
WINDOW_STAGE_MASKS="_audit_features_probe _challenge_probe _probe _probe3 _probe4"

# Paths here are absolute and machine-specific — an alpha shortcut, recorded as one in
# `workbench/standing/ALPHA_SHORTCUTS.md`. A path that is not on this machine is skipped
# with a note rather than failing the chamber, so this file is harmless in a clone
# elsewhere.
