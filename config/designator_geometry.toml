# R2 Designator geometry policy.  This file is sealed into a run by its SHA-256.
#
# The `role` values below name geometry-policy blocks, NOT chairs.
# `config/models.toml` is the only place a model is bound to a chair; this file
# only says what shape a proposal adapter cuts. Surya is not a proposal
# adapter: it runs on the whole page, as its makers wrote it, and its lines and
# blocks are evidence records (`pipeline/2_designator/surya_detection.py`).
[geometry]
schema = "designator-geometry-policy.v1"

[geometry.yolo_obb]
role = "designator_yolo_obb"
task = "obb"
crop_policy = "aabb-enclose"
rectify = false

[geometry.provenance]
source = "R2 binding: REBUILD_PLAN_three_stage.md and three_stage_reading_design.md v2.1"
calibrated_for_this_corpus = false
# No `designator_yolo_obb` chair is active. `config/models.toml`'s fixture
# roster configures `secondary_proposer` as DAI's record detector on a fixture
# row, and the drafted YOLOv26 entry in its commented real roster is not in force.
caveat = "Fixture policy only; no proposer chair is active in the live roster."
