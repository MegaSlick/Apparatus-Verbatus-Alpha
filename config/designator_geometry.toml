# R2 Designator geometry policy.  This file is sealed into a run by its SHA-256.
#
# The `role` values below name geometry-policy blocks, NOT chairs. No chair
# called `designator_surya` or `designator_yolo_obb` exists in
# `config/models.toml`, in its live fixture roster or its commented real one,
# and none is proposed. `config/models.toml` is the only place a model is bound
# to a chair; this file only says what shape a proposal adapter cuts.
[geometry]
schema = "designator-geometry-policy.v1"

[geometry.surya]
role = "designator_surya"
tile_width_px = 1400
tile_height_px = 1400
half_tile_vertical_offset_px = 700
horizontal_overlap_px = 700

[geometry.yolo_obb]
role = "designator_yolo_obb"
task = "obb"
crop_policy = "aabb-enclose"
rectify = false

[geometry.provenance]
source = "R2 binding: REBUILD_PLAN_three_stage.md and three_stage_reading_design.md v2.1"
calibrated_for_this_corpus = false
# No proposer chair is ACTIVE. `config/models.toml`'s live roster carries
# `secondary_proposer` as an explicit `state = "absent"`, and its commented real
# roster does carry a drafted YOLOv26 entry — so a proposer is drafted, just not
# in force. Tyrel's roster ruling of 2026-08-20 named a Perlector and three
# witnesses and spoke to no proposer, and activating the drafted one would be
# contract work in any case: the secondary-candidate contract reads a pixel count
# rather than a detector, and no serving-recipe row exists for the chair at any
# tier.
caveat = "Fixture policy only; no proposer chair is active in the live roster."
