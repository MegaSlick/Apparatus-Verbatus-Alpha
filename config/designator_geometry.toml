# R2 Designator geometry policy.  This file is sealed into a run by its SHA-256.
#
# The crop policy for the configured record detector (`secondary_proposer`):
# the Designator cuts every detector record's crop under it, on fixture and real
# rosters alike, and DAI reads those crops. The `role` values below name
# geometry-policy blocks, not chairs; `config/models.toml` is the only place a
# model is bound to a chair. Surya is not cut under this policy: it runs on the
# whole page, and its lines and blocks are evidence records
# (`pipeline/2_designator/surya_detection.py`).
[geometry]
schema = "designator-geometry-policy.v1"

[geometry.yolo_obb]
role = "designator_yolo_obb"
task = "obb"
crop_policy = "aabb-enclose"
rectify = false

[geometry.provenance]
source = "R2 binding: REBUILD_PLAN_three_stage.md and three_stage_reading_design.md v2.1"
calibrated_for_this_corpus = false
caveat = "The crop policy for the configured record detector's records, applied on fixture and real rosters alike; not calibrated for this corpus."
