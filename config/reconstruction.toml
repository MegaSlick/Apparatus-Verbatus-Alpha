# Reconstruction: the labelled, unconfirmed layer the Coniector makes beneath each
# diplomatic reading (common/reconstruction.py). The Coniector returns departures
# from the sealed diplomatic text; these bounds decide which departures code
# applies, and past them the act's reconstruction is not made. Closed: every key
# below is required and no other is read. Every bound is a starting value, to be
# measured on the proof run.

# Whether the Coniector's model chair (`reconstructor`) runs: "on" or "off". Off,
# the stage plans no call and loads no model, and no act carries a reconstruction.
mode = "off"

# Whether the submitted pages are consecutive leaves of one register. Only then
# does the Coniector see a neighbouring page's edge act or join an act across a
# page break; otherwise each page is reconstructed from its own text alone.
pages_are_consecutive = false

# Most departures one act or one join may carry.
max_departures_per_act = 5

# Longest either side of one departure may be, in characters: about a word or
# two, the size of a slip of the pen or a lost abbreviation.
max_departure_characters = 40

# Most characters all departures of one act may replace, as a share of its
# diplomatic text (basis points), and the floor under that share, so a short
# act can still take one word's departure.
max_changed_share_bp = 1500
changed_floor_characters = 16

# Longest a departure's optional reason may be, in characters.
max_reason_characters = 160
