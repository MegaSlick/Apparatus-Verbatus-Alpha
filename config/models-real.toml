# The real roster is selected explicitly with `--models-config config/models-real.toml`.
# It leaves the fixture roster at config/models.toml byte-for-byte intact.  Every
# all-zero digest below is an intentional pre-materialization sentinel, not a
# manifest pin: the pod's materializer fetches each exact revision, builds the
# canonical manifests, snapshots the licence text, and returns measured digests
# for an ordinary reviewed edit here. Until then `ensure()` names the all-zero
# value as a pre-materialization sentinel; this file never turns an unmeasured
# fetch into a serving claim.

witness_floor = 3

[adapter_recipes]
door = "unproven-real-door"
exemplar = "unproven-real-exemplar"
ink-map = "deterministic-residual-ink-v1"
designator = "unproven-real-designator"
attestatores = "unproven-real-attestatores"
perlector = "unproven-real-perlector"
recensor = "unproven-real-recensor"
archetypus = "unproven-real-archetypus"
armarium = "unproven-real-armarium"

