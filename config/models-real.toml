# DAI's own project's record detector (Teklia, YOLOv26-m OBB, trained on the
# same RecordGold corpus as DAI). Each witness sees the page the way it was
# trained: DAI reads crops of the records this detector finds. Its records
# are page-scoped evidence with no authority over acts; they only give DAI its
# units.
[chairs.secondary_proposer]
state = "configured"
source = "huggingface"
