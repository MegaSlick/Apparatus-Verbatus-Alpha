# Surya (datalab-to/surya), run apart as an independent, deterministic text-line
# and layout detector: a check that nothing is missed. Its weights are no single
# Hub revision (text detection comes from Datalab's model host), so the chair is
# the locked bundle `operations/serving/surya/prefetch.py` writes, pinned by its
# measured digest manifest like any local repository. The pod's model store
# fetches it at launch and places it under `model_root`, beside this file on
# container-local disk (operations/serving/surya/README.md).
[chairs.designator_surya]
state = "configured"
source = "local-repository"
path = "designator_surya"
digest_manifest = "ad19b0280bec623e7edd1b7ca5197ded1add35af9ff0ec76e80db8d035b16cb9"
manifest = "manifests/surya2-detection.json"
serving_recipe = "unproven-real-surya"
