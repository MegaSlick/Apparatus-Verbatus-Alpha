# R5a Perlector prior-draft protocol. These exact bytes are sealed into each run.
# `draft_fed` is a run flag: its default is withheld (B5a, 2026-09-28).
selection_rule = "digest-threshold-over-frame-page-seed-act.v1"
page_shared_prefix_policy = "page-shared-prefix-first.v1"
pass_b_fragment = "This is a prior reading. It may be correct, incomplete, or wrong. Independently reread the image, preserve what the ink supports, and change only what the image justifies."
# Sealed transport ceiling for the offline Perlector fixture. A logical act
# must fit in one request: callers hold with cluster-presentation-over-capacity
# rather than split its captures into candidate readings.
max_images = 32

# The truncation instrument's length signal (`pipeline/4_perlector/truncation.py`).
# A reading is length-suspicious when, scaled from its region to the whole page's
# area, it would carry fewer than this many characters:
#
#     characters * page_pixels < length_floor_characters_per_page * region_pixels
#
# Dimensionless on purpose: an absolute pixels-per-character ratio scales the
# wrong way (a real 300-DPI act crop is 2,653 px/char, so every ordinary act
# tripped it). A fraction of the page's own area asks the same question at every
# scale, and the sealed value is what the run's config_digest records. The
# signal is judged only on a page big enough to hold the density the floor
# describes (`common/perlector_audit.py::LEGIBLE_PAGE_PIXELS`); the 200x260
# fixture pages are not.
[truncation]
length_floor_characters_per_page = 400

[truncation.provenance]
source = "measured, 2026-09-29, on RecordGold gold: the per-act text length and box of every act, as characters per page-equivalent (characters x page area / region area, the quantity the length signal compares). Geometry for reading it: a 300-DPI letter leaf holds about 32 lines of 60-90 characters, so a full page is roughly 1,900-2,900 characters. Chosen 400: below the 0.5th percentile of the padded regions the Perlector actually measures (728) with room, above the one-line cutoff of a four-line act crop (40 characters on 2,400x420 of a 2,550x3,300 leaf reads 333), and it flags 6 of 4,572 gold acts (0.13%) over padded regions, 3 (0.07%) over the bare boxes"
corpus = "RecordGold gold, 4,572 acts on 688 pages (page_manifest boxes and text; numbers only, no text or image used). Padded regions apply config/designator_padding.toml to each box without clamping to the page"
sample_unit = "act"
sample_count = 4572
statistic = "padded regions: minimum 78, 0.5th percentile 728, 1st 849, 5th 1,220, median 2,493 characters per page-equivalent; bare boxes: minimum 122, 0.5th 1,146, 1st 1,337, 5th 1,921, median 3,926. The floor is set under the 0.5th percentile of the padded regions, where the flag rate on honest acts is 0.13%"
calibrated_for_this_corpus = false
caveat = "MEASURED ON RECORDGOLD, NOT ON THE QUEBEC REGISTERS THIS INSTRUMENT SERVES; hence not claimed calibrated for this corpus. The honest acts it flags are very short acts (minimum 9 characters) in regions padded past them; those hold visibly as unknown for a reviewer, never as complete. It is one of three computed signals and never decides alone: one suspicious signal under a clean engine stop is unknown and holds; the engine's own length stop is authoritative whatever this says. It catches a reading that stops after a line or less of a four-line act crop; a full 76-character line cut from such a crop reads 633, above the floor, because honest padded acts already reach 728 at the 0.5th percentile, so both cannot hold and this floor gives up the second. The signal is not judged on a page under common/perlector_audit.py::LEGIBLE_PAGE_PIXELS (about 500,000 px), where a legible page of 32 lines cannot exist, which covers this repository's 200x260 fixture pages. Re-measure against the Quebec registers' own gold before relying on the floor there. pipeline/4_perlector/test_truncation.py pins the cut-off reading this floor catches and the short acts it must not"
