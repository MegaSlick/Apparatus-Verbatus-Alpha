# The Perlector protocol: what one whole-page reading is shown and how its
# truncation is judged. Its values are sealed into each run.

# The truncation instrument's length signal (`common/truncation.py`).
# A reading is length-suspicious when, scaled from its region to the whole page's
# area, it would carry fewer than this many characters:
#
#     characters * page_pixels < length_floor_characters_per_page * region_pixels
#
# Dimensionless on purpose: an absolute pixels-per-character ratio scales the
# wrong way (a real 300-DPI act region is 2,653 px/char, so every ordinary act
# tripped it). A fraction of the page's own area asks the same question at every
# scale, and the sealed value is what the run's config_digest records.
#
# The signal is judged only when the smallest page the reading spans is at least
# `legible_page_pixels`; otherwise it is recorded as not judged and votes neither
# way. 100,000 px: below that no real register page is legible, while a 72-DPI
# letter PDF (612x792 = 484,704, `pipeline/1_exemplar/pdf_render.py`) and every
# real scan are judged; this repository's 200x260 fixture pages (52,000) are not.
[truncation]
length_floor_characters_per_page = 400
legible_page_pixels = 100000

[truncation.provenance]
source = "measured, 2026-09-29, on RecordGold gold with operations/corpus/length_floor_calibration.py: the text length and bare box of every act, as characters per page-equivalent (characters x page area / box area, the quantity the length signal compares). The Perlector measures the same bare box: the union of the boxes an entry cites, neither padded nor clamped. Geometry for reading it: a 300-DPI letter leaf holds about 32 lines of 60-90 characters, so a full page is roughly 1,900-2,900 characters. Chosen 400: well under the 0.5th percentile of the bare boxes (1,146), above the one-line cutoff of a four-line region (40 characters on 2,400x420 of a 2,550x3,300 leaf reads 333), and it flags 3 of 4,572 gold acts (0.07%)"
corpus = "the Teklia RecordGold set: 4,572 acts on 688 pages, read from its page manifest as numbers only, no text or image kept"
sample_unit = "act"
sample_count = 4572
statistic = "characters per page-equivalent over bare boxes: minimum 122, 0.5th percentile 1,146, 1st 1,337, 5th 1,921, median 3,926. The floor sits under the 0.5th percentile, where the flag rate on honest acts is 0.07%"
calibrated_for_this_corpus = false
caveat = "MEASURED ON RECORDGOLD, NOT ON THE QUEBEC REGISTERS THIS INSTRUMENT SERVES; hence not claimed calibrated for this corpus. The honest acts it flags are short acts in boxes large for their text; those hold visibly as unknown for a reviewer, never as complete. It is one of three computed signals and never decides alone: one suspicious signal under a clean engine stop is unknown and holds; the engine's own length stop is authoritative whatever this says. It catches a reading that stops after a line or less of a four-line region; a full 76-character line cut from such a region reads 634, which it does not catch, so a reading that stops after one full line rests on the other signals. Re-measure against the Quebec registers' own gold before relying on the floor there. pipeline/4_perlector/test_truncation.py pins the cut-off reading this floor catches, the honest density it must not flag, and the legibility gate below a 72-DPI letter page"

# The whole-page render (`common/page_render.py`). maximum_edge makes the page's
# ink legible, not only its layout: 2,560 keeps a 300-DPI letter leaf
# (2,550x3,300 -> 1,978x2,560, 5.06 MP) and A4 inside the 27B Perlector row's
# max_pixels (5,299,200), so the chair sees exactly the rendered pixels (4,960
# image tokens for the letter page). The live reader refuses a request that does
# not fit its row before sending, never dropping or shrinking a page.
[page_context]
maximum_edge = 2560

# The page path's feed: what one page call shows the Perlector. Every input has
# a switch, and the page-feed record of every reading carries the switches it
# was read under. A switched-off input is absent from the prompt.
#
#   page_image           "legible" (the page render at [page_context]
#                        maximum_edge), "full" (the sealed page at its own
#                        size) or "off".
#   witnesses            "all", or a list of the witness chairs shown, each one
#                        of the sealed roster.
#   witness_units        "own" (each witness's text broken into its own units)
#                        or "flat" (one unit per witness: its whole page text).
#   witness_coordinates  whether each unit's box is shown as box_1000.
#   surya_lines          whether Surya's detected lines are shown (ids L1..Ln).
#   surya_blocks         whether Surya's detected blocks are shown (ids S1..Sn).
#   page_overlay         "off", or "boxes": a second image after the page
#                        render, a copy of it with every shown boxed id
#                        outlined and labelled (`common/page_overlay.py`).
#   page_types           "named": the answer names the page's type, how it is
#                        written, and each entry's kind (`common/page_types.py`).
#                        Required; "named" is its only value.
[feed]
page_image = "legible"
witnesses = "all"
witness_units = "own"
witness_coordinates = true
surya_lines = true
surya_blocks = true
page_overlay = "off"
page_types = "named"
