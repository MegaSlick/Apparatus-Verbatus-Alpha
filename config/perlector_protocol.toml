# R5a Perlector prior-draft protocol. These exact bytes are sealed into each run.
# `draft_fed` is a run flag: its default is withheld (B5a, 2026-09-28).
selection_rule = "digest-threshold-over-frame-page-seed-act.v1"
page_shared_prefix_policy = "page-shared-prefix-first.v1"
pass_b_fragment = "This is a prior reading. It may be correct, incomplete, or wrong. Independently reread the image, preserve what the ink supports, and change only what the image justifies."
# Sealed transport ceiling for the offline Perlector fixture. A logical act
# must fit in one request: callers hold with cluster-presentation-over-capacity
# rather than split its captures into candidate readings.
max_images = 32

# The truncation instrument's length signal (`pipeline/4_perlector/truncation.py`).
# A reading is length-suspicious when, scaled from its region to the whole page's
# area, it would carry fewer than this many characters:
#
#     characters * page_pixels < length_floor_characters_per_page * region_pixels
#
# Dimensionless on purpose: an absolute pixels-per-character ratio scales the
# wrong way (a real 300-DPI act crop is 2,653 px/char, so every ordinary act
# tripped it). A fraction of the page's own area asks the same question at every
# scale, and the sealed value is what the run's config_digest records. The
# signal is judged only on a page big enough to hold the density the floor
# describes (`common/perlector_audit.py::LEGIBLE_PAGE_PIXELS`); the 200x260
# fixture pages are not.
[truncation]
length_floor_characters_per_page = 640

[truncation.provenance]
source = "reasoned, 2026-09-29, from geometry and no reading of real ink. A 300-DPI letter leaf (2,550x3,300 px) at a 104 px line pitch -- doubled from the 52 px at 150 DPI config/pdf_render.toml records measuring on Hudson's Bay Company account books, not a figure that file states for 300 DPI -- holds about 32 lines of 60-90 characters, so a full written page is roughly 1,920 (32 x 60, the low end) to 2,900 characters. The floor is a third of the low end, 32 x 60 / 3 = 640: a region holds a share of the page's lines equal to its share of the page's area, so a reading under the floor fills less than a third of the lines its region holds. A reading that stops after one 60-character line of a region holding four lines sits at 480 and is flagged; one line of a region holding three or fewer, and a short act in a region cut to fit it, are not"
corpus = "none. The pixel geometry of a letter-sized 300-DPI render and its line pitch; no act of any real register has been read through this instrument. The 2026-09-27 RecordGold run records no readings against regions"
sample_unit = "act crop"
sample_count = 0
statistic = "none -- a reasoned floor from lines per page and characters per line, not a percentile of any measured distribution"
calibrated_for_this_corpus = false
caveat = "NOT CALIBRATED ON REAL INK. The floor is a third of a low-end full-page density, so it is a weak signal on a sparse hand (short lines, wide margins) and can hold a short act inside a padded crop; that holds visibly as unknown, for a reviewer, never as complete. It is one of three computed signals and never decides alone: one suspicious signal under a clean engine stop is unknown and holds; the engine's own length stop is authoritative whatever this says. The signal is not judged on a page under common/perlector_audit.py::LEGIBLE_PAGE_PIXELS (about 500,000 px), where a legible page of 32 lines cannot exist, which covers this repository's 200x260 fixture pages; on such a page only the engine's stop and the other two signals decide. Re-deriving against a real run's own Perlectiones (characters per page-equivalent over accepted acts, and over acts a reviewer confirmed truncated) is a prerequisite of relying on this floor, not an optional refinement; until it is done the instrument declares itself uncalibrated on every bundle through the Armarium's not-measured survey. pipeline/4_perlector/test_truncation.py pins the cut-off reading this floor catches and the short acts it must not"
