# Which product formats the Armarium writes beside EXPORT_MANIFEST.json, which is
# always the first member and is not optional.
#
# These values are sealed into the run's `config_digest` at the door, so the format
# choice is part of the run authority and a run's product cannot be re-projected
# under a different selection without a new run over the same Exemplar. The schema
# is closed: an unrecognised key or format name is refused rather than ignored.
schema = "armarium-formats.v1"
formats = ["text-bundle", "acts-database", "jsonl", "review-items"]

# False means the bundle carries digest-checked references to its pages and crops and
# says plainly that resolving the pixels needs source access. True copies the verified
# bytes of every page and crop into the bundle, and clean-machine verification then
# opens them.
embed_pixels = false
