# Real-chair serving catalogue, selected only with both
#
#   --models-config config/models-real.toml
#   --serving-recipes-config config/serving_recipes_real.toml
#
# Rows cover every configured chair in models-real.toml at every tier in
# pod_placement.toml. Every vLLM row is a complete launch shape marked
# `preflight_state = "unproven"`: what a request needs, not a claim that the
# model has started, fitted or answered on real silicon. The manager refuses an
# unproven row except for a qualification launch.
#
# Where each value comes from:
#
# `min_pixels` / `max_pixels`: each witness chair's own trained geometry, the
#   same at every tier. Chandra 3,136 / 6,291,456 (`chandra/model/util.py::
#   scale_to_fit`'s `max_size`); Churro 401,408 / 4,014,080 (its
#   preprocessor_config.json and the paper's 5,120-patch fine-tuning ceiling,
#   CHURRO paper section B.2); DAI 3,136 / 12,845,056 (its processor_config.json
#   `size`), with the model card's 1,500 px width applied client-side
#   (`DAI_MAX_WIDTH_PX` in pipeline/3_attestatores/feeding.py). The Perlector's
#   65,536 minimum is Qwen3.8's `shortest_edge`. Pixels are never reduced to fit
#   a context: that would trade a visible refusal for an unmeasured misreading.
#
# `max_model_len`: what a dense page needs. Chandra 18,000 (the vendor's own
#   launch); 20,480 at generic-80gb-plus, where a measured page used 6,731
#   prompt tokens and Chandra's declared 12,384-token answer bound must still
#   fit (19,115). Churro 32,768 at every tier: 5,120 image + 27 prompt + the vendor's
#   25,000-token answer bound (`DEFAULT_OCR_MAX_TOKENS`, churro v0.3.0) =
#   30,147; one such sequence is about 1.1 GiB of KV on this model. DAI 8,192
#   (a 1,500 x 2,500 record is about 4,800 image tokens; a taller one is refused
#   by request_capacity, never shrunk). The Perlector 65,536 (a dense whole-page
#   reading needs about 58,000). common/request_capacity.py computes these
#   costs and operations/serving/test_serving_catalogue_capacity.py checks
#   every row admits a dense page within its tier's `context_cap`.
#
# `max_num_batched_tokens`: 8,192 on the two page chairs so one image group
#   schedules in one engine step; 2,048 on DAI.
#
# `gpu_memory_utilization`: at generic-24gb, 0.85 for Chandra and 0.90 for DAI
#   (the VRAM arithmetic in config/pod_placement.toml) and 0.58 for Churro, a
#   planning value for its 3B weights; 0.78 / 0.88 at the larger tiers.
#
# `weights_gib` / `kv_gib_per_seq`: the weights on the card and the KV one
#   full-length sequence holds, in GiB, from the notes here, none measured:
#   DAI 15.5 and ~0.47 at 8,192 tokens; Churro 7 and ~1.1 at 32,768; the
#   Qwen3.8-27B 51.7 and 4 at 65,536 (its 16 full-attention layers only; the
#   reconstructor counts full-length sequences although its requests are shorter).
#   A row with both may be launched wider than its `max_num_seqs` on a card with
#   room (`operations/serving/capacity.py`); `max_num_seqs` stays the floor.
#   Chandra has no KV figure, so its rows launch as written.
#
# `enable_prefix_caching = false` on Chandra-2 and Qwen3.8 (Perlector,
#   reconstructor): both are hybrid Mamba/attention checkpoints, and with
#   prefix caching on vLLM 0.30.0 reserves two recurrent-state pages per
#   sequence instead of one (`MambaSpec.max_memory_usage_bytes`), memory these
#   rows budget for KV. vLLM enables it by default, so the row says false and
#   `manager.start` refuses a hybrid row with it on. DAI and Churro are full
#   attention and keep it on.
#
# Perlector and reconstructor at generic-24gb and generic-48gb are
#   `unsupported`: Qwen3.8-27B's bf16 weights measure 51.7 GiB, more than
#   either card class holds.
#
# `generation_config = "vllm"` on every row: under "auto" vLLM 0.30.0 fills
#   any sampling field a request leaves out from the model's
#   generation_config.json, unseen on the wire. Every request carries its
#   chair's full sampling row from config/decoding.toml, so nothing is filled
#   from a file. The file's `eos_token_id`s are still added as stop tokens.
#
# `trust_remote_code = false`: none of the pinned repositories ships code or an
#   `auto_map`.
#
# `patch_size` / `merge_size`: the vision encoder's geometry from the pinned
#   revision's preprocessor_config.json or processor_config.json, whichever it
#   ships; `ServingManager.start` checks them against the verified snapshot.
#   They decide what one image costs in prompt tokens (Qwen3-VL: patch 16,
#   1,024 px per token; Qwen2.5-VL: patch 14, 784 px per token).
#
# `startup_timeout_seconds`: from launch to a healthy endpoint, the exact model
#   id and one answered probe. 600 s at generic-24gb from cold-start
#   measurements on an RTX 4090 (Chandra about 220 s, Churro up to 210 s on a
#   loaded host, DAI about 60 s); the larger witness tiers reuse those figures
#   without having been measured. The Perlector's 600 s covers a measured cold
#   start of about 375 s (weights 95 s, torch.compile 107 s, profiling 76 s,
#   multimodal warm-up 20 s).
#
# `request_timeout_seconds`: one non-streaming reading, which returns nothing
#   until generation completes. 600 s for witnesses, 1,800 s for the Perlector;
#   not yet measured.
#
# The record detector (`secondary_proposer`) is `in-process` on the CPU; its
#   `imgsz`, `conf_bp`, `iou_bp` and `max_det` are Ultralytics' predict defaults
#   for this checkpoint, written out so the sealed catalogue says what it was
#   asked with. Surya is a `subprocess` in its own locked environment
#   (operations/serving/surya); its thread count and time allowances are
#   planning values. Runner processes each read one slice of the pages with
#   `threads` threads, as many processes as the CPUs the stage can use (its
#   affinity mask under the container's cgroup quota) give `threads` each: one
#   process at 8 threads took 35-66 s a page on live pods while the card sat
#   idle. A row may set `workers` as a ceiling on the processes; these set none.
#
# Not yet verified on a pod: whether vLLM 0.30.0 honours `--mm-processor-kwargs`
#   for Qwen3-VL (each call record's `usage_reconciliation` compares the
#   engine's image-token count with request_capacity's), and vLLM's default
#   `--limit-mm-per-prompt` against the Perlector's requests of up to 32 images.
schema = "serving-recipes.v1"

