# A whole-page reading of the dense default page needs about 58,000 tokens, so
# the context is 65,536. Only the 16
# full-attention layers of 64 keep KV per token: 16 layers x 4 KV heads x 256
# dims x 2 (K and V) x 2 bytes = 64 KiB a token, 4 GiB for one 65,536-token
# sequence (from the model card's shape, not measured). The 55.6 GB of bf16
# weights leave 0.88 x 80 GB - 55.6 GB = 14.8 GB on an 80 GB card for KV, the
# linear-attention layers' per-sequence state, activations and the vision
# encoder's peak. Two full-length pages take 8 GiB of it; four would take 16
# GiB, more than the whole margin. So two sequences at once, the most an 80 GB
# card of this tier holds at full length with room left for the rest (a 96 GB
# card holds more, but the row serves every card of the tier). On the tier's
# one reviewed card, the 96 GB RTX PRO 6000, 0.88 x 96 GB - 55.6 GB = 28.9 GB
# holds four full-length pages (16 GiB) with 11.7 GB left, so the row asks for
# four: on an 80 GB card vLLM schedules only what its KV pool holds and queues
# the rest, so the cap costs it nothing but waiting. At two, a page took about
# 3 minutes with the GPU half idle between calls. The stage's default
# concurrency is this value. Prefill chunks of 8,192 tokens halve the engine
# steps a 58,000-token page takes to read in.
max_model_len = 65536
max_num_seqs = 4
weights_gib = "51.7"
kv_gib_per_seq = "4"
max_num_batched_tokens = 8192
gpu_memory_utilization = "0.88"
min_pixels = 65536
max_pixels = 5299200
patch_size = 16
merge_size = 2
enable_prefix_caching = false  # hybrid attention (few full-attention layers); see header note
enforce_eager = false
trust_remote_code = false
generation_config = "vllm"
preflight_state = "unproven"
startup_timeout_seconds = 600  # measured cold start ~375 s (see the header) plus 60% margin
poll_interval_seconds = 2
request_timeout_seconds = 1800  # UNMEASURED planning value: no real reading has been timed
readiness_probe = { kind = "chat-completions", request_json = "{\"messages\":[{\"role\":\"user\",\"content\":\"READY\"}],\"max_tokens\":4}" }

