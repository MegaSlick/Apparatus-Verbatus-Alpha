# Real-chair serving catalogue.  It is selected only with both:
#
#   --models-config config/models-real.toml
#   --serving-recipes-config config/serving_recipes_real.toml
#
# It deliberately leaves the default fixture catalogue unchanged.  Every vLLM
# row is a complete, locked launch shape but `preflight_state = "unproven"`:
# these are planning inputs, not a claim that any listed model has started,
# fitted, or answered on real silicon.  A serving manager refuses an unproven
# row before it opens a process.
#
# WHAT IS NO LONGER MERELY UNPROVEN.  Every `max_model_len` in this file was
# once 2,048 / 4,096 / 8,192 by tier, and that set was not unproven -- it was
# measurably wrong.  A 300-dpi A4 page costs 1,715 prompt tokens on the
# Qwen3-VL chairs and 2,280 on the Qwen2.5-VL chairs at the 24 GB tier's
# `max_pixels`, before a word of prompt is counted; against 2,048 the request
# is refused by the engine with HTTP 400 and no reading at all, and it was
# refused for every chair at that tier.  Those are arithmetic, not
# predictions: `common/request_capacity.py` computes them from the fields
# below, and `common/test_request_capacity.py` pins them against the
# per-chair processor measurement they were taken from.
#
# U15 (Tyrel's ruling, 2026-09-06 -- CORRECTION_PLAN_2026-09-06.md Q1/Q2/Q5)
# RETIRES THE PER-TIER PIXEL LADDER.  Each witness chair now sees its own
# *trained* geometry at every tier, not a generic per-tier budget that matched
# no chair: Chandra (`designator_structure` and `attestator_1`) 3,136 /
# 6,291,456 px (`chandra/model/util.py::scale_to_fit`'s own `max_size`) at
# `max_model_len = 18,000` (the vendor's own `--max-model-len`); Churro
# (`attestator_3`) 401,408 / 4,014,080 px (its `preprocessor_config.json` and
# the paper's own 5,120-patch fine-tuning ceiling, CHURRO paper §B.2) at
# `max_model_len = 8,192` (5,100 image + 27 prompt + 1,905 answer -- U14 --
# clears it with room to spare); DAI (`attestator_2`) 3,136 / 2,359,296 px,
# equal to `DAI_MAX_TOTAL_PIXELS` in `pipeline/3_attestatores/feeding.py` so
# the client-side crop alone binds, at the `max_model_len = 8,192` it already
# carried.  `max_num_batched_tokens = 8,192` on the two page chairs (Chandra,
# Churro) so one whole image group schedules without a second engine step
# (POD QUESTION P4); DAI's stays 2,048, unmoved by this ruling.
# `gpu_memory_utilization` moves only where the arithmetic said 0.58 could not
# hold the row: Chandra's `generic-24gb` row to `"0.85"` (the old pipeline's
# own 4090 profile; 14.0 GiB needed of 24, VRAM arithmetic in the plan above).
# Every other row's fraction is unmoved -- 0.78 / 0.88 at the larger tiers
# were already ample for every chair.
#
# `config/pod_placement.toml`'s tier ceilings move with them: `pixel_cap =
# 2,560` at every tier (2,560² = 6,553,600 >= Chandra's 6,291,456, the largest
# any row now asks for), `context_cap = 20,480` (admits Churro's declared
# 20,000-token generation bound) except `generic-80gb-plus`, raised to
# `32,768` for the Perlector's two-view page-fallback act (20,400 image tokens
# alone); `engine_memory_fraction = "0.90"` at `generic-24gb` only (0.58 had
# no derivation anywhere in this tree or the old pipeline, which never served
# below 0.85 on a comparable card, and under `residency = "single"` it was a
# co-residency leftover that only ever subtracted pixels).
# `operations/serving/test_serving_catalogue_capacity.py` reads this file and
# asserts that every row it ships passes -- at one and at two capture views for
# the Perlector -- and that none exceeds its tier's `context_cap`.
#
# ONE MEASURED SHAPE STILL DOES NOT FIT, and it is recorded rather than papered
# over: a two-capture-view *page-fallback* act -- an act whose bounds are the
# whole page, seen from two captures -- sends four page-sized images, which at
# the 80 GB+ tier's `max_pixels` is 20,400 prompt tokens before a word of
# prompt.  It fits at 24 GB and 48 GB and, since U15 raised the 80 GB+ context
# to 32,768, now fits there too; the pinned case in the capacity test says so
# by name.
#
# CHURRO'S ANSWER BUDGET IS NOW THE VENDOR GRAMMAR'S OWN COST.  The live chair
# is asked in the system string the vendor's own registry resolves for
# `stanford-oval/churro-3B` (`common/churro_document.py`), which is one
# sentence: its measured prompt is 27 tokens.  U14 re-measured the dense-page
# answer over the `HistoricalDocument` grammar it is actually read under --
# 1,631 (the retired JSON contract) -> 1,905 -- and the sealed
# `MEASURED_DENSE_PAGE_ANSWER_TOKENS["attestator_3"]` now carries that cost
# directly rather than a separately-tracked shortfall. Every row still holds
# the request: 5,100 image + 27 prompt + 1,905 answer = 7,032, against
# `max_model_len = 8,192` at every tier.
#
# `max_pixels` is deliberately NOT reduced to fit a smaller context.  Cutting
# pixels to fit a context trades a measurable refusal for an unmeasurable
# misreading, which GOALS 2 does not permit; the lever that works is the
# context, and each chair's is now sized to what its own trained geometry
# needs.
#
# `enable_prefix_caching = false` ON THE TWO HYBRID-ATTENTION CHAIRS.
# Chandra-2 (`designator_structure`, `attestator_1`) has only 8 full-attention
# layers of 32, and the Perlector's Qwen3.8-27B only 16 of 64; the rest are
# linear/recurrent layers whose per-sequence state is not a cache of tokens
# the way a full-attention layer's KV is, so a prefix hit that reuses another
# sequence's recurrent state would not be reusing that sequence's *prompt* --
# it would be reusing state computed for a different one (measured in
# `CORRECTION_PLAN_2026-09-06.md`'s VRAM arithmetic: "Chandra-2 is a hybrid
# stack with only 8 full-attention layers... Qwen3.8 are hybrid -- 8 of 32 and
# 16 of 64 layers are full attention").  DAI and Churro are ordinary
# Qwen2.5-VL (full attention throughout) and keep prefix caching on.
#
# THE PERLECTOR'S `generic-24gb` AND `generic-48gb` ROWS PROMISE A SHAPE NO
# CARD OF THAT CLASS CAN SERVE (hostile review Q5).  Its Qwen3.8-27B weights
# measure 51.7 GiB of bf16 from the repository's own safetensors sizes -- more
# than either card class holds before a token of KV, vision peak or engine
# overhead is counted, so only `generic-80gb-plus` (a 64 GiB+ floor) can ever
# serve it.  The two smaller rows are kept for catalogue coverage, not as a
# claim that a 24 or 48 GiB card could run them; `preflight_state =
# "unproven"` already says so per-row, and this comment records the measured
# reason rather than leaving a reader to assume the rows were merely untested.
#
# `generation_config = "auto"` ON EVERY ATTESTATOR (WITNESS) ROW (U4 admitted
# the value; `operations/serving/config.py` accepts it for Attestator rows
# only -- `designator_structure` is a Designator, not a witness, and the
# Perlector is neither, so both stay `"vllm"`).  `"vllm"` silently starts from
# an empty sampling-parameter dict and discards every model-shipped default --
# Churro's `repetition_penalty: 1.05`, DAI's second EOS id, Chandra's own
# `generation_config.json` -- which `CORRECTION_PLAN_2026-09-06.md` finding
# (b) confirms against `vllm/config/model.py::get_diff_sampling_param`.
# `"auto"` makes the manager receipt record the digest of the chair's own
# `generation_config.json`, so the pinned profile is auditable by revision
# rather than merely assumed unchanged.  `designator_structure` serves the
# same Chandra-2 checkpoint (whose generation_config.json is pinned through
# attestator_1's row) but is a Designator, not a witness, so the schema keeps
# it at `"vllm"`; the Perlector's own weights ship no generation_config.json
# worth pinning.  Both stay `"vllm"`, and the manager forces temperature 0 on
# every reading regardless.
#
# WHAT IS STILL UNPROVEN, AND IT IS THE WHOLE OF IT: whether a card at each
# tier has the VRAM for these contexts.  Raising `max_model_len` moves KV-cache
# memory, and nothing here has been measured on real silicon -- these rows say
# what a request *needs*, and only a pod can say what a card *has*.  A row that
# starts and answers is still an unproven row until preflight says otherwise.
#
# Rows cover every configured chair in models-real.toml at every tier in
# pod_placement.toml.  The secondary proposer has no row because it is absent
# there by Tyrel's ruling of 2026-08-12, and an absent chair needs no coverage.
# The common stage parser seals the selected catalogue's exact bytes, so using
# this catalogue cannot silently share a run authority with the fixture-only
# catalogue.
#
# `patch_size`/`merge_size` are the chair's vision-encoder geometry, read from
# the pinned revision's own processor configuration: `preprocessor_config.json`
# where the repository ships one, `processor_config.json` (under its
# `image_processor` object) where it does not.  Which file exists differs by
# chair -- chandra-ocr-2 ships both, churro-3B and Qwen3.8-27B only the first,
# and `attestator_2`'s DAI revision only the second, so naming one file for all
# four named a file that 404s for DAI.  `ServingManager.start` proves these two
# numbers against whichever file the verified snapshot carries, so a wrong
# declaration here is a named refusal on the machine that has the weights
# rather than a silently mis-counted image.  They are not vLLM
# flags -- vLLM reads them from the model repository -- and they are recorded
# here because they are what decides how many prompt tokens one image costs
# (`common/request_capacity.py`), which no other field in this row can say.
# The two families differ: Chandra and the Perlector are Qwen3-VL, patch 16,
# 1,024 px per image token; DAI and Churro are Qwen2.5-VL, patch 14, 784 px per
# image token.  A row that omits them still launches; what it cannot do is have
# a request checked against it before it is sent.
#
# `request_timeout_seconds` bounds one non-streaming reading request, which
# returns nothing until generation completes.  Witness rows carry 600s,
# Perlector rows 1800s — both UNMEASURED planning values, not a claim that any
# reading has ever been timed on real silicon.
schema = "serving-recipes.v1"

# Chandra fills the Designator structure chair and Attestator 1.  They have
# separate rows because a chair, not merely a model repository, is the serving
# contract and receipt identity.
[[profiles]]
kind = "vllm"
recipe = "unproven-real-designator"
chair = "designator_structure"
tier = "generic-24gb"
host = "127.0.0.1"
port = 8101
served_model_id = "designator-structure"
dtype = "bfloat16"
seed = 0
required_packages = { vllm = "0.27.1", transformers = "5.14.1", "qwen-vl-utils" = "0.0.14" }
max_model_len = 18000
max_num_seqs = 1
max_num_batched_tokens = 8192
gpu_memory_utilization = "0.85"
min_pixels = 3136
max_pixels = 6291456
patch_size = 16
merge_size = 2
enable_prefix_caching = false  # hybrid attention (few full-attention layers); see header note
enforce_eager = false
trust_remote_code = true
enable_tower_connector_lora = false
max_lora_rank = 64
generation_config = "vllm"
preflight_state = "unproven"
startup_timeout_seconds = 300
poll_interval_seconds = 2
request_timeout_seconds = 600  # UNMEASURED planning value: no real reading has been timed
readiness_probe = { kind = "chat-completions", request_json = "{\"messages\":[{\"role\":\"user\",\"content\":\"READY\"}],\"max_tokens\":4}" }

