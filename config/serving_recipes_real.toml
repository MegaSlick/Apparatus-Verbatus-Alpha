# Real-chair serving catalogue.  It is selected only with both:
#
#   --models-config config/models-real.toml
#   --serving-recipes-config config/serving_recipes_real.toml
#
# It deliberately leaves the default fixture catalogue unchanged.  Every vLLM
# row is a complete, locked launch shape but `preflight_state = "unproven"`:
# these are planning inputs, not a claim that any listed model has started,
# fitted, or answered on real silicon.  Attestator 1 instead has a `captured`
# row at every tier: Chandra is asked once, by the Designator structure chair,
# and that retained response is filed as Attestator 1's Testimonium rather
# than served a second time.  A serving manager refuses to launch a captured
# row by that name before it opens a process.
#
# Rows cover every configured chair in models-real.toml at every tier in
# pod_placement.toml.  The secondary proposer has no row because it is absent
# there by Tyrel's ruling of 2026-08-12, and an absent chair needs no coverage.
# The common stage parser seals the selected catalogue's exact bytes, so using
# this catalogue cannot silently share a run authority with the fixture-only
# catalogue.
#
# `request_timeout_seconds` bounds one non-streaming reading request, which
# returns nothing until generation completes.  Witness rows carry 600s,
# Perlector rows 1800s — both UNMEASURED planning values, not a claim that any
# reading has ever been timed on real silicon.
schema = "serving-recipes.v1"

# Chandra fills the Designator structure chair and Attestator 1.  They have
# separate rows because a chair, not merely a model repository, is the serving
# contract and receipt identity; only the structure chair is launched.
[[profiles]]
kind = "vllm"
recipe = "unproven-real-designator"
chair = "designator_structure"
tier = "generic-24gb"
host = "127.0.0.1"
port = 8101
served_model_id = "designator-structure"
dtype = "bfloat16"
seed = 0
required_packages = { vllm = "0.27.1", transformers = "5.14.1", "qwen-vl-utils" = "0.0.14" }
max_model_len = 2048
max_num_seqs = 1
max_num_batched_tokens = 512
gpu_memory_utilization = "0.58"
min_pixels = 3136
max_pixels = 1806336
enable_prefix_caching = true
enforce_eager = false
trust_remote_code = true
enable_tower_connector_lora = false
max_lora_rank = 64
generation_config = "vllm"
preflight_state = "unproven"
startup_timeout_seconds = 300
poll_interval_seconds = 2
request_timeout_seconds = 600  # UNMEASURED planning value: no real reading has been timed
readiness_probe = { kind = "chat-completions", request_json = "{\"messages\":[{\"role\":\"user\",\"content\":\"READY\"}],\"max_tokens\":4}" }

