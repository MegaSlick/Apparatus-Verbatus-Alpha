# Real-chair serving catalogue.  It is selected only with both:
#
#   --models-config config/models-real.toml
#   --serving-recipes-config config/serving_recipes_real.toml
#
# It deliberately leaves the default fixture catalogue unchanged.  Every vLLM
# row is a complete, locked launch shape but `preflight_state = "unproven"`:
# these are planning inputs, not a claim that any listed model has started,
# fitted, or answered on real silicon.  A serving manager refuses an unproven
# row before it opens a process.
#
# WHAT IS NO LONGER MERELY UNPROVEN.  Every `max_model_len` in this file was
# once 2,048 / 4,096 / 8,192 by tier, and that set was not unproven -- it was
# measurably wrong.  A 300-dpi A4 page costs 1,715 prompt tokens on the
# Qwen3-VL chairs and 2,280 on the Qwen2.5-VL chairs at the 24 GB tier's
# `max_pixels`, before a word of prompt is counted; against 2,048 the request
# is refused by the engine with HTTP 400 and no reading at all, and it was
# refused for every chair at that tier.  Those are arithmetic, not
# predictions: `common/request_capacity.py` computes them from the fields
# below, and `common/test_request_capacity.py` pins them against the
# per-chair processor measurement they were taken from.
#
# THIS CATALOGUE RETIRES THE PER-TIER PIXEL LADDER.  Each witness chair now sees its own
# *trained* geometry at every tier, not a generic per-tier budget that matched
# no chair: Chandra (`designator_structure` and `attestator_1`) 3,136 /
# 6,291,456 px (`chandra/model/util.py::scale_to_fit`'s own `max_size`) at
# `max_model_len = 18,000` (the vendor's own `--max-model-len`); Churro
# (`attestator_3`) 401,408 / 4,014,080 px (its `preprocessor_config.json` and
# the paper's own 5,120-patch fine-tuning ceiling, CHURRO paper §B.2) at
# `max_model_len = 32,768` at every tier (5,120 image + 27 prompt + the
# vendor's complete 25,000-token answer bound = 30,147). DAI (`attestator_2`)
# 3,136 / 12,845,056 px, the vendor processor's own `size` in
# `processor_config.json`; the only ceiling on top is the model card's 1,500 px
# width, applied client-side (`DAI_MAX_WIDTH_PX` in
# `pipeline/3_attestatores/feeding.py`), so a 1,500x2,500 act costs about
# 4,800 image tokens inside the `max_model_len = 8,192` it already carried and
# a taller one is refused by `request_capacity`, never shrunk.  `max_num_batched_tokens = 8,192` on the two page chairs (Chandra,
# Churro) so one whole image group schedules without a second engine step
# (POD QUESTION P4); DAI's stays 2,048, unmoved by this ruling.
# `gpu_memory_utilization` moves only where the arithmetic said 0.58 could not
# hold the row: Chandra's `generic-24gb` row to `"0.85"` (the old pipeline's
# own 4090 profile; 14.0 GiB needed of 24, VRAM arithmetic in the plan above).
# Every other row's fraction is unmoved -- 0.78 / 0.88 at the larger tiers
# were already ample for every chair.
#
# `config/pod_placement.toml`'s tier ceilings move with them: `pixel_cap =
# 3,584` at every tier (3,584² = 12,845,056, DAI's vendor `max_pixels`, the
# largest any row now asks for), `context_cap = 32,768` at every tier (admits Churro's
# 25,000-token generation bound, and at `generic-80gb-plus` the Perlector's
# two-view page-fallback act, 20,400 image tokens alone); `engine_memory_fraction = "0.90"` at `generic-24gb` only (0.58 had
# no derivation anywhere in this tree or the old pipeline, which never served
# below 0.85 on a comparable card, and under `residency = "single"` it was a
# co-residency leftover that only ever subtracted pixels).
# `operations/serving/test_serving_catalogue_capacity.py` reads this file and
# asserts that every row it ships passes -- at one and at two capture views for
# the Perlector -- and that none exceeds its tier's `context_cap`.
#
# ONE MEASURED SHAPE STILL DOES NOT FIT, and it is recorded rather than papered
# over: a two-capture-view *page-fallback* act -- an act whose bounds are the
# whole page, seen from two captures -- sends four page-sized images, which at
# the 80 GB+ tier's `max_pixels` is 20,400 prompt tokens before a word of
# prompt.  Its token count fits the smaller tiers' contexts, but its weights
# rule those tiers out.  The 80 GB+ row has a 32,768-token context; the pinned
# capacity case says the request fits that row.
#
# CHURRO'S ANSWER BOUND IS THE VENDOR'S OWN, AND EVERY TIER HOLDS IT.  The live
# chair is asked in the system string the vendor's own registry resolves for
# `stanford-oval/churro-3B` (`common/churro_document.py`), whose measured prompt
# is 27 tokens, and the vendor's `DEFAULT_OCR_MAX_TOKENS` is 25,000
# (`src/churro_ocr/providers/specs.py:77` at v0.3.0).  A 5,120-token page image
# plus that prompt plus that bound is 30,147 tokens, so every Churro row carries
# `max_model_len = 32,768`.  That is cheap on this model: Qwen2.5-VL-3B keeps
# 36 layers x 2 KV heads x 128 dims, 36,864 bytes of bf16 KV per token, so one
# 32,768-token sequence is 1.1 GiB beside about 7 GiB of weights.  (Measured
# dense-page answers are ~1,905 tokens; the row is sized for the vendor's
# bound, not for the typical page.)  If a card class ever cannot hold that
# context, the Churro row for it must be `unsupported`, as the Perlector's are:
# `live_witness.request_capacity_or_refuse` reserves the full declared bound
# for a Churro page, so a row that cannot hold it refuses the request rather
# than letting the engine stop the answer short.  The pinned Churro config
# declares max_position_embeddings = 128000:
# https://huggingface.co/stanford-oval/churro-3B/blob/ca2150ea465d5a3d67818c50e234b9422619c75d/config.json
# The row remains preflight-unproven.
#
# `max_pixels` is deliberately NOT reduced to fit a smaller context.  Cutting
# pixels to fit a context trades a measurable refusal for an unmeasurable
# misreading, and that trade is never made here; the lever that works is the
# context, and each chair's is now sized to what its own trained geometry
# needs.
#
# `enable_prefix_caching = false` ON THE TWO HYBRID-ATTENTION CHAIRS.
# Chandra-2 (`designator_structure`, `attestator_1`) has only 8 full-attention
# layers of 32, and the Perlector's Qwen3.8-27B only 16 of 64; the rest are
# linear/recurrent layers whose per-sequence state is not a cache of tokens
# the way a full-attention layer's KV is, so a prefix hit that reuses another
# sequence's recurrent state would not be reusing that sequence's *prompt* --
# it would be reusing state computed for a different one (measured in the
# VRAM arithmetic: "Chandra-2 is a hybrid
# stack with only 8 full-attention layers... Qwen3.8 are hybrid -- 8 of 32 and
# 16 of 64 layers are full attention").  DAI and Churro are ordinary
# Qwen2.5-VL (full attention throughout) and keep prefix caching on.
#
# THE PERLECTOR'S `generic-24gb` AND `generic-48gb` ROWS PROMISE A SHAPE NO
# CARD OF THAT CLASS CAN SERVE.  Its Qwen3.8-27B weights
# measure 51.7 GiB of bf16 from the repository's own safetensors sizes -- more
# than either card class holds before a token of KV, vision peak or engine
# overhead is counted, so only `generic-80gb-plus` (a 64 GiB+ floor) can ever
# serve it.  The two smaller tiers have unsupported rows so the catalogue
# still names their measured refusal rather than offering impossible launches.
#
# `generation_config = "auto"` ON EVERY ATTESTATOR (WITNESS) ROW.
# `operations/serving/config.py` accepts it for Attestator rows
# only -- `designator_structure` is a Designator, not a witness, and the
# Perlector is neither, so both stay `"vllm"`.  In vLLM 0.27.1
# (`vllm/config/model.py`) `"vllm"` drops the model's sampling defaults
# (`repetition_penalty`, `temperature`, `top_k`, `top_p`, ...) but NOT its
# `eos_token_id`s: `try_get_generation_config` loads the file under both
# settings and `SamplingParams.update_from_generation_config` adds the ids as
# stop tokens, so the Designator keeps Chandra's 248044 and the Perlector its
# second id 248044 either way.  `"auto"` additionally applies the sampling
# defaults, which is what the witnesses want (Churro's `repetition_penalty:
# 1.05`) and the Designator and Perlector must not have (the Perlector's file
# ships temperature 1.0, top_k 20, top_p 0.95; the manager forces temperature 0
# regardless).  `"auto"` also makes the manager receipt record the digest of the
# chair's own `generation_config.json`.  Chandra-2's file
# (`designator_structure` serves the same checkpoint) carries only the EOS id
# and `use_cache`; the Perlector's carries the sampling values above.
#
# `min_pixels` ON THE PERLECTOR (65,536) is the vendor default: Qwen3.8-27B's
# `preprocessor_config.json` says `shortest_edge = 65536`; the 3,136 this row
# carried was the Qwen2.5-VL processor's figure.  Every image is therefore at
# least 64 tokens.  `trust_remote_code = false` on every row: none of the four
# pinned repositories ships a `.py` file or an `auto_map` (checked on the
# Hugging Face file listings), and no vendor's own launch passes the flag.
#
# UNKNOWNS TO VERIFY ON THE NEXT POD (nothing here has run on silicon):
#   1. Whether vLLM 0.27.1 honours `--mm-processor-kwargs` `min_pixels` /
#      `max_pixels` for Qwen3-VL (Chandra, Perlector).  Compare the served
#      `usage.prompt_tokens_details` image-token counts with
#      `common/request_capacity.py`'s count for the same image.
#   2. vLLM's default `--limit-mm-per-prompt` (images per request) against the
#      Perlector's requests of up to 32 images; raise it in the argv if the
#      engine refuses.
#
# WHAT IS STILL UNPROVEN, AND IT IS THE WHOLE OF IT: whether a card at each
# tier has the VRAM for these contexts.  Raising `max_model_len` moves KV-cache
# memory, and nothing here has been measured on real silicon -- these rows say
# what a request *needs*, and only a pod can say what a card *has*.  A row that
# starts and answers is still an unproven row until preflight says otherwise.
#
# Rows cover every configured chair in models-real.toml at every tier in
# pod_placement.toml.  The secondary proposer is DAI's own record detector, run
# `kind = "in-process"` by the Designator on the CPU after the structure chair
# has closed: no server, no port, no share of the card.  Its `imgsz`, `conf_bp`,
# `iou_bp` and `max_det` are Ultralytics' own predict defaults for this
# checkpoint (imgsz from the checkpoint's own training arguments), written out
# so the sealed catalogue says what the detector was asked with; none is tuned.
# The common stage parser seals the selected catalogue's content, so using
# this catalogue cannot silently share a run authority with the fixture-only
# catalogue.
#
# `patch_size`/`merge_size` are the chair's vision-encoder geometry, read from
# the pinned revision's own processor configuration: `preprocessor_config.json`
# where the repository ships one, `processor_config.json` (under its
# `image_processor` object) where it does not.  Which file exists differs by
# chair -- chandra-ocr-2 ships both, churro-3B and Qwen3.8-27B only the first,
# and `attestator_2`'s DAI revision only the second, so naming one file for all
# four named a file that 404s for DAI.  `ServingManager.start` proves these two
# numbers against whichever file the verified snapshot carries, so a wrong
# declaration here is a named refusal on the machine that has the weights
# rather than a silently mis-counted image.  They are not vLLM
# flags -- vLLM reads them from the model repository -- and they are recorded
# here because they are what decides how many prompt tokens one image costs
# (`common/request_capacity.py`), which no other field in this row can say.
# The two families differ: Chandra and the Perlector are Qwen3-VL, patch 16,
# 1,024 px per image token; DAI and Churro are Qwen2.5-VL, patch 14, 784 px per
# image token.  A row that omits them still launches; what it cannot do is have
# a request checked against it before it is sent.
#
# `request_timeout_seconds` bounds one non-streaming reading request, which
# returns nothing until generation completes.  Witness rows carry 600s,
# Perlector rows 1800s — both UNMEASURED planning values, not a claim that any
# reading has ever been timed on real silicon.
#
# `startup_timeout_seconds` is the whole budget `manager.py::_wait_until_ready`
# allows from process launch to a healthy endpoint, the exact model id and a
# completed inference probe; on expiry the chair is killed and PREFLIGHT goes
# red.  It should cover weight bytes / volume read rate + torch.compile +
# profiling and warm-up + margin.  At generic-24gb, Chandra
# (`designator_structure`, `attestator_1`) uses 600 s after its ~220 s cold
# RTX 4090 measurement; Churro (`attestator_3`) after its measurement of up to
# ~210 s on a loaded host; and DAI (`attestator_2`) after its ~60 s measurement
# (all 2026-09-27).
# The 48 GB and 80 GB+ witness-row budgets extrapolate those 24 GB measurements;
# they are not measurements at those tiers. The Perlector on
# `generic-80gb-plus` is sized from retained vLLM logs (a cold start measured
# about 375 s on 2026-09-22/23: weights 95 s off the volume,
# torch.compile 107 s, profiling 76 s, multimodal warm-up 20 s).  The Perlector
# keeps torch.compile: its 90-107 s is paid once per start, while eager mode's
# cost to each of a run's ~34-51 calls on this hybrid-attention model is
# unmeasured.  A persisted compile cache would not help a first start on a
# fresh volume.
schema = "serving-recipes.v1"

# Chandra fills the Designator structure chair and Attestator 1.  They have
# separate rows because a chair, not merely a model repository, is the serving
# contract and receipt identity.
[[profiles]]
kind = "vllm"
recipe = "unproven-real-designator"
chair = "designator_structure"
tier = "generic-24gb"
host = "127.0.0.1"
port = 8101
served_model_id = "designator-structure"
dtype = "bfloat16"
seed = 0
required_packages = { vllm = "0.27.1", transformers = "5.14.1", "qwen-vl-utils" = "0.0.14" }
max_model_len = 18000
max_num_seqs = 1
max_num_batched_tokens = 8192
gpu_memory_utilization = "0.85"
min_pixels = 3136
max_pixels = 6291456
patch_size = 16
merge_size = 2
enable_prefix_caching = false  # hybrid attention (few full-attention layers); see header note
enforce_eager = false
trust_remote_code = false
enable_tower_connector_lora = false
max_lora_rank = 64
generation_config = "vllm"
preflight_state = "unproven"
startup_timeout_seconds = 600  # 24 GB RTX 4090 measurement; see header
poll_interval_seconds = 2
request_timeout_seconds = 600  # UNMEASURED planning value: no real reading has been timed
readiness_probe = { kind = "chat-completions", request_json = "{\"messages\":[{\"role\":\"user\",\"content\":\"READY\"}],\"max_tokens\":4}" }

