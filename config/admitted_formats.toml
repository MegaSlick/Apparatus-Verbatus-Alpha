# The decoder route for each format the door can name.  This is deliberately *not*
# an admission list: Tyrel ruled that no real, uncorrupted image is declined by
# policy.  A decoder gap is recorded as an alarm carrying the filename, never as a
# configuration decision about whether its format may enter.
#
# Actions are a closed set:
#   "raster"       — decode one raster image and retain its original bytes. A
#                    decoder-reported multi-frame raster is fanned out per frame.
#   "render-pages" — fan a multi-page container out and rasterise every page once
#                    at the door, sealing lossless PNG page pixels.
#
# PDF uses full-page PDFium rasterisation, never embedded-image extraction. TIFF
# uses the same page-fan-out shape so a multi-page scan cannot lose later pages.
# Rows cover every format `image_formats.sniff()` can name; a reader absence becomes
# a named `unsupported-variant` alarm rather than a `refused-format` policy result.

[format]
png = "raster"
jpeg = "raster"
tiff = "render-pages"
pdf = "render-pages"
gif = "raster"
heic = "raster"
bmp = "raster"
webp = "raster"
