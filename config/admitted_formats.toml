# The admission list — what may enter this pipeline at all, by format.
#
# Spec 03's ledger items live here as configuration rather than as a conditional
# buried in the decoder, so Tyrel's rulings are one line each:
#
#   * `.heic` — the two readings disagree and it is his to settle. Audit Q14 says
#     admit it (a real camera format; a refused page is a page nobody reads);
#     spec 03 says refuse it by name (the sources are flatbed scans, and admitting
#     a format nothing produces widens the decode surface for no coverage). It is
#     refused by name here until he rules. Turning that line to "admit" is not
#     sufficient on its own: `pipeline/1_exemplar/image_formats.py` has no
#     structural validator for ISO-BMFF/HEVC and `admission.py` refuses to load a
#     policy that admits a format nothing can verify. See the gate package.
#   * `.gif` — refused by name, not disputed by either reading.
#   * `pdf` — **refused by name here, and that is the shipped default.** Spec 03
#     recommends admitting PDF and rendering it per page at the door, and the
#     renderer for it is written and tested (`pipeline/1_exemplar/pdf_render.py`).
#     It is held behind this line because the renderer does not yet prove that the
#     pixels it returns are the page's complete visible content: it accepts a page
#     whose resource dictionary holds exactly one image XObject and returns that
#     object's bytes, without ever interpreting the page's `/Contents` stream. A
#     page carrying text or vector marks beside that one image would seal the image
#     and lose the rest, which is GOALS 1 failing in the one place it must not.
#     Turning this line to "render-pages" is one line and needs no code change —
#     the door asks this table before it counts a single page — but it should not
#     be turned until a page-content interpreter proves exactly one image is painted
#     exactly as recorded, with no other visible content. That is its own spec.
#
# Actions are a closed set:
#   "admit"        — a single-image raster, structurally validated, sealed as-is.
#   "render-pages" — a multi-page container, fanned out and rendered at the door.
#   "refuse"       — refused by name, with a counted refusal artifact. Never an
#                    anonymous "unsupported" counter: that anonymous counter is the
#                    old door defect audit Q14 was written about.
#
# Every format `image_formats.sniff()` can name must have a row here, and a row
# naming a format it cannot name is a drift error. Both are checked at load, so a
# format can never be admitted by omission or refused by silence.

[format]
png = "admit"
jpeg = "admit"
tiff = "admit"
pdf = "refuse"
gif = "refuse"
heic = "refuse"
