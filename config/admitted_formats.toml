# The admission list — what may enter this pipeline at all, and how, by format.
#
# Ruling 2026-08-04, item 2 rewrote this file's whole premise: "Nothing should be
# rejected — any image and image formats should work. If things are failing the
# image got corrupted ... or the pipeline is broken." There is no "refuse" action
# any more. A refusal is always one of two facts, and both are alarms: the bytes
# are damaged (wrong digest, genuinely malformed container), or this project has
# no reader for the format yet — a named pipeline gap, never a decision about his
# file.
#
# Actions are a closed set:
#   "admit"           — a single-image raster, structurally validated, sealed as-is,
#                        unmodified.
#   "render-pages"    — a format that is *always* a container of pages (PDF): fanned
#                        out unconditionally and rendered once, at the door.
#   "admit-or-fan-out" — a format that is *usually* one image but can structurally
#                        hold more than one (TIFF): a single-directory file is
#                        admitted exactly like "admit"; a multi-directory file is
#                        fanned out and rendered exactly like "render-pages".
#   "gap"             — this project has no reader for the format yet. Still
#                        refused today, but counted as `UNSUPPORTED_VARIANT` — the
#                        same code a genuine undecodable variant of a *supported*
#                        format gets — never an anonymous "unsupported" counter
#                        (audit Q14) and never framed as a decision about his file.
#
# Ruling 2026-08-04, item 2's table, applied:
#
#   PNG, JPEG, TIFF — admit. Priority, and TIFF is 100%: single and multi-page,
#     fanned out per page (TIFF's `admit-or-fan-out`).
#   PDF — admit, rasterised per page. His own primary input; see
#     `pipeline/1_exemplar/pdf_render.py`.
#   GIF, HEIC — gap. Sniffable, no reader built yet. Priority order: common formats
#     first, rarer ones as the goal; turning either row to "admit" needs a
#     structural validator in `image_formats.py` first (or, for a container format
#     that turns out to need one, a renderer beside `pdf_render.py`/
#     `tiff_render.py`), because `admission.py` refuses to load a policy that
#     admits a format nothing can verify.
#
# Every format `image_formats.sniff()` can name must have a row here, and a row
# naming a format it cannot name is a drift error. Both are checked at load, so a
# format can never be admitted by omission or left ungapped by silence.

[format]
png = "admit"
jpeg = "admit"
tiff = "admit-or-fan-out"
pdf = "render-pages"
gif = "gap"
heic = "gap"
