# Pod-plus-attached-volume money ceilings. config/README.md describes the keys and
# operations/pod/spend.py refuses any that are missing, unknown or inconsistent.
# This file being configured is not permission to launch (AGENTS.md, "Who decides").
schema = "pod-spend.v4"
state = "configured"
currency = "USD"

# Decimal strings, never TOML numbers: a float does not keep money exact.
# $0.50 admits the RTX A5000 ($0.27) and the A40 ($0.44) beside a volume of up to $0.06/h.
max_hourly_usd = "0.50"
max_estimated_metered_cost_usd = "2.00"

# Documented, unverified default -- check it against the RunPod balance before a
# live run.  Nothing re-reads the balance once a pod is live.
account_balance_floor_usd = "50.00"
account_balance_alert_usd = "75.00"

hard_lifetime_seconds = 14400
laptop_heartbeat_timeout_seconds = 900
shutdown_poll_interval_seconds = 30
shutdown_deadline_seconds = 900

# The verifier's accepted maximum; not a measured RunPod value.
billing_cutoff_margin_seconds = 3600

# A pod's default budget: soft and hard maximums in time from creation and in metered
# cost, whichever is reached first. The guard's deadline sits at the soft maximum, so
# hard_lifetime_seconds and max_estimated_metered_cost_usd may not pass it. From the soft
# to the hard maximum is an extension only the lead makes. Defaults pending the lead's
# decision.
soft_max_seconds = 14400
soft_max_cost_usd = "2.00"
hard_max_seconds = 21600
hard_max_cost_usd = "3.00"
