# Deliberately non-operational until Tyrel chooses a GPU class and spend policy.
# Both creation and adoption refuse this state.  Test fixtures supply configured
# policy values; this file contains no personal default or billable approval.
#
# This is a refusal, not a placeholder.  A committed active policy reads as an
# approved one to whoever opens the file next, and CLAUDE.md hard rule 1 puts the
# spend policy and GPU class in Tyrel's hands.  The commented keys below document
# the shape a configured policy must have so that filling it in needs no code
# reading — the loader refuses any key it does not know, and refuses a policy
# missing any of them.
#
# GOVERNANCE 8 and CLAUDE.md hard rule 2 still bind whatever is written here:
# configuring this file is not permission to launch.  Every live run is
# separately authorised in the session it happens in, and these ceilings are
# enforced *in addition to* that permission, never instead of it.
#
#   schema = "pod-spend.v3"
#   state = "configured"
#   currency = "USD"
#
#   # Decimal STRINGS, never TOML numbers: a bare number becomes a binary float
#   # on read, and money does not survive that.
#
#   # Refuses a paid action whose pod-plus-attached-volume hourly price exceeds
#   # this.  Spec 04's named candidates run $0.27–$1.99/hr for the pod.
#   max_hourly_usd = "..."
#
#   # The same combined rate multiplied out across the requested hard lifetime.
#   # Independent of max_hourly_usd, so either ceiling alone can refuse a run.
#   max_estimated_metered_cost_usd = "..."
#
#   # The observed-balance hard stop that protects the network volume while data
#   # is secured after a spend incident. It is a reserve that must still be there
#   # *after* the run, so a launch is refused both when the observed balance is at
#   # or below it and when this run's own estimated cost to its hard deadline would
#   # take it there. Nothing re-reads the balance once a pod is live. "50.00" is a
#   # documented, unverified default: check it against RunPod before a live run.
#   account_balance_floor_usd = "50.00"
#
#   # A higher observed-balance warning threshold. Warnings send through the
#   # notification seam only; they never block a paid action. This must be
#   # greater than the hard floor and is Tyrel's policy value.
#   account_balance_alert_usd = "..."
#
#   # The hard lifetime both controllers enforce independently — the laptop
#   # supervisor and the pod-side dead-man timer.  Whichever fires first
#   # terminates through the verified path.
#   hard_lifetime_seconds = 0
#
#   # How stale an owner heartbeat must be before another controller treats the
#   # lease as an orphan and reconciles it.  Must be shorter than the hard
#   # lifetime, or an orphan would outlive the run that abandoned it.
#   laptop_heartbeat_timeout_seconds = 0
#
#   # Verified shutdown's poll interval and its overall deadline while waiting
#   # for exact-pod GET-404 and pod-list absence to agree.  The loader refuses
#   # a poll interval longer than the deadline, and a deadline whose sum with
#   # the fixed 30s billing-retry tail below reaches the hard lifetime.
#   shutdown_poll_interval_seconds = 0
#   shutdown_deadline_seconds = 0
#
#   # How far the billing evidence a provider returns may extend beyond the
#   # requested cutoff. The verifier accepts only 0–3600 seconds; an
#   # out-of-bounds value is refused, never clamped. 3600 preserves the
#   # previous behavior but is not a measured RunPod value and must be chosen
#   # deliberately for a live run.
#   billing_cutoff_margin_seconds = 3600
#
# Billing reconciliation is not a key here: VerifiedShutdown's retry (3 attempts,
# 15s apart) is fixed in code, not reviewed policy, and can add up to 30s past
# shutdown_deadline_seconds above before a close is reported. Bounded and named
# so filling in the deadline above is not silently short by that amount.
#
# Nothing above authorises deleting or retaining the network volume after a
# close.  That is its own separately named decision, and every close report
# states the volume's ongoing hourly price so it cannot be forgotten.
# Configured 2026-09-06 on Tyrel's approval (standing ledger TYREL_RULINGS_2026-09-04.md
# §8 and §9) for the first live tests, Stage 1 of FIRST_LIVE_TESTS_PLAN_2026-09-06:
# the cheapest reviewed card (RTX A5000 at $0.27/h plus a modest volume clears $0.40;
# the A40 at $0.44 and everything above it does not).  Raising max_hourly_usd later is
# the deliberate, recorded act that opens Stage 3.  This file being configured is not
# permission to launch: every boot is asked for separately in the session that runs it.
schema = "pod-spend.v3"
state = "configured"
currency = "USD"

# Decimal STRINGS, never TOML numbers.
max_hourly_usd = "0.40"
max_estimated_metered_cost_usd = "2.00"

# Documented, unverified default -- Tyrel checks it against the RunPod balance before a
# live run.  Nothing re-reads the balance once a pod is live.
account_balance_floor_usd = "50.00"
account_balance_alert_usd = "75.00"

# Four hours: Stage 1's seal (worst case $1.08 of pod at $0.27/h).
hard_lifetime_seconds = 14400
laptop_heartbeat_timeout_seconds = 900
shutdown_poll_interval_seconds = 30
shutdown_deadline_seconds = 900

# The verifier's accepted maximum; not a measured RunPod value.
billing_cutoff_margin_seconds = 3600
