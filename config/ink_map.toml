# The sealed policy of the ink measurement: where ink lies on a page, measured
# with no model involved. The Ink Map measures it before any stage claims a
# region, the Recensor and the Armarium re-measure against what was read, and
# the Perlector's page accounting reads the Ink Map's runs under it. Sealed as `ink-map` in every run's config map.
#
# Every field is refused loudly rather than defaulted. Fractions are integer
# basis points (1/10000), never floats, because canonical artifacts carry no
# floats; each resolves to pixels with `common.background.round_half_up_bp`.
#
# `[background]` holds the policy the per-page background inference runs under
# (`common/background.py`). It is measured against real material, so it carries a
# provenance block of its own.
#
#   band_bp                the border band sampled by the interior-mode
#                          measurement, as a fraction of the page. The ONLY length
#                          in this file that resolves against BOTH dimensions --
#                          band_bp of the width on the left and right, band_bp of
#                          the height on top and bottom, resolved by
#                          `common.background.resolve_background_policy`.
#   max_interior_dark_bp   how little of the complementary interior may be dark
#                          for the page's dark population to enter the existing
#                          interior-mode branch. It does not identify a frame,
#                          bezel, or page boundary.
#   max_ink_bp             and, on every page whichever branch inferred it, how
#                          much of the page the inferred paper may leave at or
#                          below the ink threshold before that value stops being a
#                          background at all. A page over this bound is refused by
#                          name instead of publishing an ink fraction that
#                          reconciles exactly and means nothing
#   ink_margin_bp          how far below the inferred paper value that ink
#                          threshold sits, as a fraction of the distance between
#                          the page's OWN two grey-level population modes --
#                          floored at background.PRIMARY_MARGIN. Not a bound: it
#                          refuses nothing and decides no outcome, it sets the
#                          level every ink count on the page is taken at. A fixed
#                          offset does not work because a photographed leaf's
#                          paper is a population dozens of levels wide and a fixed
#                          offset lands inside it; the distance between the page's
#                          two modes is the scale that offset was missing. Held
#                          strictly under 5000 by the loader, because at 5000 the
#                          threshold reaches the level the dark-distribution
#                          measurement uses and its two published dark counts stop
#                          being subsets of the ink they are fractions of
#
# The last three are fractions of a pixel *population*, or of the distance between
# two of them, not of a page, so they never resolve to pixels:
# max_interior_dark_bp of the interior band's own pixels, max_ink_bp of the whole
# page's, ink_margin_bp of two modes' separation in grey levels. band_bp and
# max_interior_dark_bp are read only where `infer_background_evidence` would otherwise have
# refused -- an ordinary scan whose modal pixel is its paper never reaches them --
# while max_ink_bp and ink_margin_bp are read on every page that gets a paper
# value at all. **The dark population measured by the interior-mode branch is
# never removed from the page** -- it stays below the ink threshold and is counted
# as ink by every measurement. The published
# `dark_distribution` records its sampled band/page counts without treating them
# as a bezel, a paper region, or a region to remove. See
# common/background.py::_dark_distribution.

[background]
band_bp = 500
max_interior_dark_bp = 5000
max_ink_bp = 7000
ink_margin_bp = 3333

[background.provenance]
source = "measured on this Mac, 2026-09-06, over 127 real pages: 60 RecordGold pages (24 teklia_dai_cretdhi, 32 recordgold_production_train_v1, 4 recordgold_evaluation_val_v1), 60 parish master pages (15 each from parish A, parish B, parish C and a printed parish history), and the seven review proxies from the 2026-08-22 triage measured pass as a control, sampled by the fixed seed designator-survey-2026-09-06. The per-page 256-bin histograms and the border/interior histograms at band widths 250, 500 and 1000 bp were dumped once and every candidate rule scored offline against them; those dumps reproduce the 127-page survey's own mode, mean, border and interior figures on all 127 pages at all three band widths, which is what ties these numbers to that survey's material. Four SYNTHETIC control pages were scored beside them and are marked SYNTHETIC wherever their numbers are quoted. The calibration tables are in pipeline/1_ink_map/CALIBRATION.md under 'The background inference, calibrated on 127 pages'"
corpus = "127 real photographed and scanned pages, 1.2 to 27.7 megapixels, from four parish registers and one expert OCR corpus, in three capture conditions -- photographed register openings with a black surround, flatbed-style scans, and a printed book. It is the first sample this project has taken that is not one capture session, and it is still not the corpus the pipeline will run on: no page here passed through pipeline/1_exemplar, 54 of the 127 carry no DPI tag, and the three RecordGold sets overlap heavily (575 of 688 teklia filenames also appear in recordgold_production_train_v1), so the 60 RecordGold pages are 60 draws from one corpus and not from three"
sample_unit = "page"
sample_count = 127
statistic = "for max_interior_dark_bp: the fraction of the interior band at or below the level midway between the page's dark-population mode and its light-population mode, in floor-divided basis points, over the 72 of 127 pages that reach the interior-mode branch -- minimum, median and maximum, no percentile, because the bound is placed in a measured gap and not at a quantile. For max_ink_bp: the fraction of the whole page at or below background minus PRIMARY_MARGIN under the inferred paper value, in the same basis points, over all 127. For band_bp: both of those recomputed at 250, 500 and 1000 bp. For ink_margin_bp: the fraction of the page that is left at or below the ink threshold the value derives, measured twice -- over the whole page and over the DARK-EXCLUDED DISTRIBUTION, a derived statistic that subtracts the page-wide sampled dark population from both ink and page counts and is not a paper-region measurement without independent ground truth -- over the 127, as minimum, quartiles, median and maximum, because that statistic is a distribution to be judged plausible rather than a bound to be placed"
calibrated_for_this_corpus = true
caveat = "These four numbers were measured on 127 real pages from five sources, which is what the flag says and the whole of it. WHAT THE SAMPLE ESTABLISHES. max_interior_dark_bp = 5000 sits in a measured gap: the 72 real pages that reach the interior-mode branch run 287 to 3452 bp, the nearest refusing SYNTHETIC control (a dark core inside a light border) measures 6647 and the inverted-scan SYNTHETIC control 8333, so the valley is 3195 bp wide and 5000 is 49 bp below its midpoint. It refuses no real page in the sample; it is the bound that catches both refusing controls, and the border-darkness bound that used to sit beside it (min_border_dark_bp = 7000, calibrated on seven pages) is gone because it refused 52 of these 127 while refusing no control this one does not. max_ink_bp = 7000 is NOT in a valley: the whole-page ink figure is a continuum from 281 to 8502 bp with no gap wider than 505 anywhere in it. It is a policy bound, placed in the widest gap near the top of that distribution (6595 to 7077, 482 bp wide) and 77 bp nearer the refusing side, because the failure it exists to stop is invisible -- 6 of these 127 pages inferred a paper value of 255 through the plain modal branch, counted 71 to 85 percent of the page as ink, and reconciled exactly with nothing in the record marking them. It refuses 13 of the 127, three of which are review proxies whose ink fractions at PRIMARY_MARGIN are as unreadable as the six. band_bp = 500 is now nearly inert: at the two bounds above, 250, 500 and 1000 bp give an identical accept-or-refuse outcome and an identical paper value on every one of the 127. 500 is kept because at 1000 the band is 20 percent of each dimension and 36 percent of the page's area and has stopped being a frame: it averages bezel against paper, and the real pages' border figure collapses from a median of 8166 to 5025. The valley is NOT the reason -- 1000 has the widest of the three (5527 bp against 3195 at 500 and 2067 at 250), and an earlier draft of this caveat claimed the opposite. Against 250 the valley does decide: its dark-core SYNTHETIC control measures 5990, so a 6000 bound would already admit it, where at 500 the same control is at 6647. SCALE INVARIANCE IS MEASURED, NOT ASSUMED: over the 73 pages carrying a DPI tag, resampling to a 300-DPI equivalent with LANCZOS leaves the outcome unchanged on 72 and moves the inferred paper value by at most 2 grey levels on the 67 pairs that infer both ways; the one page whose outcome changes is refused natively by max_ink_bp. The seven-page calibration this replaces argued scale invariance from the fact that its three values were population fractions, and that argument was wrong -- the fractions were scale-invariant and the LEVEL they were measured at, the page's own modal pixel, was not. WHAT THE SAMPLE DOES NOT ESTABLISH. The admitted dark-distribution counts do not establish a bezel, page boundary, paper region, or excluded writing on any individual page: the current interior bound also admits a spatially uniform 40-percent dark population. The counts remain retained as measured populations and no pixel is removed from scanning or reconciliation. It contains no page photographed against a light surface; that shape was measured on a SYNTHETIC page instead, and the answer is that a light surround at 230 or above is refused by max_ink_bp by name, while a light surround within about 15 grey levels of the paper is inferred AS the paper and is caught by nothing here. It establishes nothing about a frame holding two leaves lit differently, and the one real example it does contain -- a review proxy, overlay changed4_proxy_da9e07ec.png -- shows a limit nothing in this file closes: one paper value is inferred for the whole frame, so the darker leaf sits below the ink threshold that value implies and is counted as ink edge to edge while the lighter leaf reads correctly. Nothing detects it, no bound here refuses it, and the page's own ink fraction is the only place it shows. A per-region background is the repair and it is a different unit. It contains no flatbed scan with a dark platen lid distinct from the photographed shape, no page whose frame is dark on only two sides (a SYNTHETIC one takes the plain modal branch and infers its paper correctly), and no page admitted through pipeline/1_exemplar. Re-derive against a real run's own sealed pages before trusting any of it further. Finally, this test never removes a pixel from any ink count -- the sampled dark population stays in the page and is counted as ink -- so a misjudgement changes which value is reported as paper and remains visible in the page's ink fraction and `dark_distribution`; it is never a silent loss. That block records sampled populations rather than a page boundary. INK_MARGIN_BP = 3333 IS A DIFFERENT KIND OF FIELD FROM THE THREE ABOVE: it is not a bound and it refuses nothing. It is the fraction of the distance between a page's own dark-population mode and its light-population mode that background._derived_ink_margin deducts from the inferred paper value to get the threshold that page's ink is counted at, floored at background.PRIMARY_MARGIN. It replaces a fixed offset of 20 grey levels, which on photographed paper landed inside the paper population rather than below it: over these 127 pages the fixed offset left a median of 39.5 percent of the whole page and 23.3 percent of the DARK-EXCLUDED DISTRIBUTION -- a derived statistic that subtracts the sampled page-wide dark population from both numerator and denominator; it is not a paper-region measurement without independent ground truth -- at or below the ink threshold, and a written register page is a few percent ink, not a quarter. At 3333 the same 127 pages measure a dark-excluded ink fraction of 0.45 to 9.62 percent, median 3.69, which is a descriptive distribution, not a ground-truth writing fraction. THE VALUE IS CHOSEN AND NOT DERIVED FROM A VALLEY, because there is no valley to derive it from: on every photographed page in this sample the histogram has exactly two peaks, the bezel and the paper, and the writing is a few percent of the pixels smeared under the paper peak's own left skirt with no density minimum anywhere between them. The minimum-density level between the two modes sits just above the bezel, around grey level 55 to 75, which is a page-boundary threshold and not an ink one. What decided 3333 among its neighbours: over the survey's own ten photographed pages driven live through the shipped pass, the dark-excluded ink fraction runs 4.1 to 13.6 percent at 2500, 2.9 to 9.0 at 3000, 2.2 to 6.8 at 3333, 1.6 to 4.2 at 3750 and 1.2 to 3.1 at 4000, so 2500 leaves the densest page in the sample reading as a seventh ink and 4000 leaves it reading as sparse; and the component count at the sealed gap of 3 has its median over those ten pages at 2721 / 2557 / 2653 / 2982 / 3197 across the same five values, flat through 3000 to 3333 and rising past it, which is fragmentation beginning. 3000 and 3333 are not separated by either measurement and that is said here rather than hidden; 3333 is chosen for the historical dark-excluded comparison and for being one third. THE BOUND THIS FIELD IS HELD UNDER IS STRUCTURAL: the loader refuses any value at or past 5000, because _dark_distribution measures at the midpoint of the two modes and publishes its two dark counts as fractions of the ink the page goes on to count, and that reading is true exactly while the derived threshold stays at or above that midpoint. SCALE INVARIANCE IS MEASURED HERE TOO: over the same 73 DPI-tagged pages resampled to a 300-DPI equivalent, the derived margin moves by at most 8 grey levels (median 0) and the dark-excluded ink fraction by at most 0.51 percentage points. WHAT THIS FIELD DOES NOT CHANGE: max_ink_bp is still probed at PRIMARY_MARGIN and not at the derived threshold, deliberately -- asked at the derived threshold it stops working, because the derivation reads the same wrong paper value the bound is watching for and slides the threshold down with it, and the six silent paper-255 pages then measure 2239 to 3498 basis points against a median of 2434 over the other 121. No fixture page's ink count moves for any of this: a synthetic page's paper and ink are 140 grey levels apart, so the floor and the derived margin select the identical pixel set on all three walking-skeleton pages, measured rather than argued."

# `[page_spanning]` is the bound above which one connected component's bounding
# box counts as page-spanning, in basis points of the page's own AREA. The coverage
# audit (`common/residual_ink.py`) takes that component out of its counts.

[page_spanning]
page_spanning_area_bp = 5000

[page_spanning.provenance]
source = "measured on this Mac, 2026-09-06, over 17 real pages: the seven review proxies from the 2026-08-22 triage measured pass and the ten photographed register pages the ink-margin unit measured on (four sources: parish A, parish C, recordgold_evaluation_val_v1, teklia_dai_cretdhi). Three of the seventeen are refused by [background] max_ink_bp and are not in any figure below, so every number here is over the 14 pages that infer a paper value. Each page was decoded through common.imaging.grayscale_rows, scanned for ink at the margin the page derives for itself, and labelled into connected components at the sealed gap_tolerance_px = 3. No page was copied into this tree and nothing under private/ was modified"
corpus = "the same 17 real pages the shared-background unit measured the coverage audit on -- 1.5 to 18.4 megapixels, photographed register openings and scans from four parish registers and one expert OCR corpus. On every one of the 14 measurable pages the primary scan produced one connected component whose bounding box was the whole page. Those measurements do not establish whether that component is bezel, writing, or another dark population, and the sample contains no measurable photographed page without one, so it cannot show what this bound does when the largest component is a genuine page-spanning mark. No page here passed through pipeline/1_exemplar"
sample_unit = "page"
sample_count = 17
statistic = "the bounding-box area of every connected component the ink scan finds, as floor-divided basis points of the page's own area, over all 14 measurable pages -- reported as the largest value and the largest value excluding the single page-spanning component, because the bound is placed in a measured gap between those two populations and not at a quantile"
calibrated_for_this_corpus = true
caveat = "WHAT THE SAMPLE ESTABLISHES. On all 14 measurable pages exactly ONE component's bounding box covers the whole page: span 10000 basis points of the width AND of the height, bounding box {x:0, y:0, w:page width, h:page height}, holding 69.5 to 95.2 percent of every ink pixel the scan counted (median 85.68). The largest bounding box of any OTHER component on any of the 14 is 472 basis points -- 4.7 percent of a page -- so the gap this bound sits in runs from 472 to 10000 and is 9528 basis points wide, which is the widest gap any value in this file has been placed in. The bound is not, however, free within that gap: the FLOOR is set by this repository's own fixture pages, whose largest component covers 2996 basis points of a 200x260 page and is a legitimate act, so any value at or below 2996 would take a real act out of the audit's counts on the walking skeleton. 5000 is chosen as half the page: it is 1.7x the fixture floor and below every measured whole-page component. The sample does not establish a universal maximum legitimate act size. WHAT THE SAMPLE DOES NOT ESTABLISH. It does not establish that 5000 is right rather than 4000 or 8000: every value from 2000 to 9000 gives an identical result on all 14 pages, because on each of them there is exactly one component in the gap and it covers the entire page. The value is therefore chosen by the fixture floor and by reasoning about what an act can be, not discriminated by this corpus, and that is the honest statement of it. It establishes nothing about a measurable photographed page without a whole-page component, because the sample contains none: on a page whose text is dense enough that gap_tolerance_px = 3 welds every line into one component covering more than half the leaf, this bound would take that component out of the audit's counts, so ink missed inside it would not count as outside coverage; page_ink_pixels still holds it. That is not measured on this corpus. It establishes nothing about a page admitted through pipeline/1_exemplar. Finally, this bound removes no pixel from the page: the audit keeps the whole-page figure in page_ink_pixels and the component's own in page_spanning_ink_pixels, so nothing here is a silent loss"

# `[connectivity]` is the stroke-connectivity radius the page-spanning component is
# found at: how many blank pixels two ink runs may have between them and still be one
# connected mark. Absolute pixels, never a page fraction.

[connectivity]
gap_tolerance_px = 3

[connectivity.provenance]
source = "an unmeasured default of 3 pixels, the stroke-connectivity radius the ink scan has used since it was written"
corpus = "none -- gap_tolerance_px has no corpus behind it at all; see caveat"
sample_unit = "page (the synthetic fixture pages under proof/fixtures/synthetic-two-page-v0, not a real register record or act)"
sample_count = 0
statistic = "none -- an unmeasured default, not a computed percentile or summary statistic over any sample"
calibrated_for_this_corpus = false
caveat = "gap_tolerance_px is the loudest number in this file and must never be expressed as a page-fraction basis point. It is a stroke-connectivity radius -- how many blank pixels two ink runs may have between them and still count as one connected mark -- not a page-layout proportion, and it must not scale with page size: Scaling it as a page fraction -- to ~41px on a 3508px-tall real page -- would change what 'connected' means, bridging inter-word gaps into merged lines rather than just closing letterform strokes. The row-run labeller measures 2.7s at gap 3 and 3.2s at gap 8 on a real page at 300-DPI-equivalent size, so runtime does not constrain this number; the connectivity argument above is the whole of it. Its correct value is a function of scan resolution (DPI, stroke width in pixels), not of page dimension, and no measurement of that relationship exists in this project yet; it stays absolute at 3 by decision, not by oversight."

# `[coverage_audit]` is the sealed policy of the outside-coverage audit in
# `common/residual_ink.py`, which the Ink Map, the Recensor and the Armarium run.
#
#   substantial_ink_area_bp  how much outside-coverage ink, as basis points of
#                            the page's OWN AREA, flags a page on its own
#                            whatever fraction of that page's ink it is. Resolved
#                            with common.background.round_half_up_bp and floored
#                            at [coverage_audit.noise_floor] minimum_ink_pixels
#                            (24) below, because coverage_flag reads this gate
#                            before the fraction gate's own noise floor and a
#                            resolved value under that floor would flag a page
#                            on a speck.
#   edge_band_bp             the perimeter strip the unclaimed-edge-ink finding
#                            is measured in, as basis points of the page's
#                            SHORTER SIDE. The shorter side and not each
#                            dimension separately, because the band is one strip
#                            and must be the same thickness all the way round.
#
# Both are fractions of the page rather than flat pixel counts: a flat count is
# a different share of every page size, so a count that suits a small page means
# something else on a large leaf.

[coverage_audit]
substantial_ink_area_bp = 4
edge_band_bp = 100

[coverage_audit.provenance]
source = "measured on this Mac, 2026-09-06, over the 44 measurable pages of the corpus below. Each page was decoded through common.imaging.grayscale_rows, inferred through the shared common.background.infer_background_evidence, scanned and grouped through the shipped Designator pass under this file's own sealed values, and then measured through the audit's own ink predicate -- MINIMUM_CONTRAST_BELOW_BACKGROUND below the same paper value -- with the page's page-spanning component identified by the same bound the Designator withheld it under and taken out of both counts. Recorded per page: outside-coverage ink as pixels, as basis points of the page's own audited ink and as basis points of the page's area; the perimeter measure at four bands (the retired 64 pixels and 100, 200 and 300 basis points of the shorter side), each taken twice, against the empty coverage the Ink Map has and against the declared coverage the Armarium releases against; the ink held by one grouped unit of writing; and the distance of the extreme groups from all four page edges. The drivers, their raw records and the full tables are named in the project's own audit notes"
corpus = "47 real pages drawn once under the fixed seed audit-gates-2026-09-06: the seven review proxies from the 2026-08-22 triage measured pass as a control, the ten photographed pages the ink-margin unit measured on, 20 more flatbed pages from teklia_dai_cretdhi drawn from the 687 not already in the ten, and 10 more parish master pages (4 parish A, 2 parish C, 4 parish B) drawn from the 5,493 not already in the ten. 1.5 to 18.4 megapixels, five sources, three capture conditions. Three of the 47 -- all review proxies -- are refused by [background] max_ink_bp and carry no figure here, so every number below is over the 44 that infer a paper value. 29 of the 44 infer through the surround branch (inferred-interior-mode) and 15 through the plain modal branch (inferred-modal), which is the photographed/flatbed split this sample contains. THE SPLIT IS NOT A BEZEL-FREE CONTROL AND MUST NOT BE READ AS ONE: all 44, on both branches, carry exactly one page-spanning component, holding 35 to 87 per cent of every pixel the audit calls ink (median 65). The flatbed pages were sampled to be the counter-case and are not one -- their leaves sit in a dark frame with a gutter, and the frame welds. This sample therefore contains NO page whose largest component is an ordinary mark. No page here passed through pipeline/1_exemplar, and no page was copied into this tree"
sample_unit = "page"
sample_count = 44
statistic = "for substantial_ink_area_bp: the outside-coverage ink of each page, less its page-spanning component, as floor-divided basis points of the page's own area, over the 44 -- reported as the whole ordered distribution beside the ink one grouped unit of writing holds on the same page, because the value is anchored on the second and not placed at a quantile of the first. For edge_band_bp: the same audited outside-coverage ink restricted to the perimeter strip, at four band widths, over the same 44, beside the count of pages on which any act group's bounds reach into the strip at all"
calibrated_for_this_corpus = false
caveat = "NOT CALIBRATED FOR THE PIPELINE THAT RUNS NOW: the Designator grouping these gates were measured against no longer exists, and the audit now measures against the page reading's act regions; re-measure both gates against page-reading regions on the proof run. WHAT THE SAMPLE ESTABLISHED. SUBSTANTIAL_INK_AREA_BP = 4. The gate exists to catch a miss that is large full stop, which the 2 per cent fraction gate beside it lets through on a dense page, so it is anchored on the smallest real thing a page can be missing rather than placed at a quantile. On these pages the Designator groups LINES rather than acts (the project's own grouping notes say so on the overlays), and the ink one such grouped line holds, measured as the page's own audited ink over its group count, is 4 basis points of the page's area at the median (0 to 115 across the 44, 5 at the third quartile, 19 at the ninth decile). 4 basis points is therefore one line of writing on the page it is measured on. Measured firing: the substantial gate fires on 41 of the 44 and the fraction gate on 38, and the three the substantial gate adds are the three whose outside-coverage ink is real and under 2 per cent of a dense page's own ink -- which is precisely the hole this gate exists to close, measured for the first time rather than argued. Three pages are cleared by both gates and they are the three whose grouping leaves no audited ink outside coverage at all. THE CORPUS DOES NOT DISCRIMINATE THE VALUE FINELY: every value from 2 to 4 basis points fires on the same 41 pages and every value from 5 to 18 on the same 40, so what separates 4 from 12 is the line measurement and not a gap in this distribution. EDGE_BAND_BP = 100. The band is an instrument boundary and its job is to be a MARGIN -- a strip the writing does not reach -- so that ink found in it is genuinely outside everything the pass claimed. Measured: at 100 basis points an act group's bounds reach into the strip on 5 of the 44 pages, at 200 on 15, and at 300 on 25. A band inside the writing on more than half the corpus has stopped being a perimeter, so 100 is the only one of the three that keeps the property the band is for. At 100 basis points the strip is 10 to 36 pixels on these pages and 2 pixels on this repository's 200x260 fixture; the audited perimeter ink in it clears MINIMUM_INK_PIXELS on 9 of the 44 and not on 35. WHAT THE SAMPLE DOES NOT ESTABLISH. It contains no page without a page-spanning component, so it says nothing about either gate on a page where the audit's counts and the page's whole ink coincide -- on such a page both gates read exactly what they read before this block existed, and neither has been measured there. It says nothing about a page admitted through pipeline/1_exemplar, and nothing about what a real structure-pass model would propose: the coverage every number here is measured against is the walking skeleton's own grouping, which produces lines rather than acts, so the outside-coverage ink these gates fire on is largely the gap BETWEEN grouped lines. On a pass that grouped acts the same pages would measure differently and this block should be re-derived. Finally, neither gate removes a pixel from anything or holds anything on its own: they decide whether a page carries a coverage finding a reviewer sees, and the page's whole-ink figure travels beside the audited one on every record, so a gate set too loosely is visible on the record rather than silent"

# The two values below are not lengths and are not measured, so they sit in a
# sub-table with their own provenance rather than under the gates' calibration
# claim. They travel on the Armarium's re-measurement rows so the export verifier
# can recompute a page hold on a clean machine from the counts alone.
#
# `minimum_ink_pixels` is the noise floor: below this many outside-coverage ink pixels
# a residual mark is dust or a fold shadow, whatever fraction of a (possibly tiny)
# page's total ink it is. It is a flat count on purpose -- a speck is a speck at every
# resolution -- and it is also the floor the substantial gate above resolves to on
# pages smaller than about 245 pixels square. Its readers are the Ink Map's coverage
# audit, the Recensor's residual-ink check and the Armarium's re-measurement.
# `minimum_fraction_outside_bp` is the fraction gate: the share of a page's own audited
# ink that must fall outside every cut before the page is flagged, in basis points
# (200 = 2 per cent), an integer because canonical artifacts carry no floats.
[coverage_audit.noise_floor]
minimum_ink_pixels = 24
minimum_fraction_outside_bp = 200

[coverage_audit.noise_floor.provenance]
source = "the two reasoned defaults `common/residual_ink.py` shipped with, carried into this file unchanged on 2026-09-14 so a run seals them: 24 pixels was reasoned as a few stray dark pixels of scanner dust, and 2 per cent as a fraction a genuinely missed region on a written page clears while a trace does not"
corpus = "none. Neither value has been measured against a real register page; the 44-page sample the two gates above were measured on records that the audited perimeter ink cleared 24 pixels on 9 of the 44 pages, which is an observation about the band and not a calibration of the floor"
sample_unit = "page"
sample_count = 0
statistic = "none -- both are reasoned defaults, not a percentile of any measured distribution"
calibrated_for_this_corpus = false
caveat = "PROPOSED, NOT YET MEASURED. A blank-page density threshold cannot substitute for either: 'is this page blank' and 'is any ink outside coverage' are different questions. Change them only when real-corpus calibration supplies a measured value, and re-derive both beside the two gates above on the same pages, because the three decide one flag together: the fraction gate cannot fire under the floor, and the substantial gate is floored at it"
