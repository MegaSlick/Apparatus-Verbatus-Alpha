# Its values are sealed into every run's decoding provenance.
schema = "decoding.v5"

[perlector_generation]
# Output bounds for the Perlector's replies, far above any honest reading, so a
# reply that runs away stops as a visible truncation and holds its act rather
# than filling the context. One value covers every reading pass so the passes
# stay one condition; the re-proof answers in JSON and repeats the span it
# corrects, so it has its own. These are the policy caps, seen through this
# file's digest; the value sent is cut to the context the prompt leaves and is
# recorded on each call record.
reading_max_tokens = 4096
reproof_max_tokens = 8192

[variance_experiment]
# Lectio nuda and the lectio-prior draft send the same request to measure the
# Perlector's sampling variance, so each arm needs its own seed to be its own
# draw. The arm at index i of `common.decoding.VARIANCE_ARMS` sends this seed
# plus i, recorded on its call record; it is never a retry.
seed = 20260820

[structure]
# The Designator structure chair's coverage recovery follows Chandra's own
# retry schedule, the maker's recovery from a degenerate page: attempt one sends
# the chair's row in `chair_decoding` below, and attempt n sends the pinned
# recipe's request n (`chandra_native_inference`'s temperature and top_p), with
# the serving row's seed on every attempt. Each attempt's values are recorded
# on its call record and its structure-answer record.
recovery_schedule = "chandra-native-retry"
recovery_max_attempts = 3

[chandra_native_inference]
# Exact upstream inference recipe admitted only for Attestator 1's Chandra
# page-reading route. This is not an ambient retry or sampling switch.
schema = "chandra-native-inference.v1"
source_repository = "https://github.com/datalab-to/chandra"
source_revision = "d4f7467435aa4137d9539f000ddf0b7ced3eb43f"
recipe_path = "chandra/model/vllm.py"
detector_path = "chandra/model/util.py::detect_repeat_token"
settings_path = "chandra/settings.py"
max_output_tokens = 12384
max_retries = 6
temperature_schedule = ["0.0", "0.2", "0.4", "0.6000000000000001", "0.8", "0.8", "0.8"]
initial_top_p = "0.1"
retry_top_p = "0.95"
error_backoff_seconds = [2, 4, 6, 8, 10, 12]

# Each reading chair's sampling values, as the model's makers recommend them.
# The serving client sends exactly these on every request of that chair, with
# the manager-owned seed, and records both on each call record beside the values
# the pinned engine samples under; no caller may add or change a sampling field.
# `temperature` is required; another value absent here is not sent. `source` and
# `revision` name where the values were read; `verification` says who read it.
# Detection has no decoding and so has no row.

[chair_decoding.designator_structure]
# datalab-to/chandra-ocr-2, read the way Chandra's own page pipeline reads a
# page: `generate_vllm`'s defaults for the first request.
temperature = 0.0
top_p = 0.1
source = "https://github.com/datalab-to/chandra/blob/d4f7467435aa4137d9539f000ddf0b7ced3eb43f/chandra/model/vllm.py"
revision = "d4f7467435aa4137d9539f000ddf0b7ced3eb43f"
verification = "read from the pinned source by the vendor-decoding session (Claude), and checked on every load to equal the first request of common/chandra_native_retry.py's port"

[chair_decoding.attestator_1]
# The same model and pipeline. A page read under `chandra_native_inference`
# sends this as its first request and follows the recipe's retry schedule.
temperature = 0.0
top_p = 0.1
source = "https://github.com/datalab-to/chandra/blob/d4f7467435aa4137d9539f000ddf0b7ced3eb43f/chandra/model/vllm.py"
revision = "d4f7467435aa4137d9539f000ddf0b7ced3eb43f"
verification = "read from the pinned source by the vendor-decoding session (Claude), and checked on every load to equal the first request of common/chandra_native_retry.py's port"

[chair_decoding.attestator_2]
# Teklia/Qwen2.5-VL-7B-DAI-CReTDHI-RecordGold-ATR. The model card gives no
# sampling advice beyond `model.generate`, which applies generation_config.json;
# `do_sample = true` there is the nonzero temperature here.
temperature = 0.1
top_k = 1
top_p = 0.001
repetition_penalty = 1.05
source = "https://huggingface.co/Teklia/Qwen2.5-VL-7B-DAI-CReTDHI-RecordGold-ATR/raw/e371095d4ffe585f31f4974462931ddbac61ff64/generation_config.json"
revision = "e371095d4ffe585f31f4974462931ddbac61ff64"
verification = "read by the project lead; the file's digest is pinned in pipeline/3_attestatores/feeding.py"

[chair_decoding.attestator_3]
# stanford-oval/churro-3B. The model card gives no settings, and the maker's
# churro-ocr v0.3.0 profile for this model sends none, so generation_config.json
# is the recommendation.
temperature = 1e-06
repetition_penalty = 1.05
source = "https://huggingface.co/stanford-oval/churro-3B/raw/ca2150ea465d5a3d67818c50e234b9422619c75d/generation_config.json"
revision = "ca2150ea465d5a3d67818c50e234b9422619c75d"
verification = "read by the project lead"

[chair_decoding.perlector]
# Qwen/Qwen3.8-27B in non-thinking mode, as its model card recommends.
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
