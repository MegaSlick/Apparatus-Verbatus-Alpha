# Its values are sealed into every run's decoding provenance.
schema = "decoding.v6"

[perlector_generation]
# The output cap of one whole-page reading, which answers every act on the page
# in one JSON object. A dense synthetic page (20 acts, about 12,000 characters
# per witness, 120 Surya lines each cited on its own) reserves 7,319 tokens for
# its answer (`common/request_capacity.py`, `page_answer_bound`); this leaves
# room above that for doubt marks and long set-aside lists while still stopping
# a runaway reply as a visible length cut-off. It is the policy cap, seen
# through this file's digest; the value sent is cut to the context the prompt
# leaves and is recorded on each call record.
page_max_tokens = 12288

[chandra_native_inference]
# Exact upstream inference recipe admitted only for Attestator 1's Chandra
# page-reading route. This is not an ambient retry or sampling switch.
schema = "chandra-native-inference.v1"
source_repository = "https://github.com/datalab-to/chandra"
source_revision = "d4f7467435aa4137d9539f000ddf0b7ced3eb43f"
recipe_path = "chandra/model/vllm.py"
detector_path = "chandra/model/util.py::detect_repeat_token"
settings_path = "chandra/settings.py"
max_output_tokens = 12384
max_retries = 6
temperature_schedule = ["0.0", "0.2", "0.4", "0.6000000000000001", "0.8", "0.8", "0.8"]
initial_top_p = "0.1"
retry_top_p = "0.95"
error_backoff_seconds = [2, 4, 6, 8, 10, 12]

# Each reading chair's sampling values, as the model's makers recommend them.
# Every row names every sampling field the pinned vLLM would otherwise fill from
# a model's generation_config.json (`common.decoding.ENGINE_FILLED_SAMPLING_FIELDS`):
# the maker's value where the maker gives one, otherwise the value the maker's
# own pipeline runs under. The serving client sends a chair's row on each of its
# requests, with the serving row's seed (a Chandra native request sends none),
# and records both on the call record beside the values the pinned engine
# samples under. No caller may add or change a sampling field. `source` and `revision` name where the maker's
# values were read; `verification` says who read them. Detection has no decoding
# and so has no row.

[chair_decoding.attestator_1]
# datalab-to/chandra-ocr-2, read the way Chandra's own page pipeline reads a
# page: `generate_vllm` sends a vLLM server only temperature and top_p. A page
# read under `chandra_native_inference` sends this as its first request and
# follows the recipe's retry schedule.
temperature = 0.0         # maker: `generate_vllm`'s default
top_p = 0.1               # maker: `generate_vllm`'s default
top_k = 0                 # vLLM 0.30.0 default for an unsent field (off)
min_p = 0.0               # vLLM 0.30.0 default for an unsent field (off)
repetition_penalty = 1.0  # vLLM 0.30.0 default for an unsent field (off)
source = "https://github.com/datalab-to/chandra/blob/d4f7467435aa4137d9539f000ddf0b7ced3eb43f/chandra/model/vllm.py"
revision = "d4f7467435aa4137d9539f000ddf0b7ced3eb43f"
verification = "read from the pinned source by the vendor-decoding session (Claude), and checked on every load to equal the first request of common/chandra_native_retry.py's port over vLLM's defaults"

[chair_decoding.attestator_2]
# Teklia/Qwen2.5-VL-7B-DAI-CReTDHI-RecordGold-ATR. The model card gives no
# sampling advice beyond transformers' `model.generate`, which applies
# generation_config.json; `do_sample = true` there is the nonzero temperature here.
temperature = 0.1           # maker: generation_config.json
top_k = 1                   # maker: generation_config.json
top_p = 0.001               # maker: generation_config.json
repetition_penalty = 1.05   # maker: generation_config.json
min_p = 0.0                 # transformers GenerationConfig default: unset, no min-p filter
source = "https://huggingface.co/Teklia/Qwen2.5-VL-7B-DAI-CReTDHI-RecordGold-ATR/raw/e371095d4ffe585f31f4974462931ddbac61ff64/generation_config.json"
revision = "e371095d4ffe585f31f4974462931ddbac61ff64"
verification = "read by the project lead; the file's digest is pinned in pipeline/3_attestatores/feeding.py"

[chair_decoding.attestator_3]
# stanford-oval/churro-3B. The model card gives no settings, and the maker's
# churro-ocr v0.3.0 profile for this model sends none, so its quick start's
# transformers backend reads under generation_config.json and transformers'
# defaults. vLLM raises a temperature above zero but below 0.01 to 0.01, so the
# engine samples this 1e-06 at 0.01, and each call record's `sampling_effective`
# says so.
temperature = 1e-06         # maker: generation_config.json
repetition_penalty = 1.05   # maker: generation_config.json
top_k = 50                  # transformers GenerationConfig default (v5.2.0)
top_p = 1.0                 # transformers GenerationConfig default (v5.2.0)
min_p = 0.0                 # transformers GenerationConfig default: unset, no min-p filter
source = "https://huggingface.co/stanford-oval/churro-3B/raw/ca2150ea465d5a3d67818c50e234b9422619c75d/generation_config.json"
revision = "ca2150ea465d5a3d67818c50e234b9422619c75d"
verification = "read by the project lead; the transformers defaults read from transformers v5.2.0 `GenerationConfig._get_default_generation_params` by the vendor-decoding session (Claude)"

