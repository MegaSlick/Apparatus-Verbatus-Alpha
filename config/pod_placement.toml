# Planning estimates only. This file selects no GPU class and does not authorize a
# pod; its fractions and caps must be benchmarked on the card actually rented.
# Each run seals this file beside the serving-recipes catalogue.
#
# Serving is SEQUENTIAL: one model at a time, with as much of the card as stays
# stable. Every tier is `residency = "single"`; a tier changes how much of the
# card that one model gets, never how many models run at once.
#
# `card_profile` rows are prebuilt profiles for the cards actually rented. An
# unknown card falls back to computed placement from the generic tiers. The
# hourly_usd figures are RunPod Secure on-demand prices checked 2026-08-05; the
# gpu_type_id strings come from RunPod's documentation, so confirm the exact
# accepted string in the console before a live launch. Nothing here chooses a
# card: that is the project lead's call.
#
# UNITS. `context_cap` is tokens. `batch_size` is concurrent sequences.
# `planned_batch_ceiling` is concurrent sequences too: the most a capacity plan
# (operations/serving/capacity.py) may launch a row with on a measured card of the
# tier, while `batch_size` bounds the row itself. Both are planning caps pending
# measurement on a rented card.
# `engine_memory_fraction` is a fraction of the card. **`pixel_cap` is a
# LONGEST-EDGE cap in pixels**, not a pixel count: 3,584 admits 3,584² =
# 12,845,056 pixels, exactly DAI's vendor `max_pixels`. A serving profile's
# `max_pixels` in `config/serving_recipes.toml` is a total pixel count, passed
# straight to vLLM's `--mm-processor-kwargs`. The two must never be compared
# directly; a longest edge of L admits at most L*L pixels.
#
# `context_cap` is the ceiling `operations/serving/preflight.py` holds every
# serving row at that tier to: an upper bound on each row's own `max_model_len`,
# not a per-request budget. It is 32,768 at the two smaller tiers and 65,536 at
# `generic-80gb-plus`, where the Perlector's whole-page reading needs about 58,000
# tokens; `config/serving_recipes_real.toml` carries each chair's arithmetic.
# `pixel_cap = 3,584` at every tier, so a chair's geometry does not change with the
# card class it is planned for.
# A cap is a ceiling, not a plan: what a card can hold at these contexts stays
# unmeasured until a pod runs.

schema = "pod-placement.v1"

[dtype_floor]
# Compute capability floors are configuration, never a bf16 assumption in code.
# These are configured dtype-support floors, not architecture identities or
# measurements taken on real silicon here (Hopper itself is capability 9.0).
float16 = "7.0"
bfloat16 = "8.0"
fp8 = "8.9"

[[tiers]]
id = "generic-24gb"
min_vram_gib = 22
max_vram_gib_exclusive = 40
residency = "single"
detector_device = "cpu"

[tiers.recipe]
# 0.90 is what DAI needs to be servable on this card class at all (18.7 GiB of
# 24; 0.78 is the minimum).
engine_memory_fraction = "0.90"
context_cap = 32768
pixel_cap = 3584
batch_size = 1
planned_batch_ceiling = 8

[[tiers]]
id = "generic-48gb"
min_vram_gib = 40
max_vram_gib_exclusive = 64
residency = "single"
detector_device = "cpu"

[tiers.recipe]
engine_memory_fraction = "0.78"
context_cap = 32768
pixel_cap = 3584
batch_size = 2
planned_batch_ceiling = 48

# The id names the card class this tier is planned for, not its literal
# numeric floor: a measured 64-79 GiB card lands here too, below the "80gb"
# the name suggests; no rented card falls in that gap. Placement itself only ever reads min_vram_gib/max_vram_gib_exclusive
# (`PlacementTable.choose`, operations/pod/preflight.py) -- the id is a label,
# read by a human, not a bound checked by code.
[[tiers]]
id = "generic-80gb-plus"
min_vram_gib = 64
residency = "single"
detector_device = "cpu"

[tiers.recipe]
engine_memory_fraction = "0.88"
context_cap = 65536
pixel_cap = 3584
# A ceiling, not a plan: a row asks for at most this many sequences and the
# engine's KV pool admits what the card holds. config/serving_recipes_real.toml
# carries each row's KV arithmetic.
batch_size = 8
planned_batch_ceiling = 64

# The rented cards.  `tier` must be one of the ids above; a
# profile whose vram_gib does not fall inside its own tier's band is refused at
# load, so a drifted row cannot quietly plan for the wrong card.

[[card_profile]]
name = "RTX 6000 Ada"
gpu_type_id = "NVIDIA RTX 6000 Ada Generation"
vram_gib = 48
hourly_usd = "0.77"
tier = "generic-48gb"
note = "spec 04 default — Ada silicon unlocks the FP8 lever Ampere never will"

[[card_profile]]
name = "RTX PRO 6000 Blackwell"
gpu_type_id = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
vram_gib = 96
hourly_usd = "1.99"
tier = "generic-80gb-plus"
note = "spec 04 scale tier — the biggest single-model serving profile"

[[card_profile]]
name = "A40"
gpu_type_id = "NVIDIA A40"
vram_gib = 48
hourly_usd = "0.44"
tier = "generic-48gb"
note = "spec 04 fallback where budget rules the day; Ampere, so no fp8"

[[card_profile]]
name = "RTX A5000"
gpu_type_id = "NVIDIA RTX A5000"
vram_gib = 24
