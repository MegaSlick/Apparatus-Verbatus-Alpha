# Planning estimates only.  This file selects no GPU class and does not authorize
# a pod.  Its fractions and caps must be benchmarked on the card actually rented.
# Unit 17 binds these tier bytes into each run alongside the separately selected
# serving-recipes catalogue: one authorized boot consumes one stage's selected
# tier, then closes by default.  It is never authority to carry a pod into the
# next stage or to create another one.
#
# Serving is SEQUENTIAL — one model at a time, as much of the card as stays
# stable, next model after (Tyrel's ruling, 2026-08-05).  Every tier below is
# `residency = "single"`; what a tier changes is how much of the card that one
# model gets, never how many models run at once.  A retired three-tier
# co-residency table (strictly_sequential / two_coresident_one_swapped /
# all_coresident) once lived here and must not be reintroduced.
#
# `card_profile` rows are the prebuilt profiles spec 04 asks for, for the cards
# actually rented.  An unknown card falls back to computed placement from the
# generic tiers.  The hourly_usd figures are the spec's own verified Secure
# on-demand prices (2026-07-30, re-checked by the lane-A build on 2026-08-05);
# the gpu_type_id strings come from RunPod's published documentation and have
# never been sent to the API, so confirm the exact accepted string in the console
# before the first live launch.  Nothing here chooses a card: that is Tyrel's
# call at this gate, and `config/spend.toml` refuses every paid path until he
# has configured it.
#
# UNITS, because two of these are easy to read wrong and one already was.
# `context_cap` is tokens.  `batch_size` is concurrent sequences.
# `engine_memory_fraction` is a fraction of the card.  **`pixel_cap` is a
# LONGEST-EDGE cap in pixels**, not a pixel count — 1344, 1792 and 2304 are
# side lengths; as total counts they would describe roughly 37x37, 42x42 and
# exactly 48x48 images, respectively.  A serving profile's `max_pixels` in
# `config/serving_recipes.toml` is the other thing:
# a total pixel count, passed straight to vLLM's `--mm-processor-kwargs`,
# where the old pipeline's proven values were 3136 (56x56) and 2359296
# (1536x1536).  The two must never be compared directly; the sound relation is
# that a longest edge of L admits at most L*L pixels.
#
# `context_cap` is the ceiling `operations/serving/preflight.py` holds every
# serving row at that tier to, and all three moved with the rows.  They were
# 2,048 / 4,096 / 8,192, and at those caps no row that could actually serve a
# whole page was admissible: a 300-dpi A4 page costs a Qwen-VL chair between
# 1,715 and 6,693 prompt tokens depending on the tier's `max_pixels`, before a
# word of prompt is counted.  `config/serving_recipes_real.toml` carries that
# arithmetic and the reasoning; the caps here are 16,384 at every tier, which
# is the largest `max_model_len` any row at that tier now declares -- the
# Perlector needs it everywhere, because its act request carries a region crop
# and a page render per capture view, and an ordinary two-view act costs 14,014
# tokens even at the smallest tier's `max_pixels`.  A cap is a ceiling, not a
# plan: what a card can hold at these contexts is unmeasured, and stays
# unmeasured until a pod runs.
schema = "pod-placement.v1"

[dtype_floor]
# Compute capability floors are configuration, never a bf16 assumption in code.
# These are configured dtype-support floors, not architecture identities or
# measurements taken on real silicon here (Hopper itself is capability 9.0).
float16 = "7.0"
bfloat16 = "8.0"
fp8 = "8.9"

[[tiers]]
id = "generic-24gb"
min_vram_gib = 22
max_vram_gib_exclusive = 40
residency = "single"
detector_device = "cpu"

[tiers.recipe]
engine_memory_fraction = "0.58"
context_cap = 16384
pixel_cap = 1344
batch_size = 1

[[tiers]]
id = "generic-48gb"
min_vram_gib = 40
max_vram_gib_exclusive = 64
residency = "single"
detector_device = "cpu"

[tiers.recipe]
engine_memory_fraction = "0.78"
context_cap = 16384
pixel_cap = 1792
batch_size = 2

# The id names the card class this tier is planned for, not its literal
# numeric floor: a measured 64-79 GiB card lands here too, below the "80gb"
# the name suggests, because 64 GiB is the old pipeline's own next measured
# boundary and no card in that 64-79 GiB gap is among the rented classes
# below. Placement itself only ever reads min_vram_gib/max_vram_gib_exclusive
# (`PlacementTable.choose`, operations/pod/preflight.py) -- the id is a label,
# read by a human, not a bound checked by code.
[[tiers]]
id = "generic-80gb-plus"
min_vram_gib = 64
residency = "single"
detector_device = "cpu"

[tiers.recipe]
engine_memory_fraction = "0.88"
context_cap = 16384
pixel_cap = 2304
batch_size = 4

# The cards spec 04 names by name.  `tier` must be one of the ids above; a
# profile whose vram_gib does not fall inside its own tier's band is refused at
# load, so a drifted row cannot quietly plan for the wrong card.

[[card_profile]]
name = "RTX 6000 Ada"
gpu_type_id = "NVIDIA RTX 6000 Ada Generation"
vram_gib = 48
hourly_usd = "0.77"
tier = "generic-48gb"
note = "spec 04 default — Ada silicon unlocks the FP8 lever Ampere never will"

[[card_profile]]
name = "RTX PRO 6000 Blackwell"
gpu_type_id = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
vram_gib = 96
hourly_usd = "1.99"
tier = "generic-80gb-plus"
note = "spec 04 scale tier — the biggest single-model serving profile"

[[card_profile]]
name = "A40"
gpu_type_id = "NVIDIA A40"
vram_gib = 48
hourly_usd = "0.44"
tier = "generic-48gb"
note = "spec 04 fallback where budget rules the day; Ampere, so no fp8"

[[card_profile]]
name = "RTX A5000"
gpu_type_id = "NVIDIA RTX A5000"
vram_gib = 24
hourly_usd = "0.27"
tier = "generic-24gb"
note = "spec 04 smoke-run fallback"
