# R5b Pass-C audit policy.  Its values are sealed into every run, and every
# page-reading records the audit as not run (`common/perlector_audit.py`).
#
# `pipeline/4_perlector/audit.py` validates the policy: `round_cap` is bounded by
# `absolute_round_cap`, a cap above `default_round_cap` needs an approval
# reference, and a cap above 1 is refused because no second pass exists to run.
# No stage has a runtime switch for either value.
schema = "perlector-audit.v3"
default_round_cap = 1
absolute_round_cap = 2
round_cap = 1
approval_ref = ""
