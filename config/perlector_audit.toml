# R5b Pass-C audit policy.  These bytes are sealed into every run.
#
# One round is the production default, and one round is all this build performs:
# `pipeline/4_perlector/audit.py` refuses `round_cap` above 1 even with Tyrel's
# approval reference, because no second re-proof pass exists to run.  Lowering it
# to 0 is permitted and routes flagged acts to review.  `absolute_round_cap`
# declares how far the cap may ever be raised once that pass is built; no
# configuration can exceed it, and no stage has a runtime switch for either value.
#
# v2 seals, beside every audit finding, what became of the re-proof itself:
# whether one was due, whether the cap allowed it, and whether the delivered call
# completed. A v1 record could not say, and a re-proof cut off by its engine that
# returned the frozen text unchanged was sealed as resolved. Consumers refuse a
# v1 record by name; nothing reads it forward.
schema = "perlector-audit.v2"
default_round_cap = 1
absolute_round_cap = 2
round_cap = 1
approval_ref = ""
