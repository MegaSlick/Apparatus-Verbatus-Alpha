# Grouping and reconciliation thresholds: geometric policy for the
# Designator's structure/grouping/conservation pass, expressed as a fraction
# of the page's own dimensions wherever a fraction is the honest shape, and
# left absolute wherever it is not.
#
# `[grouping.page_fraction_bp]` holds thresholds that scale with the page:
# integer basis points (1/10000), never a float -- canonical artifacts carry
# integers, never floats (`common/contracts/canonical.py`), and
# `config/designator_padding.toml` already ruled this project's fractional
# policy values are basis points for exactly that reason. Resolve a field to
# pixels with `geometry._pad_amount(dimension, bp)` -- round-half-up, pure
# integer arithmetic -- never write a second rounding rule.
#
# Each field's basis is named below because it is NOT uniform: five fields
# are a fraction of the page's own HEIGHT and one (`margin_bp`) is a fraction
# of the page's own WIDTH. `page_edge_reach_bp` was the sixth height-based
# field until 2026-09-06 and is now `[grouping.continuation]`'s only field, for
# the reason `page_area_bp` has a table of its own: it was
# re-derived on 44 real pages and this table's provenance says, truthfully of
# everything left in it, that its values are unmeasured fixture conversions. This basis is a design decision recorded in
# SPEC_C section 2, chosen from what each threshold is compared against in
# code -- vertical extents for the six height-based fields, the page-width
# margin lane for `margin_bp` -- not a property recovered from the retired
# pixel constants themselves: six of the seven were bare pixel counts with no
# dimension to measure against, and `review_priority_min_dimension_bp`'s own
# retired constant (`conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX`)
# is documented as applying on either axis, not against height specifically
# (see `conservation.py`). Resolving it against height here is this build's
# choice, not something the old code measured.
#
#   field                               | basis  | retired constant
#   ------------------------------------|--------|---------------------------
#   margin_bp                           | WIDTH  | grouping.DEFAULT_MARGIN_FRACTION (0.15)
#   chain_gap_bp                        | HEIGHT | grouping.DEFAULT_CHAIN_GAP_PX (6)
#   anchor_reach_bp                     | HEIGHT | grouping.DEFAULT_ANCHOR_REACH_PX (2)
#   brace_min_height_bp                 | HEIGHT | grouping.DEFAULT_BRACE_MIN_HEIGHT_PX (30)
#   review_priority_min_dimension_bp    | HEIGHT | conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX (6)
#   fallback_overlap_bp                 | HEIGHT | grouping.DEFAULT_FALLBACK_OVERLAP_PX (8)
#
# `[grouping.continuation]` holds `page_edge_reach_bp`, a fraction of the page's
# own HEIGHT: how close a group's bounds must come to the top or bottom edge for
# `grouping.find_continuation_candidate` to treat it as reaching that edge. It
# has a table and a provenance block of its own because it is measured -- 44
# real pages, `sample_count = 44` -- and the six values left in
# `page_fraction_bp` are not. Its retired value, 154, was a conversion of
# `grouping.DEFAULT_PAGE_EDGE_REACH_PX` (4) against the 200x260 fixture, and it
# passed on none of those 44 pages.
#
# `[grouping.absolute]` holds `gap_tolerance_px`, which stays a raw pixel
# count and must NEVER be converted to a page-fraction basis point -- see the
# provenance caveat below. It is the one field in this file this build cannot
# honestly set.
#
# `[grouping.page_area_bp]` holds `page_spanning_area_bp`, and it is a fourth
# sub-table rather than an eighth `page_fraction_bp` field because it is a
# fraction of the page's AREA and never resolves to pixels at all.
# `page_fraction_bp`'s whole contract is one declared basis per field -- WIDTH or
# HEIGHT -- and a field that is a fraction of both at once has no place in it;
# `band_bp` already sits outside that table for the same reason. It carries its
# own provenance block, with `sample_count = 17`, because unlike the seven
# unmeasured defaults it was measured against real material and unlike
# the ink map's `[background]` four it was measured on seventeen pages rather than
# on 127.
#
#   page_spanning_area_bp  how much of the page one connected component's
#                          bounding box may cover and still be treated as
#                          CONNECTIVE TISSUE by the grouping pass. A component
#                          at or past this bound is withheld from column
#                          assignment and from body chaining. It is NOT removed
#                          from the page, from the ink count, or from
#                          conservation: its pixels stay below the ink
#                          threshold and stay in `total_ink_pixel_count`.
#                          Declared or fallback coverage may claim some or all;
#                          conservation records any unclaimed remainder as
#                          residual held evidence. The component itself is published by
#                          name on the page's conservation record
#                          (`page_spanning_components`), so what was set aside
#                          is on the record rather than inferable from a
#                          missing group
#
# The background-inference policy, the coverage audit, and the page-spanning bound
# and connectivity radius the audit reads live in `config/ink_map.toml`, sealed
# as `ink-map`. This pass reads that file too, and refuses a run whose
# `page_spanning_area_bp` or `gap_tolerance_px` here differs from the ink map's,
# so the component it withholds is the one the audit takes out.
#
# Three bare integer counts live at the top of `[grouping]` (not basis points,
# not sub-table fields), because none of them is a length and none has a page
# dimension to be a fraction of:
#
#   max_residual_components   how many residual components one page's
#                             conservation record may enumerate before the page
#                             itself is held as one review item instead
#   max_secondary_proposals   how many secondary rescue candidates one page may
#                             cut and hold as separate review items before the
#                             page's secondary pass is held as one instead; the
#                             same ceiling as above, on the other enumeration
#                             this stage mints per page
#   fallback_bands            how many horizontal bands the predetermined
#                             fallback grid cuts a page into. A cardinality, not
#                             a length: a page twice as tall does not get twice
#                             as many bands, it gets bands twice as tall, and
#                             `fallback_overlap_bp` beside it is the part of that
#                             grid that *is* a length and does scale
#
# **Both ceilings bound one page, not the run.** The operator reads the exported
# review queue in fixed-size pages and reports its run-wide total. A run of many
# pages can therefore produce more review items than either per-page ceiling;
# these two values bound the work and evidence one page can mint. See the
# provenance block and `pipeline/2_designator/CONTRACT.md` for the reasoning.
#
# **Two constants deliberately do NOT live here and never will:**
# `common/background.py`'s `PRIMARY_MARGIN` (20) and `SECONDARY_MARGIN` (2) are
# absolute 8-bit ink-intensity offsets, not page geometry -- scaling either by a
# page dimension is meaningless, and `common/test_designator_recensor_ink_calibration.py`
# pins that `conservation.reconcile` defaults to `SECONDARY_MARGIN` and that the
# Recensor's own contrast constant, read as a source literal, is at least it. Moving it into a per-run config value would make that
# cross-stage invariant unenforceable statically -- a sealed run could carry
# a margin the Recensor would then call ink what the Designator dismissed,
# which is the one direction of ink loss `conservation.py` names as unsafe.
# They stay Python module constants. This file's closed schema refuses a
# `primary_margin` or `secondary_margin` key wherever one is written, by name.
#
# `config/ink_map.toml`'s `[background] ink_margin_bp` is not one of them and does not weaken
# that rule. It carries no grey level of its own: it is the fraction of the
# distance between a page's *own* two grey-level population modes that
# `background._derived_ink_margin` deducts from the inferred paper value, floored
# at `PRIMARY_MARGIN`. The same sealed 3333 derives a margin of 46 on this
# repository's fixture page and 71 on a photographed register opening, because
# those pages have different contrast and not because anything here changed. The
# invariant the AST pin protects is between the Recensor's contrast constant and
# `SECONDARY_MARGIN`, and `SECONDARY_MARGIN` is not derived, so the pin still
# compares two fixed constants.

[grouping]
# Retained sealed value with no current producer or consumer effect. The current
# producer retains every residual component and partitions it under
# [grouping.residual_presentation]; it does not withhold a list at this count.
max_residual_components = 2000
max_secondary_proposals = 2000
fallback_bands = 4

[grouping.residual_presentation]
# A residual below BOTH floors remains fully recorded on its page's aggregate
# accounting hold rather than becoming a fictitious act.  The pixel floor sits
# at a conservative operational value; the box-area floor keeps a thin marginal
# line visible even when its ink is sparse. These floors only
# choose presentation/accounting granularity after conservation measures every
# component; they never exclude ink or authorize a reading-quality reroll.
residual_aggregate_max_pixel_count = 500
residual_aggregate_max_area_px = 2000

[grouping.residual_presentation.provenance]
source = "conservative operational presentation thresholds introduced for bounded review-cardinality handling; no calibration corpus was used"
corpus = "none"
sample_unit = "page"
sample_count = 0
statistic = "none -- these thresholds are an operational presentation policy, not a measured percentile"
calibrated_for_this_corpus = false
caveat = "UNMEASURED. Components at either threshold are promoted to their own held act; components below both thresholds remain individually retained in the page aggregate. Recalibrate on labelled residual components before claiming these values distinguish meaningful writing from dust."

[grouping.page_fraction_bp]
margin_bp = 1500
chain_gap_bp = 231
anchor_reach_bp = 77
brace_min_height_bp = 1154
review_priority_min_dimension_bp = 231
fallback_overlap_bp = 308

[grouping.continuation]
page_edge_reach_bp = 280

[grouping.continuation.provenance]
source = "measured on this Mac, 2026-09-06, over the 44 pages of the corpus named below. For each page the shipped pass was run end to end -- common.imaging.grayscale_rows, common.background.infer_background_evidence, structure.primary_scan at the margin the page derives for itself, grouping.group_page under the sealed page_spanning_area_bp -- and the distance from each page edge to the nearest group bound was recorded in basis points of the relevant dimension. The driver and its raw records are named in the project's own timing/audit notes. The retired value 154 was not measured against anything: it is a basis-point conversion of grouping.DEFAULT_PAGE_EDGE_REACH_PX (4) against this repository's 200x260 fixture page, and it sits under [grouping.provenance] with the six other unmeasured conversions until this block took it out"
corpus = "47 real pages drawn once under the fixed seed audit-gates-2026-09-06: the seven review proxies under private/triage/measured/2026-08-22_005469606_62-68 as a control, the ten photographed pages the ink-margin unit measured on, 20 more flatbed pages from teklia_dai_cretdhi drawn from the 687 not already in the ten, and 10 more parish master pages (4 Embrun, 2 Montebello, 4 Oka) drawn from the 5,493 not already in the ten. 1.5 to 18.4 megapixels, five sources, three capture conditions. Three of the 47 -- all review proxies -- are refused by [grouping.background] max_ink_bp and carry no figure here, so every number below is over the 44 that infer a paper value. 29 of the 44 infer through the surround branch (inferred-interior-mode) and 15 through the plain modal branch (inferred-modal), which is the photographed/flatbed split this sample contains. THE SPLIT IS NOT A BEZEL-FREE CONTROL AND MUST NOT BE READ AS ONE: all 44, on both branches, carry exactly one page-spanning component, holding 35 to 87 per cent of every pixel the audit calls ink (median 65). The flatbed pages were sampled to be the counter-case and are not one -- their leaves sit in a dark frame with a gutter, and the frame welds. This sample therefore contains NO page whose largest component is an ordinary mark. No page here passed through pipeline/1_exemplar, and no page was copied into this tree"
sample_unit = "page"
sample_count = 44
statistic = "the distance in basis points of the page's own HEIGHT from the top edge to the topmost group bound, and from the bottom edge to the bottommost group bound, over the 44 measurable pages -- reported as the whole ordered distribution, because the value is placed in a measured gap in the lower tail of it and not at a quantile"
calibrated_for_this_corpus = true
caveat = "WHAT THE SAMPLE ESTABLISHES. The retired 154 basis points could not fire. Measured over these 44 pages the bottommost group sits 157 to 1131 basis points above the page's bottom edge (median 427) and the topmost group sits 0 to 2366 below its top edge (median about 404), so find_continuation_candidate's bottom reach test passed on 0 of 44 and its top reach test on 3 of 44. A test that passes on no page decides nothing, and before the page-spanning bound existed the same two tests passed on 14 of 14 by construction because the whole-leaf group WAS the extreme group -- the threshold has been vacuous in both directions and never in between. 280 is placed in the widest gap in the lower tail of the measured bottom distribution: the sorted bottom margins run 157, 161, 163, 164, 171, 188, 204, 242, 242, 252, 257, then 304, so the gap 257 to 304 is 47 basis points wide and 280 is its midpoint. At 280 the bottom test passes on 11 of 44 and the top test on 13 of 44; every value from 258 to 303 gives the identical bottom partition, which is said here rather than hidden. WHAT THE SAMPLE DOES NOT ESTABLISH, AND IT IS THE HALF THAT MATTERS. These 44 pages are not consecutive pairs. find_continuation_candidate asks a question about TWO pages -- page A's trailing group near its bottom AND page B's leading group near its top AND no anchor on page B's leading group AND a shared column -- and this sample can only report the two marginal distributions the reach tests read. It says nothing about how often the conjunction holds on real consecutive openings, and nothing about whether a group near the bottom edge of a photographed page is in fact an act that runs on. It is also worth stating that the anchor test would still reject 37 of these 44 leading groups on its own, so raising this reach does not by itself make continuations common. Re-derive against consecutive pages from one register before trusting the joint behaviour. Finally, this value never removes a pixel from anything, but it does decide holds: the Recensor holds for review every act a continuation candidate names, because a head alone is truncated and a tail alone has no heading. A value too large holds acts that were whole; a value too small names fewer crossings and holds fewer halves. The act-group record's geometric_corroboration reads the same reach and is only recorded"

[grouping.absolute]
gap_tolerance_px = 3

[grouping.page_area_bp]
page_spanning_area_bp = 5000

[grouping.page_area_bp.provenance]
source = "measured on this Mac, 2026-09-06, over 17 real pages: the seven review proxies under private/triage/measured/2026-08-22_005469606_62-68 and the ten photographed register pages the ink-margin unit measured on (four sources: Embrun, Montebello, recordgold_evaluation_val_v1, teklia_dai_cretdhi). Three of the seventeen are refused by [grouping.background] max_ink_bp and are not in any figure below, so every number here is over the 14 pages that infer a paper value. Each page was decoded through common.imaging.grayscale_rows, scanned through the shipped structure.primary_scan at the margin the page derives for itself, labelled through the shipped structure.label_components at the sealed gap_tolerance_px = 3, and grouped through the shipped grouping.group_page; the driver, its raw records and the before/after overlays are named in the project's own grouping notes. No page was copied into this tree and nothing under private/ was modified"
corpus = "the same 17 real pages the shared-background unit measured the coverage audit on -- 1.5 to 18.4 megapixels, photographed register openings and scans from four parish registers and one expert OCR corpus. On every one of the 14 measurable pages the primary scan produced one connected component whose bounding box was the whole page. Those measurements do not establish whether that component is bezel, writing, or another dark population, and the sample contains no measurable photographed page without one, so it cannot show what this bound does when the largest component is a genuine page-spanning mark. No page here passed through pipeline/1_exemplar"
sample_unit = "page"
sample_count = 17
statistic = "the bounding-box area of every connected component the primary scan finds, as floor-divided basis points of the page's own area, over all 14 measurable pages -- reported as the largest value and the largest value excluding the single page-spanning component, because the bound is placed in a measured gap between those two populations and not at a quantile. Beside it, for the same 14 pages before and after the bound is applied: the number of act groups, the group bounding-box areas in the same basis points, the number of groups whose bounds reach a page edge, and the residual component and pixel counts conservation.reconcile mints against the resulting coverage"
calibrated_for_this_corpus = true
caveat = "WHAT THE SAMPLE ESTABLISHES. On all 14 measurable pages exactly ONE component's bounding box covers the whole page: span 10000 basis points of the width AND of the height, bounding box {x:0, y:0, w:page width, h:page height}, holding 69.5 to 95.2 percent of every ink pixel the scan counted (median 85.68). The largest bounding box of any OTHER component on any of the 14 is 472 basis points -- 4.7 percent of a page -- so the gap this bound sits in runs from 472 to 10000 and is 9528 basis points wide, which is the widest gap any value in this file has been placed in. The bound is not, however, free within that gap: the FLOOR is set by this repository's own fixture pages, whose largest component covers 2996 basis points of a 200x260 page and is a legitimate act, so any value at or below 2996 would withhold a real act on the walking skeleton and every fixture measurement would move. 5000 is chosen as half the page: it is 1.7x the fixture floor and below every measured whole-page component. The sample does not establish a universal maximum legitimate act size. WHAT CHANGES, MEASURED. Before the bound, group_page returned 10 to 439 groups per page of which exactly one had the page's own bounds -- maximum group area 10000 basis points on all 14 -- and conservation.reconcile minted 0 residual components and 0 residual pixels on all 14, so the coverage audit's denominator, 'ink outside declared coverage', was empty by construction. After it, the group count moves by at most 1 on every page (unchanged on 9, one fewer on 4, one more on 1), the maximum group area falls to 883 to 5258 basis points, the number of groups whose bounds reach a page edge falls from 1 to 0 on all 14, the number of groups covering more than a quarter of the page falls from 1 or 2 to 0 on 9 of the 14, and conservation mints 1 residual component on 11 of the 14 and 71, 113 and 320 on the other three, against the sealed max_residual_components of 2000 -- so no page is held as one and the guaranteed fallback grid does not fire on any of the 14, every one of which still reads as 'detected'. WHAT THE SAMPLE DOES NOT ESTABLISH. It does not establish that 5000 is right rather than 4000 or 8000: every value from 2000 to 9000 gives an identical partition on all 14 pages, because on each of them there is exactly one component in the gap and it covers the entire page. The value is therefore chosen by the fixture floor and by reasoning about what an act can be, not discriminated by this corpus, and that is the honest statement of it. It establishes nothing about a measurable photographed page without a whole-page component, because the sample contains none: on a page whose text is dense enough that gap_tolerance_px = 3 welds every line into one component covering more than half the leaf, this bound would withhold that component and produce fallback coverage rather than detected groups. Conservation would still count every pixel, with fallback or declared coverage able to claim it and any unclaimed remainder reported as residual held evidence. That behavior is visible, but it is not measured on this corpus. It establishes nothing about a page admitted through pipeline/1_exemplar, and nothing about what a real structure-pass model would propose, since the walking skeleton has no model to call. FIVE OF THE 14 STILL CARRY A GROUP OVER A QUARTER OF THE PAGE after the bound (3175 to 5258 basis points), and the overlays show what they are: on three review proxies, one Montebello master and one RecordGold evaluation page the group spans one leaf of a two-leaf opening. That is the limit [grouping.background]'s own caveat already names -- one paper value inferred for a frame holding two differently-lit leaves -- reaching grouping rather than a second page-spanning component this bound missed. A per-region background is the repair and it is a different unit. Finally, this bound never removes a pixel from the ink count or from conservation: a component it withholds is still ink and still in total_ink_pixel_count. Declared or fallback coverage may claim some or all of those pixels; conservation records any unclaimed remainder as residual held evidence. Nothing here is a silent loss, and see pipeline/2_designator/grouping.py::partition_page_spanning for why withholding is not the same as excluding"

[grouping.provenance]
source = "every page_fraction_bp value is a basis-point conversion of the retired module-level Python default it replaces (grouping.DEFAULT_MARGIN_FRACTION, grouping.DEFAULT_CHAIN_GAP_PX, grouping.DEFAULT_ANCHOR_REACH_PX, grouping.DEFAULT_BRACE_MIN_HEIGHT_PX, grouping.DEFAULT_PAGE_EDGE_REACH_PX, conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX), computed against this project's own synthetic fixture pages (proof/fixtures/synthetic-two-page-v0, measured 200x260) with geometry._pad_amount round-half-up so every field resolves bit-identically to the retired constant at that size; gap_tolerance_px is carried forward unconverted from structure.DEFAULT_GAP_TOLERANCE_PX (3); fallback_overlap_bp is a basis-point conversion of grouping.DEFAULT_FALLBACK_OVERLAP_PX (8) and fallback_bands is grouping.DEFAULT_FALLBACK_BANDS (4) carried forward unconverted; max_secondary_proposals is an unmeasured operational ceiling; max_residual_components remains a sealed but inactive value; neither the current producer nor current consumers use it"
corpus = "none of these values comes from a measured parish-register corpus. The six page_fraction_bp values are unmeasured walking-skeleton defaults tuned by eye against this project's own tiny synthetic fixtures, not derived from any register sample; gap_tolerance_px has no corpus behind it at all -- see caveat; fallback_bands is a four-band grid chosen by eye for a fixture page and matched against no register layout; max_secondary_proposals is reasoned from the operator console's documented item ceiling; max_residual_components is an inactive sealed value rather than an active threshold"
sample_unit = "page (the synthetic fixture pages under proof/fixtures/synthetic-two-page-v0, not a real register record or act)"
sample_count = 0
statistic = "none -- every field here is an unmeasured default or a policy ceiling reasoned from another module's documented limit, not a computed percentile or summary statistic over any sample"
calibrated_for_this_corpus = false
caveat = "gap_tolerance_px is the loudest number in this file and must never be expressed as a page-fraction basis point. It is a stroke-connectivity radius -- how many blank pixels two ink runs may have between them and still count as one connected mark -- not a page-layout proportion, and it must not scale with page size: Scaling it the way the six page_fraction_bp fields scale -- to ~41px on a 3508px-tall real page -- would change what 'connected' means, bridging inter-word gaps into merged lines rather than just closing letterform strokes. This caveat used to add that the labeller's cost was quadratic in this value; that was true of the retired per-pixel labeller (383s at gap 3 on a real page at 300-DPI-equivalent size) and is not true of the row-run implementation that replaced it on 2026-09-05, which measures 2.7s at gap 3 and 3.2s at gap 8 on the same page. Runtime is therefore no longer an argument about this number in either direction; the connectivity argument above is the whole of it. Its correct value is a function of scan resolution (DPI, stroke width in pixels), not of page dimension, and no measurement of that relationship exists in this project yet; it stays absolute at 3 by decision, not by oversight. Separately, fallback_bands and fallback_overlap_bp decide the crop rectangles that actually reach the Attestatores and the Perlector on a page with no eligible structural group, and they are the least measured values in this file: four bands is a guess against a 200x260 fixture, and a real register page may hold thirty entries. They are sealed here so a run can name what it cut rather than because the numbers are right. max_secondary_proposals is an unmeasured presentation ceiling. max_residual_components is not an active producer or consumer rule: it remains sealed as an inactive value. Older withheld records are no longer readable. New residual presentation uses the separately declared, explicitly uncalibrated [grouping.residual_presentation] floors and retains every component. Every active value in this block needs re-derivation against this project's own real corpus before calibrated_for_this_corpus may become true."
