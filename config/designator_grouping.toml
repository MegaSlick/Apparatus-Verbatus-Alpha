# Grouping and reconciliation thresholds: geometric policy for the
# Designator's structure/grouping/conservation pass, expressed as a fraction
# of the page's own dimensions wherever a fraction is the honest shape, and
# left absolute wherever it is not.
#
# `[grouping.page_fraction_bp]` holds thresholds that scale with the page:
# integer basis points (1/10000), never a float -- canonical artifacts carry
# integers, never floats (`common/contracts/canonical.py`), and
# `config/designator_padding.toml` already ruled this project's fractional
# policy values are basis points for exactly that reason. Resolve a field to
# pixels with `geometry._pad_amount(dimension, bp)` -- round-half-up, pure
# integer arithmetic -- never write a second rounding rule.
#
# Each field's basis is named below because it is NOT uniform: six fields
# are a fraction of the page's own HEIGHT and one (`margin_bp`) is a fraction
# of the page's own WIDTH. This basis is a design decision recorded in
# SPEC_C section 2, chosen from what each threshold is compared against in
# code -- vertical extents for the six height-based fields, the page-width
# margin lane for `margin_bp` -- not a property recovered from the retired
# pixel constants themselves: six of the seven were bare pixel counts with no
# dimension to measure against, and `review_priority_min_dimension_bp`'s own
# retired constant (`conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX`)
# is documented as applying on either axis, not against height specifically
# (see `conservation.py`). Resolving it against height here is this build's
# choice, not something the old code measured.
#
#   field                               | basis  | retired constant
#   ------------------------------------|--------|---------------------------
#   margin_bp                           | WIDTH  | grouping.DEFAULT_MARGIN_FRACTION (0.15)
#   chain_gap_bp                        | HEIGHT | grouping.DEFAULT_CHAIN_GAP_PX (6)
#   anchor_reach_bp                     | HEIGHT | grouping.DEFAULT_ANCHOR_REACH_PX (2)
#   brace_min_height_bp                 | HEIGHT | grouping.DEFAULT_BRACE_MIN_HEIGHT_PX (30)
#   page_edge_reach_bp                  | HEIGHT | grouping.DEFAULT_PAGE_EDGE_REACH_PX (4)
#   review_priority_min_dimension_bp    | HEIGHT | conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX (6)
#   fallback_overlap_bp                 | HEIGHT | grouping.DEFAULT_FALLBACK_OVERLAP_PX (8)
#
# `[grouping.absolute]` holds `gap_tolerance_px`, which stays a raw pixel
# count and must NEVER be converted to a page-fraction basis point -- see the
# provenance caveat below. It is the one field in this file this build cannot
# honestly set.
#
# `[grouping.surround]` holds the shape test that tells a photographed page from
# a genuinely dark one, and it is the only block in this file measured against
# real material -- so it carries a provenance block of its own, with
# `calibrated_for_this_corpus = true` and `sample_count = 7`, rather than sitting
# under the file-level provenance whose `sample_count` is 0. One block could not
# describe both truthfully.
#
#   band_bp                the border frame this test measures, as a fraction of
#                          the page. The ONLY length in this file that resolves
#                          against BOTH dimensions -- band_bp of the width on the
#                          left and right, band_bp of the height on top and
#                          bottom -- because the band is a frame, not an extent.
#                          That is exactly why it cannot live in
#                          page_fraction_bp, whose contract is one declared basis
#                          per field, and why grouping_config resolves it in its
#                          own function
#   min_border_dark_bp     how much of that band must be at or below the page's
#                          own modal value for the dark to count as a surround
#   max_interior_dark_bp   and how little of the complementary interior may be,
#                          so that a page which is dark all over is still refused
#
# The last two are fractions of a pixel *population*, not of a page, so they
# never resolve to pixels. All three are read only where `infer_background` would
# otherwise have refused: an ordinary scan whose modal pixel is its paper never
# reaches them. **The surround this test identifies is never removed from the
# page** -- it stays below the ink threshold and is counted as ink by the
# structure scan and by conservation alike, and what is recorded instead is a
# measurement of how much of that counted ink is bezel. See
# pipeline/2_designator/structure.py::_dark_surround for why a measurement and
# not a region.
#
# Three bare integer counts live at the top of `[grouping]` (not basis points,
# not sub-table fields), because none of them is a length and none has a page
# dimension to be a fraction of:
#
#   max_residual_components   how many residual components one page's
#                             conservation record may enumerate before the page
#                             itself is held as one review item instead
#   max_secondary_proposals   how many secondary rescue candidates one page may
#                             cut and hold as separate review items before the
#                             page's secondary pass is held as one instead; the
#                             same ceiling as above, on the other enumeration
#                             this stage mints per page
#   fallback_bands            how many horizontal bands the predetermined
#                             fallback grid cuts a page into. A cardinality, not
#                             a length: a page twice as tall does not get twice
#                             as many bands, it gets bands twice as tall, and
#                             `fallback_overlap_bp` beside it is the part of that
#                             grid that *is* a length and does scale
#
# **Both ceilings bound one page, not the run.** `operations/operator/review.py`
# refuses a run whose exported review queue passes `MAX_REVIEW_ITEMS` (50,000)
# by name, and nothing counts that total while a run is being produced; a run of
# many pages each just inside these bounds still meets that refusal at the
# console. What these two values buy is that no *single* page can make a run
# unopenable on its own. See the provenance block and
# `pipeline/2_designator/HANDOFF.md` for the reasoning and the remainder.
#
# **Two constants deliberately do NOT live here and never will:**
# `structure.PRIMARY_MARGIN` (20) and `structure.SECONDARY_MARGIN` (2) are
# 8-bit ink-intensity offsets, not page geometry -- scaling either by a page
# dimension is meaningless, and `common/test_designator_recensor_ink_calibration.py`
# is an AST pin that reads `SECONDARY_MARGIN` as a source literal in
# `structure.py` and cross-checks it against the Recensor's own contrast
# constant. Moving it into a per-run config value would make that
# cross-stage invariant unenforceable statically -- a sealed run could carry
# a margin the Recensor would then call ink what the Designator dismissed,
# which is the one direction of ink loss `conservation.py` names as unsafe.
# They stay Python module constants. This file's closed schema refuses a
# `primary_margin` or `secondary_margin` key wherever one is written, by name.

[grouping]
max_residual_components = 2000
max_secondary_proposals = 2000
fallback_bands = 4

[grouping.page_fraction_bp]
margin_bp = 1500
chain_gap_bp = 231
anchor_reach_bp = 77
brace_min_height_bp = 1154
page_edge_reach_bp = 154
review_priority_min_dimension_bp = 231
fallback_overlap_bp = 308

[grouping.absolute]
gap_tolerance_px = 3

[grouping.surround]
band_bp = 500
min_border_dark_bp = 7000
max_interior_dark_bp = 3000

[grouping.surround.provenance]
source = "measured on this Mac, 2026-09-05, over the seven real photographed French register pages kept as review proxies under private/triage/measured/2026-08-22_005469606_62-68 (Montebello 005469606, pages 62-68), plus three synthetic controls built from the dark-page shapes pipeline/2_designator/test_structure.py and test_structure_failure.py already refuse. The statistic is the fraction of pixels at or below the page's own modal value, taken separately over a border band of band_bp of each dimension and over the complementary interior, in the same floor-divided basis points structure._dark_surround computes. Band widths of 250, 500 and 1000 bp were all measured; 500 separates the two populations with a wide margin on both sides at the smallest cost in geometry, and was chosen for that. At 500 bp the seven real pages measure border 7864-8637 bp and interior 156-1190 bp. The inverted-scan control (80 percent of the page at 30, 20 percent at 220) measures border 6578 and interior 8333 and is refused by both bounds; the light-border/dark-core control measures border 0 and is refused by the first. The uniformly-black control never reaches this test at all -- its mode equals its mean, so it is refused one branch later by the PRIMARY_MARGIN guard, exactly as before. min_border_dark_bp = 7000 sits in the 6578-7864 gap, placed nearer the refusing side because a wrongly refused page is cut blind with ink_measurable false while a wrongly admitted one over-counts ink visibly and still reconciles; max_interior_dark_bp = 3000 sits in the 1190-8333 gap. Recorded in workbench/active/TIMING_REPORT_2026-09-05.md section 1a and the 2026-09-05 (night) entry of workbench/standing/SPEC_FINDINGS.md"
corpus = "seven review proxies from one capture session of one register (Montebello 005469606, pages 62-68), 1449x1052 to 1952x1483, 8-bit grayscale, no DPI tag. They are genuine photographed register openings with a black surround, a colour-target card and a paper flap, and they are the target corpus -- but they are downsampled review proxies, not the 3903x2966-to-4839x3158 masters, which are not on this disk. All three values are population fractions rather than lengths and are therefore scale-invariant, which is what makes a proxy measurement admissible for them and would not make it admissible for a pixel threshold"
sample_unit = "page"
sample_count = 7
statistic = "range (minimum and maximum) of the per-page dark-pixel fraction over the seven pages, in basis points, taken separately over the border band and the interior. No percentile or mean is reported because seven pages cannot support one"
calibrated_for_this_corpus = true
caveat = "This flag says these three numbers were measured on real material from the target corpus rather than chosen by eye. It does not say they generalise, and seven pages from one capture session is a thin sample: every page in it has the same photographic setup, the same operator and the same lighting. A different shoot, a flatbed scan with a dark platen lid, a page photographed against a light surface, a page whose frame is dark on only two sides, or a heavily blotted interior are all shapes this sample contains no example of, and the first four would fall back to the refusal this test exists to avoid rather than to a wrong answer. Re-derive against a second capture before trusting it. What the sample does establish is the separation the thresholds sit in: no real page measured closer than 864 bp to min_border_dark_bp and none closer than 1810 bp to max_interior_dark_bp, and the nearest refusing control is 422 bp on the other side of the first. This test never removes a pixel from the structure scan or from conservation -- the surround stays in the page and is counted as ink -- so a misjudgement here changes which value is reported as paper and shows up in the page's own ink fraction; it is never a silent loss. See pipeline/2_designator/structure.py::_dark_surround for why the surround is recorded as a measurement rather than cut out as a region"

[grouping.provenance]
source = "every page_fraction_bp value is a basis-point conversion of the retired module-level Python default it replaces (grouping.DEFAULT_MARGIN_FRACTION, grouping.DEFAULT_CHAIN_GAP_PX, grouping.DEFAULT_ANCHOR_REACH_PX, grouping.DEFAULT_BRACE_MIN_HEIGHT_PX, grouping.DEFAULT_PAGE_EDGE_REACH_PX, conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX), computed against this project's own synthetic fixture pages (proof/fixtures/synthetic-two-page-v0, measured 200x260) with geometry._pad_amount round-half-up so every field resolves bit-identically to the retired constant at that size; gap_tolerance_px is carried forward unconverted from structure.DEFAULT_GAP_TOLERANCE_PX (3); fallback_overlap_bp is a basis-point conversion of grouping.DEFAULT_FALLBACK_OVERLAP_PX (8) and fallback_bands is grouping.DEFAULT_FALLBACK_BANDS (4) carried forward unconverted, both retired here after being left behind by the first sweep; max_residual_components and max_secondary_proposals are new policy values, not converted constants -- each reasoned from operations/operator/review.py's own MAX_REVIEW_ITEMS = 50_000-item / 16 MiB console refusal (CONSOLE_TREE_UNREADABLE), which a single unbounded page can already trip, and each bounding one page's contribution to that queue rather than the run's total"
corpus = "none of these values comes from a measured parish-register corpus. The seven page_fraction_bp values are unmeasured walking-skeleton defaults tuned by eye against this project's own tiny synthetic fixtures, not derived from any register sample; gap_tolerance_px has no corpus behind it at all -- see caveat; fallback_bands is a four-band grid chosen by eye for a fixture page and matched against no register layout; max_residual_components and max_secondary_proposals are reasoned from the operator console's own documented item ceiling, not from any ink-density sample"
sample_unit = "page (the synthetic fixture pages under proof/fixtures/synthetic-two-page-v0, not a real register record or act)"
sample_count = 0
statistic = "none -- every field here is an unmeasured default or a policy ceiling reasoned from another module's documented limit, not a computed percentile or summary statistic over any sample"
calibrated_for_this_corpus = false
caveat = "gap_tolerance_px is the loudest number in this file and must never be expressed as a page-fraction basis point. It is a stroke-connectivity radius -- how many blank pixels two ink runs may have between them and still count as one connected mark -- not a page-layout proportion, and it must not scale with page size: Scaling it the way the six page_fraction_bp fields scale -- to ~41px on a 3508px-tall real page -- would change what 'connected' means, bridging inter-word gaps into merged lines rather than just closing letterform strokes. This caveat used to add that the labeller's cost was quadratic in this value; that was true of the retired per-pixel labeller (383s at gap 3 on a real page at 300-DPI-equivalent size) and is not true of the row-run implementation that replaced it on 2026-09-05, which measures 2.7s at gap 3 and 3.2s at gap 8 on the same page (workbench/active/TIMING_REPORT_2026-09-05.md, structure.label_components). Runtime is therefore no longer an argument about this number in either direction; the connectivity argument above is the whole of it. Its correct value is a function of scan resolution (DPI, stroke width in pixels), not of page dimension, and no measurement of that relationship exists in this project yet; it stays absolute at 3 by decision, not by oversight. Separately, fallback_bands and fallback_overlap_bp decide the crop rectangles that actually reach the Attestatores and the Perlector on a page the structure pass found nothing on, and they are the least measured values in this file: four bands is a guess against a 200x260 fixture, and a real register page may hold thirty entries. They are sealed here so a run can name what it cut rather than because the numbers are right. Separately, max_residual_components and max_secondary_proposals decide review granularity only -- it is reasoned from the operator console's item ceiling, never from a calibrated ink-density figure, and GOVERNANCE 10 forbids treating it as anything that constrains what conservation measures (see pipeline/2_designator/conservation.py's own module docstring). Every value in this file, gap_tolerance_px included, needs re-derivation against this project's own real corpus before calibrated_for_this_corpus may become true; padding_calibration.py's sibling harness for this file does not exist yet because no gold set does either."
