# Grouping and reconciliation thresholds: geometric policy for the
# Designator's structure/grouping/conservation pass, expressed as a fraction
# of the page's own dimensions wherever a fraction is the honest shape, and
# left absolute wherever it is not.
#
# `[grouping.page_fraction_bp]` holds thresholds that scale with the page:
# integer basis points (1/10000), never a float -- canonical artifacts carry
# integers, never floats (`common/contracts/canonical.py`), and
# `config/designator_padding.toml` already ruled this project's fractional
# policy values are basis points for exactly that reason. Resolve a field to
# pixels with `geometry._pad_amount(dimension, bp)` -- round-half-up, pure
# integer arithmetic -- never write a second rounding rule.
#
# Each field's basis is named below because it is NOT uniform: six fields
# are a fraction of the page's own HEIGHT and one (`margin_bp`) is a fraction
# of the page's own WIDTH. This basis is a design decision recorded in
# SPEC_C section 2, chosen from what each threshold is compared against in
# code -- vertical extents for the six height-based fields, the page-width
# margin lane for `margin_bp` -- not a property recovered from the retired
# pixel constants themselves: six of the seven were bare pixel counts with no
# dimension to measure against, and `review_priority_min_dimension_bp`'s own
# retired constant (`conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX`)
# is documented as applying on either axis, not against height specifically
# (see `conservation.py`). Resolving it against height here is this build's
# choice, not something the old code measured.
#
#   field                               | basis  | retired constant
#   ------------------------------------|--------|---------------------------
#   margin_bp                           | WIDTH  | grouping.DEFAULT_MARGIN_FRACTION (0.15)
#   chain_gap_bp                        | HEIGHT | grouping.DEFAULT_CHAIN_GAP_PX (6)
#   anchor_reach_bp                     | HEIGHT | grouping.DEFAULT_ANCHOR_REACH_PX (2)
#   brace_min_height_bp                 | HEIGHT | grouping.DEFAULT_BRACE_MIN_HEIGHT_PX (30)
#   page_edge_reach_bp                  | HEIGHT | grouping.DEFAULT_PAGE_EDGE_REACH_PX (4)
#   review_priority_min_dimension_bp    | HEIGHT | conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX (6)
#   fallback_overlap_bp                 | HEIGHT | grouping.DEFAULT_FALLBACK_OVERLAP_PX (8)
#
# `[grouping.absolute]` holds `gap_tolerance_px`, which stays a raw pixel
# count and must NEVER be converted to a page-fraction basis point -- see the
# provenance caveat below. It is the one field in this file this build cannot
# honestly set.
#
# `[grouping.background]` holds the policy the per-page background inference runs
# under, and it is the only block in this file measured against real material --
# so it carries a provenance block of its own, with
# `calibrated_for_this_corpus = true` and `sample_count = 127`, rather than
# sitting under the file-level provenance whose `sample_count` is 0. One block
# could not describe both truthfully.
#
# It was named for the surround from 2026-09-05 to 2026-09-06, over three values
# calibrated on seven pages. A 127-page survey broke two of the three, and the
# block is renamed because it stopped being only a surround test: `max_ink_bp`
# refuses a page that has no surround at all, and `ink_margin_bp` sets the ink
# threshold on every page whether or not one was ever looked for.
#
#   band_bp                the border band sampled by the interior-mode
#                          measurement, as a fraction of the page. The ONLY length
#                          in this file that resolves against BOTH dimensions --
#                          band_bp of the width on the left and right, band_bp of
#                          the height on top and bottom. It cannot live in
#                          page_fraction_bp, whose contract is one declared basis
#                          per field, and grouping_config resolves it in its own
#                          function.
#   max_interior_dark_bp   how little of the complementary interior may be dark
#                          for the page's dark population to enter the existing
#                          interior-mode branch. It does not identify a frame,
#                          bezel, or page boundary. The retired border-side bound
#                          refused 52 of 127 historical calibration pages and no
#                          control that this bound does not.
#   max_ink_bp             and, on every page whichever branch inferred it, how
#                          much of the page the inferred paper may leave at or
#                          below the ink threshold before that value stops being a
#                          background at all. A page over this bound is refused by
#                          name instead of publishing an ink fraction that
#                          reconciles exactly and means nothing
#   ink_margin_bp          how far below the inferred paper value that ink
#                          threshold sits, as a fraction of the distance between
#                          the page's OWN two grey-level population modes --
#                          floored at structure.PRIMARY_MARGIN. Not a bound: it
#                          refuses nothing and decides no outcome, it sets the
#                          level every ink count on the page is taken at. A fixed
#                          offset was wrong here because a photographed leaf's
#                          paper is a population dozens of levels wide and a fixed
#                          offset lands inside it; the distance between the page's
#                          two modes is the scale that offset was missing. Held
#                          strictly under 5000 by the loader, because at 5000 the
#                          threshold reaches the level the dark-distribution
#                          measurement uses and its two published dark counts stop
#                          being subsets of the ink they are fractions of
#
# The last three are fractions of a pixel *population*, or of the distance between
# two of them, not of a page, so they never resolve to pixels:
# max_interior_dark_bp of the interior band's own pixels, max_ink_bp of the whole
# page's, ink_margin_bp of two modes' separation in grey levels. band_bp and
# max_interior_dark_bp are read only where `infer_background` would otherwise have
# refused -- an ordinary scan whose modal pixel is its paper never reaches them --
# while max_ink_bp and ink_margin_bp are read on every page that gets a paper
# value at all. **The dark population measured by the interior-mode branch is
# never removed from the page** -- it stays below the ink threshold and is counted
# as ink by the structure scan and by conservation alike. The published
# `dark_distribution` records its sampled band/page counts without treating them
# as a bezel, a paper region, or a region to remove. See
# pipeline/2_designator/structure.py::_dark_distribution.
#
# Three bare integer counts live at the top of `[grouping]` (not basis points,
# not sub-table fields), because none of them is a length and none has a page
# dimension to be a fraction of:
#
#   max_residual_components   how many residual components one page's
#                             conservation record may enumerate before the page
#                             itself is held as one review item instead
#   max_secondary_proposals   how many secondary rescue candidates one page may
#                             cut and hold as separate review items before the
#                             page's secondary pass is held as one instead; the
#                             same ceiling as above, on the other enumeration
#                             this stage mints per page
#   fallback_bands            how many horizontal bands the predetermined
#                             fallback grid cuts a page into. A cardinality, not
#                             a length: a page twice as tall does not get twice
#                             as many bands, it gets bands twice as tall, and
#                             `fallback_overlap_bp` beside it is the part of that
#                             grid that *is* a length and does scale
#
# **Both ceilings bound one page, not the run.** `operations/operator/review.py`
# refuses a run whose exported review queue passes `MAX_REVIEW_ITEMS` (50,000)
# by name, and nothing counts that total while a run is being produced; a run of
# many pages each just inside these bounds still meets that refusal at the
# console. What these two values buy is that no *single* page can make a run
# unopenable on its own. See the provenance block and
# `pipeline/2_designator/HANDOFF.md` for the reasoning and the remainder.
#
# **Two constants deliberately do NOT live here and never will:**
# `structure.PRIMARY_MARGIN` (20) and `structure.SECONDARY_MARGIN` (2) are
# absolute 8-bit ink-intensity offsets, not page geometry -- scaling either by a
# page dimension is meaningless, and `common/test_designator_recensor_ink_calibration.py`
# is an AST pin that reads `SECONDARY_MARGIN` as a source literal in
# `structure.py` and cross-checks it against the Recensor's own contrast
# constant. Moving it into a per-run config value would make that
# cross-stage invariant unenforceable statically -- a sealed run could carry
# a margin the Recensor would then call ink what the Designator dismissed,
# which is the one direction of ink loss `conservation.py` names as unsafe.
# They stay Python module constants. This file's closed schema refuses a
# `primary_margin` or `secondary_margin` key wherever one is written, by name.
#
# `[grouping.background] ink_margin_bp` is not one of them and does not weaken
# that rule. It carries no grey level of its own: it is the fraction of the
# distance between a page's *own* two grey-level population modes that
# `structure._derived_ink_margin` deducts from the inferred paper value, floored
# at `PRIMARY_MARGIN`. The same sealed 3333 derives a margin of 46 on this
# repository's fixture page and 71 on a photographed register opening, because
# those pages have different contrast and not because anything here changed. The
# invariant the AST pin protects is between the Recensor's contrast constant and
# `SECONDARY_MARGIN`, and `SECONDARY_MARGIN` is not derived, so the pin still
# reads two literals and compares them.

[grouping]
max_residual_components = 2000
max_secondary_proposals = 2000
fallback_bands = 4

[grouping.page_fraction_bp]
margin_bp = 1500
chain_gap_bp = 231
anchor_reach_bp = 77
brace_min_height_bp = 1154
page_edge_reach_bp = 154
review_priority_min_dimension_bp = 231
fallback_overlap_bp = 308

[grouping.absolute]
gap_tolerance_px = 3

[grouping.background]
band_bp = 500
max_interior_dark_bp = 5000
max_ink_bp = 7000
ink_margin_bp = 3333

[grouping.background.provenance]
source = "measured on this Mac, 2026-09-06, over 127 real pages: 60 RecordGold pages (24 teklia_dai_cretdhi, 32 recordgold_production_train_v1, 4 recordgold_evaluation_val_v1), 60 parish master pages (15 each from Embrun, Oka, Montebello and the Histoire de Saint-Jacques book), and the seven review proxies under private/triage/measured/2026-08-22_005469606_62-68 as a control, sampled by the fixed seed designator-survey-2026-09-06. The per-page 256-bin histograms and the border/interior histograms at band widths 250, 500 and 1000 bp were dumped once and every candidate rule scored offline against them; those dumps reproduce the 127-page survey's own mode, mean, border and interior figures on all 127 pages at all three band widths, which is what ties these numbers to that survey's material. Four SYNTHETIC control pages, built the way pipeline/2_designator/test_structure.py builds them, were scored beside them and are marked SYNTHETIC wherever their numbers are quoted. The calibration tables are in pipeline/2_designator/HANDOFF.md under 'The background inference, calibrated on 127 pages'"
corpus = "127 real photographed and scanned pages, 1.2 to 27.7 megapixels, from four parish registers and one expert OCR corpus, in three capture conditions -- photographed register openings with a black surround, flatbed-style scans, and a printed book. It is the first sample this project has taken that is not one capture session, and it is still not the corpus the pipeline will run on: no page here passed through pipeline/1_exemplar, 54 of the 127 carry no DPI tag, and the three RecordGold sets overlap heavily (575 of 688 teklia filenames also appear in recordgold_production_train_v1), so the 60 RecordGold pages are 60 draws from one corpus and not from three"
sample_unit = "page"
sample_count = 127
statistic = "for max_interior_dark_bp: the fraction of the interior band at or below the level midway between the page's dark-population mode and its light-population mode, in floor-divided basis points, over the 72 of 127 pages that reach the interior-mode branch -- minimum, median and maximum, no percentile, because the bound is placed in a measured gap and not at a quantile. For max_ink_bp: the fraction of the whole page at or below background minus PRIMARY_MARGIN under the inferred paper value, in the same basis points, over all 127. For band_bp: both of those recomputed at 250, 500 and 1000 bp. For ink_margin_bp: the fraction of the page that is left at or below the ink threshold the value derives, measured twice -- over the whole page and over the DARK-EXCLUDED DISTRIBUTION, a derived statistic that subtracts the page-wide sampled dark population from both ink and page counts and is not a paper-region measurement without independent ground truth -- over the 127, as minimum, quartiles, median and maximum, because that statistic is a distribution to be judged plausible rather than a bound to be placed"
calibrated_for_this_corpus = true
caveat = "These four numbers were measured on 127 real pages from five sources, which is what the flag says and the whole of it. WHAT THE SAMPLE ESTABLISHES. max_interior_dark_bp = 5000 sits in a measured gap: the 72 real pages that reach the interior-mode branch run 287 to 3452 bp, the nearest refusing SYNTHETIC control (a dark core inside a light border) measures 6647 and the inverted-scan SYNTHETIC control 8333, so the valley is 3195 bp wide and 5000 is 49 bp below its midpoint. It refuses no real page in the sample; it is the bound that catches both refusing controls, and the border-darkness bound that used to sit beside it (min_border_dark_bp = 7000, calibrated on seven pages) is gone because it refused 52 of these 127 while refusing no control this one does not. max_ink_bp = 7000 is NOT in a valley: the whole-page ink figure is a continuum from 281 to 8502 bp with no gap wider than 505 anywhere in it. It is a policy bound, placed in the widest gap near the top of that distribution (6595 to 7077, 482 bp wide) and 77 bp nearer the refusing side, because the failure it exists to stop is invisible -- 6 of these 127 pages inferred a paper value of 255 through the plain modal branch, counted 71 to 85 percent of the page as ink, and reconciled exactly with nothing in the record marking them. It refuses 13 of the 127, three of which are review proxies whose ink fractions at PRIMARY_MARGIN are as unreadable as the six. band_bp = 500 is now nearly inert: at the two bounds above, 250, 500 and 1000 bp give an identical accept-or-refuse outcome and an identical paper value on every one of the 127. 500 is kept because at 1000 the band is 20 percent of each dimension and 36 percent of the page's area and has stopped being a frame: it averages bezel against paper, and the real pages' border figure collapses from a median of 8166 to 5025. The valley is NOT the reason -- 1000 has the widest of the three (5527 bp against 3195 at 500 and 2067 at 250), and an earlier draft of this caveat claimed the opposite. Against 250 the valley does decide: its dark-core SYNTHETIC control measures 5990, so a 6000 bound would already admit it, where at 500 the same control is at 6647. SCALE INVARIANCE IS MEASURED, NOT ASSUMED: over the 73 pages carrying a DPI tag, resampling to a 300-DPI equivalent with LANCZOS leaves the outcome unchanged on 72 and moves the inferred paper value by at most 2 grey levels on the 67 pairs that infer both ways; the one page whose outcome changes is refused natively by max_ink_bp. The seven-page calibration this replaces argued scale invariance from the fact that its three values were population fractions, and that argument was wrong -- the fractions were scale-invariant and the LEVEL they were measured at, the page's own modal pixel, was not. WHAT THE SAMPLE DOES NOT ESTABLISH. The admitted dark-distribution counts do not establish a bezel, page boundary, paper region, or excluded writing on any individual page: the current interior bound also admits a spatially uniform 40-percent dark population. The counts remain retained as measured populations and no pixel is removed from scanning or reconciliation. It contains no page photographed against a light surface; that shape was measured on a SYNTHETIC page instead, and the answer is that a light surround at 230 or above is refused by max_ink_bp by name, while a light surround within about 15 grey levels of the paper is inferred AS the paper and is caught by nothing here. It establishes nothing about a frame holding two leaves lit differently, and the one real example it does contain -- a review proxy, overlay changed4_proxy_da9e07ec.png in the session's Designator report -- shows a limit nothing in this file closes: one paper value is inferred for the whole frame, so the darker leaf sits below the ink threshold that value implies and is counted as ink edge to edge while the lighter leaf reads correctly. Nothing detects it, no bound here refuses it, and the page's own ink fraction is the only place it shows. A per-region background is the repair and it is a different unit. It contains no flatbed scan with a dark platen lid distinct from the photographed shape, no page whose frame is dark on only two sides (a SYNTHETIC one takes the plain modal branch and infers its paper correctly), and no page admitted through pipeline/1_exemplar. Re-derive against a real run's own sealed pages before trusting any of it further. Finally, this test never removes a pixel from the structure scan or from conservation -- the sampled dark population stays in the page and is counted as ink -- so a misjudgement changes which value is reported as paper and remains visible in the page's ink fraction and `dark_distribution`; it is never a silent loss. That block records sampled populations rather than a page boundary. INK_MARGIN_BP = 3333 IS A DIFFERENT KIND OF FIELD FROM THE THREE ABOVE: it is not a bound and it refuses nothing. It is the fraction of the distance between a page's own dark-population mode and its light-population mode that structure._derived_ink_margin deducts from the inferred paper value to get the threshold that page's ink is counted at, floored at structure.PRIMARY_MARGIN. It replaces a fixed offset of 20 grey levels, which on photographed paper landed inside the paper population rather than below it: over these 127 pages the fixed offset left a median of 39.5 percent of the whole page and 23.3 percent of the DARK-EXCLUDED DISTRIBUTION -- a derived statistic that subtracts the sampled page-wide dark population from both numerator and denominator; it is not a paper-region measurement without independent ground truth -- at or below the ink threshold, and a written register page is a few percent ink, not a quarter. At 3333 the same 127 pages measure a dark-excluded ink fraction of 0.45 to 9.62 percent, median 3.69, which is a descriptive distribution, not a ground-truth writing fraction. THE VALUE IS CHOSEN AND NOT DERIVED FROM A VALLEY, because there is no valley to derive it from: on every photographed page in this sample the histogram has exactly two peaks, the bezel and the paper, and the writing is a few percent of the pixels smeared under the paper peak's own left skirt with no density minimum anywhere between them. The minimum-density level between the two modes sits just above the bezel, around grey level 55 to 75, which is a page-boundary threshold and not an ink one. What decided 3333 among its neighbours: over the survey's own ten photographed pages driven live through the shipped pass, the dark-excluded ink fraction runs 4.1 to 13.6 percent at 2500, 2.9 to 9.0 at 3000, 2.2 to 6.8 at 3333, 1.6 to 4.2 at 3750 and 1.2 to 3.1 at 4000, so 2500 leaves the densest page in the sample reading as a seventh ink and 4000 leaves it reading as sparse; and the component count at the sealed gap of 3 has its median over those ten pages at 2721 / 2557 / 2653 / 2982 / 3197 across the same five values, flat through 3000 to 3333 and rising past it, which is fragmentation beginning. 3000 and 3333 are not separated by either measurement and that is said here rather than hidden; 3333 is chosen for the historical dark-excluded comparison and for being one third. THE BOUND THIS FIELD IS HELD UNDER IS STRUCTURAL: the loader refuses any value at or past 5000, because _dark_distribution measures at the midpoint of the two modes and publishes its two dark counts as fractions of the ink the page goes on to count, and that reading is true exactly while the derived threshold stays at or above that midpoint. SCALE INVARIANCE IS MEASURED HERE TOO: over the same 73 DPI-tagged pages resampled to a 300-DPI equivalent, the derived margin moves by at most 8 grey levels (median 0) and the dark-excluded ink fraction by at most 0.51 percentage points. WHAT THIS FIELD DOES NOT CHANGE: max_ink_bp is still probed at PRIMARY_MARGIN and not at the derived threshold, deliberately -- asked at the derived threshold it stops working, because the derivation reads the same wrong paper value the bound is watching for and slides the threshold down with it, and the six silent paper-255 pages then measure 2239 to 3498 basis points against a median of 2434 over the other 121. structure.SECONDARY_MARGIN and conservation.reconcile's margin are NOT derived and stay at 2, so this stage's own ink accounting still errs sensitive: on these 127 pages conservation counts 27.8 to 92.3 percent of a page as ink (median 69.9) against the primary scan's 2.8 to 47.3 (median 24.2), and that asymmetry is deliberate -- a mark the grouping pass missed must appear as a residual rather than as an absence. No fixture page's cut moves for any of this: a synthetic page's paper and ink are 140 grey levels apart, so the floor and the derived margin select the identical pixel set on all three walking-skeleton pages, measured rather than argued."

[grouping.provenance]
source = "every page_fraction_bp value is a basis-point conversion of the retired module-level Python default it replaces (grouping.DEFAULT_MARGIN_FRACTION, grouping.DEFAULT_CHAIN_GAP_PX, grouping.DEFAULT_ANCHOR_REACH_PX, grouping.DEFAULT_BRACE_MIN_HEIGHT_PX, grouping.DEFAULT_PAGE_EDGE_REACH_PX, conservation.DEFAULT_REVIEW_PRIORITY_MIN_DIMENSION_PX), computed against this project's own synthetic fixture pages (proof/fixtures/synthetic-two-page-v0, measured 200x260) with geometry._pad_amount round-half-up so every field resolves bit-identically to the retired constant at that size; gap_tolerance_px is carried forward unconverted from structure.DEFAULT_GAP_TOLERANCE_PX (3); fallback_overlap_bp is a basis-point conversion of grouping.DEFAULT_FALLBACK_OVERLAP_PX (8) and fallback_bands is grouping.DEFAULT_FALLBACK_BANDS (4) carried forward unconverted, both retired here after being left behind by the first sweep; max_residual_components and max_secondary_proposals are new policy values, not converted constants -- each reasoned from operations/operator/review.py's own MAX_REVIEW_ITEMS = 50_000-item / 16 MiB console refusal (CONSOLE_TREE_UNREADABLE), which a single unbounded page can already trip, and each bounding one page's contribution to that queue rather than the run's total"
corpus = "none of these values comes from a measured parish-register corpus. The seven page_fraction_bp values are unmeasured walking-skeleton defaults tuned by eye against this project's own tiny synthetic fixtures, not derived from any register sample; gap_tolerance_px has no corpus behind it at all -- see caveat; fallback_bands is a four-band grid chosen by eye for a fixture page and matched against no register layout; max_residual_components and max_secondary_proposals are reasoned from the operator console's own documented item ceiling, not from any ink-density sample"
sample_unit = "page (the synthetic fixture pages under proof/fixtures/synthetic-two-page-v0, not a real register record or act)"
sample_count = 0
statistic = "none -- every field here is an unmeasured default or a policy ceiling reasoned from another module's documented limit, not a computed percentile or summary statistic over any sample"
calibrated_for_this_corpus = false
caveat = "gap_tolerance_px is the loudest number in this file and must never be expressed as a page-fraction basis point. It is a stroke-connectivity radius -- how many blank pixels two ink runs may have between them and still count as one connected mark -- not a page-layout proportion, and it must not scale with page size: Scaling it the way the six page_fraction_bp fields scale -- to ~41px on a 3508px-tall real page -- would change what 'connected' means, bridging inter-word gaps into merged lines rather than just closing letterform strokes. This caveat used to add that the labeller's cost was quadratic in this value; that was true of the retired per-pixel labeller (383s at gap 3 on a real page at 300-DPI-equivalent size) and is not true of the row-run implementation that replaced it on 2026-09-05, which measures 2.7s at gap 3 and 3.2s at gap 8 on the same page (workbench/active/TIMING_REPORT_2026-09-05.md, structure.label_components). Runtime is therefore no longer an argument about this number in either direction; the connectivity argument above is the whole of it. Its correct value is a function of scan resolution (DPI, stroke width in pixels), not of page dimension, and no measurement of that relationship exists in this project yet; it stays absolute at 3 by decision, not by oversight. Separately, fallback_bands and fallback_overlap_bp decide the crop rectangles that actually reach the Attestatores and the Perlector on a page the structure pass found nothing on, and they are the least measured values in this file: four bands is a guess against a 200x260 fixture, and a real register page may hold thirty entries. They are sealed here so a run can name what it cut rather than because the numbers are right. Separately, max_residual_components and max_secondary_proposals decide review granularity only -- it is reasoned from the operator console's item ceiling, never from a calibrated ink-density figure, and GOVERNANCE 10 forbids treating it as anything that constrains what conservation measures (see pipeline/2_designator/conservation.py's own module docstring). Every value in this file, gap_tolerance_px included, needs re-derivation against this project's own real corpus before calibrated_for_this_corpus may become true; padding_calibration.py's sibling harness for this file does not exist yet because no gold set does either."
