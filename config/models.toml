# The only place a model is BOUND TO A CHAIR (spec 02, master plan §2). It is not
# the only place a model is named: `common/chairs/model_store.py` names the same
# repositories and revisions again, as the materialization inventory an operator
# fetches against, and `test_model_store.py` reconciles the two lists so they
# cannot drift. Binding is what lives here — which chair resolves to which
# artifact — and nothing else may do it. Nothing in `common/chairs/` may rank,
# prefer, select, substitute or fall back among chairs, revisions, recipes or
# caches: resolution is by name, and the only outcomes are the named artifact or
# a refusal (GOVERNANCE 3, read as ops rather than models).
#
# Roles are configuration keys, not concepts — `designator_structure`,
# `attestator_1..n`, `perlector`, `secondary_proposer`, `annotator`. A role added
# later resolves without a schema change; nothing in `common/chairs/` hard-codes
# this list.
#
# The live roster below is the offline walking skeleton's. Every configured entry
# is a local fixture snapshot: a few deterministic bytes standing in for a model
# repository, exactly as `proof/fixtures/synthetic-two-page-v0/*.png` stand in for
# a scanned register. No model weights are vendored and nothing is downloaded.
# `proof/build_model_fixtures.py` regenerates them and prints these pins.
#
# The real roster is at the bottom, commented out. Its MEMBERSHIP is settled —
# Tyrel ruled it on 2026-08-20 — but a roster cannot be uncommented until each
# chair has a verified manifest and a serving-recipe row at every tier, which a
# build that fetched nothing cannot produce. It does not participate in
# resolution, ranking, fallback, or the fixture run.

# `path` and `manifest` are relative to this file's directory, and `..`,
# absolute paths and symlink escapes are all refused. Off-pod the model root is
# still an open question — spec 02's "Not owned here" flags it, and this file
# does not settle it.
#
# `serving_recipe` below is a vLLM profile-family key, not an executable command
# or a model choice. `config/serving_recipes.toml` must resolve it together with
# this exact chair and the measured single-resident GPU tier; no nearest-tier or
# alternate-chair fallback exists.
model_root = "model-fixtures"

# The minimum count of completed-class witness outcomes an act needs before it is
# recorded `under_witnessed` (`common/contracts/outcomes.py::witness_coverage`).
# Page-witness attachments count only once their declared act span is present;
# a page-granularity-only report never lowers this act-level floor.
# A chair configured `state = "absent"` stays in the roster as an explicit absence
# and counts against this floor: it is one fewer configured witness, and the floor
# does not shrink to match.
witness_floor = 3

