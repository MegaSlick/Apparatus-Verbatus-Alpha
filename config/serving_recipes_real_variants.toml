seed = 0
required_packages = { vllm = "0.30.0", transformers = "5.14.1", "qwen-vl-utils" = "0.0.14" }
quantization = "fp8"
speculative_config = { method = "mtp", num_speculative_tokens = 3 }
max_model_len = 65536
max_num_seqs = 4
weights_gib = "28.8"
kv_gib_per_seq = "4.25"  # 17 full-attention layers: the 16 of the model and the MTP head's
max_num_batched_tokens = 8192
gpu_memory_utilization = "0.88"
min_pixels = 65536
max_pixels = 5299200
patch_size = 16
merge_size = 2
enable_prefix_caching = false  # hybrid attention, as the bf16 row
enforce_eager = false
trust_remote_code = false
generation_config = "vllm"
preflight_state = "unproven"
startup_timeout_seconds = 900  # UNMEASURED: the drafter adds its own load and graph capture
poll_interval_seconds = 2
request_timeout_seconds = 1800  # UNMEASURED planning value, as the bf16 row
readiness_probe = { kind = "chat-completions", request_json = "{\"messages\":[{\"role\":\"user\",\"content\":\"READY\"}],\"max_tokens\":4}" }

