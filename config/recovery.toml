# How many times rework may be asked for before review.
#
# Tyrel's ruling, quoted so a later reader does not have to go looking:
# "PURE ABSOLUTE, STOP AT 3". The absolute cap below is that ruling; it is not a
# suggestion a stage may argue with, and nothing in the pipeline may raise it at
# run time.
#
# QUEUED FOR TYREL, not decided here: the master plan's ledger records that both
# mechanisms exist -- a run-level cap and this per-act recovery budget -- and that
# he confirms which his ruling governed, or blesses both. If the ruling was meant
# to bind the run level instead, this file is where that changes.
#
# The skeleton's own request gate (`pipeline/5_recensor/run.py`'s `wants_recovery`)
# grants an act at most one recovery-request in its whole lifetime regardless of
# the value below, so with the shipped budget of 2 the "held, budget is spent"
# branch is structurally unreachable -- an act never gets far enough into its
# budget to spend it. That branch is genuinely correct (a regression test drives
# it directly with a zero budget and confirms so), but this file's own number is
# not what proves it, and raising fallback_recrop/page_level_reread alone will
# not make a second recovery round actually happen until that gate changes too.
#
# Recovery recovers COVERAGE, never quality (GOVERNANCE 11). A suspected
# fabrication or a poor reading may be flagged for review; it may never be
# re-rolled until it looks better. Nothing disappears inside a loop: every
# request and every outcome is an artifact.

# The ceiling no configuration below may exceed, and no stage may raise.
absolute_cap = 3

[budget]
# Per act, per run. The starting proposal from ARCHITECTURE is one fallback
# recrop and one page-level reread; the real budget is established through alpha
# testing, which has not happened yet. The walking skeleton needs exactly one
# recrop to prove the loop, so that is what it is allowed.
fallback_recrop = 1
page_level_reread = 1
