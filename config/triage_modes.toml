# The review thresholds of the three triage modes. The mode names themselves are
# `common.contracts.stages.TRIAGE_MODES`; this file must name exactly those.
#
# Thresholds are closed ordinals (0 = lowest, 4 = highest). All modes currently
# route every frame for review: no threshold has been calibrated on a real sample.
[manual]
review_at_or_below_confidence = 4

[semi]
review_at_or_below_confidence = 4

[auto]
review_at_or_below_confidence = 4
