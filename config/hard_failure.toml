# The run-level hard-failure cap. Distinct from `recovery.toml`'s per-page
# re-ask budget: that file bounds how often ONE page may be asked again; this
# one bounds how many accounted hard failures ONE RUN may carry before it needs
# the project lead rather than another automatic stage invocation.
#
# `threshold` is the count a run may reach without halting; the cap trips at
# threshold + 1. One hard failure is a fluke and two an early warning; the third
# stops the run at the next stage boundary. The stage already in flight
# finishes, and nothing running is torn down mid-stage.
threshold = 2

# The closed list of what counts as a hard failure. A hard failure is a corrupt
# or unrenderable image, or a page so damaged it must be run again: a signal that
# the run itself is going wrong. A blank page is not one, and neither is a hard
# page that a bounded retry or review already handles, so ordinary document
# variance never trips the cap.
#
# `(perlector, failed)`: a page whose engine call failed (transport failure,
# endpoint unavailable, an engine refusal or an unrecognised stop), published as
# a `page-reading` with outcome `failed` and parse state `call-failed`, its page
# held as `page-unread`. A failed re-ask call is also a `failed` `page-reading`
# and counts, since a failing engine is the same trouble on either call; its page
# stands on its first reading, held as `reask-unread`. A truncated reading does
# not count: the entry is held, never delivered, but a long entry truncating is
# ordinary in parish registers, not a broken run. A capacity refusal does not
# count either: it is a page too large for the sealed row.
#
# `(door, refused)` with reason `corrupt` or `unreadable`: real bytes that fail
# structural decode, or a PDF or TIFF page that fails to render, refused page by
# page in `pipeline/1_exemplar/door.py`. The Door's other refusal reasons do not
# count: `empty` and `too-large` are policy bounds, `unrecognized-format` is a
# file that should never have been submitted, `unsupported-variant` is a decoder
# gap, and `digest-mismatch` is a copy whose bytes changed after their digest
# was declared: the submission is sent again, not the page run again.
#
# `(exemplar, refused)` does not count: the Exemplar refuses a page only by
# passing on the Door's refusal of it, so counting it would count that page twice.
#
# `(recensor, held-for-review)` does not count: holding for a person is the
# system working. Witness outcomes do not count either: no witness outcome ends
# an act on its own, a coverage shortfall already marks the run `partial`, and
# one dead chair is a different question from a broken reading pipeline.
#
# `(designator, failed)` and `(archetypus, refused)` are failure members of
# their stages' closed outcome vocabularies that no stage emits yet; they are
# listed so the cap counts them the day a stage does.

[[kind]]
stage = "perlector"
outcome = "failed"

[[kind]]
stage = "door"
outcome = "refused"
reason = "corrupt"

[[kind]]
stage = "door"
outcome = "refused"
reason = "unreadable"

[[kind]]
stage = "designator"
outcome = "failed"

[[kind]]
stage = "recensor"
outcome = "failed"

[[kind]]
stage = "archetypus"
outcome = "refused"
