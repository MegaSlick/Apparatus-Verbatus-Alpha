# Whole-page PDF rasterisation target for the next run.
#
# A run may override this with --pdf-target-dpi. The door records both this chosen
# target and the bounded target it can safely use. Pixel, decoded-byte, and 72-DPI
# floor limits remain code-owned and cannot be weakened here.
#
# 300 rather than the 400 this shipped with, chosen after measuring the corpus
# material rather than reasoning from a standard:
#
#   - Hudson's Bay Company account books, rendered and measured at several targets,
#     put written line pitch near 52 px at 150 DPI. That is roughly a 21 px
#     x-height, and the OCR literature places the useful band at 25-30 px with
#     accuracy collapsing below about 10. 300 clears the band for the tighter hands
#     in the corpus; 150 does not.
#   - The reading models resize before they read — the strongest cap the long edge
#     at 2,576 px. A detector-record crop taken full width from a letter-sized page
#     at 300 DPI is 2,550 px, landing just under that and surviving whole, and the
#     Perlector's whole-page render is capped at 2,560 px ([page_context]
#     maximum_edge). At 400 DPI the same crop is 3,400 px and is resized back down,
#     so it arrives barely larger than at 300 while costing (400/300)^2 = 1.78x the
#     pixels to render, store and keep until export. Rendering at 400 therefore
#     pays for about 78% more raster and reads almost none of it.
#
# **Still not proven, and adjustable for exactly that reason.** This is measured
# against page geometry, not against reading accuracy: nothing here has read a real
# act yet. It must hold on a small approved real sample before scale, and if a
# hand turns out to need more, this is one number in one file.

[pdf]
target_dpi = 300
