# The Perlector's dissent comparison budget. Its value is sealed at run creation
# and rechecked at the point of use. It is an operational bound, never a
# similarity threshold.
#
# The matcher's work, in steps: one character scanned or one position visited by
# `find_longest_match`. Counted, not timed, so the same comparison under the same
# budget finishes the same way on every machine. One entry's reading is compared
# against the units of one witness it cites; sized to clear act-length text with
# room to spare, a formula act and a noisy or unrelated witness included. A
# degenerate report stops here. A comparison that would pass it is recorded as
# not measured, never guessed.
[dissent]
max_comparison_steps = 100000000
