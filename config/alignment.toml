# R4 alignment limits. Its values are sealed at run creation and rechecked at
# the point of use. Values are operational bounds, never similarity thresholds.
[limits]
max_characters = 100000
max_character_pairs = 100000000
# The matcher's work, in steps: one witness character scanned or one anchor
# position visited by `find_longest_match`. Counted, not timed, so the same
# page under the same limits aligns the same way on every machine. Sized from
# the legitimate ceiling: an unaligned page witness is not comparable, so it
# leaves the act's witness floor. Synthetic register pages of 2,000 to 8,000
# characters, witnesses at 2% to 30% character error, reordered, half read or
# unrelated, took 0.4 to 27.2 million steps. A 7,500-character page whose acts
# repeat one formula verbatim -- what a scribe copying one form produces --
# takes 76.8 million, and clears. Degenerate pairs the pair bound admits stop
# here: two 10,000-character random two-letter responses reach the budget in
# about 8.5 s on a laptop, a single repeated letter at once.
max_alignment_steps = 100000000
