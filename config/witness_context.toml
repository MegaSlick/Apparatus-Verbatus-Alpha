# Factual context about each witness: its training domain stated as fact, with
# no trust weight, no ranking, no preferred order, and no field that may express
# which witness is better (spec_08). Deliberately separate from
# config/models.toml and common/chairs/ChairIdentity, which carry identity,
# revision and licence on every reading's provenance.
#
# The run seals this declaration and checks it against the roster
# (`common/witness_context.py`): every configured witness chair must have an
# entry, and a known shipped sentence must sit beside its shipped identity. The
# page path does not show these sentences to the Perlector; its feed names each
# witness by its regime's label only.
#
# These entries describe the local fixture snapshots selected by
# `config/models.toml`. Real vendor facts belong in
# `config/witness_context-real.toml`, selected with `models-real.toml`; a
# real roster paired with this declaration is refused before a run starts.

# fixture attestator_1.
[attestator_1]
training_domain = "a synthetic fixture witness; no real training domain applies"

# fixture attestator_2.
[attestator_2]
training_domain = "a synthetic fixture witness; no real training domain applies"

# fixture attestator_3.
[attestator_3]
training_domain = "a synthetic fixture witness; no real training domain applies"
