# Settings of the grey tone view. Every value is a starting guess, none has
# been calibrated on real pages, so each carries status = "UNMEASURED" and the record
# says settings_measured = false until every one is measured and changed to "MEASURED".

[grey_rule]
value = "luminance"
status = "UNMEASURED"
meaning = "How a colour source becomes grey: luminance (the default), min (the darkest of the three channels), or the red, green or blue channel alone. A grey source is used as it is. min and blue separate brown iron-gall ink from yellowed paper better than luminance, but make faint blue-black ink on yellow paper lighter than the paper; measure per collection before changing the default."

[paper_level]
value = 235
status = "UNMEASURED"
meaning = "Grey level the flattened paper is brought to: just below white, never 255."

[work_long_side_px]
value = 750
status = "UNMEASURED"
meaning = "Long side, in pixels, of the reduced copy on which the paper background is estimated."

[reference_dpi]
value = 300
status = "UNMEASURED"
meaning = "The dpi at which the window settings below are given in pixels; a page with known dpi has them scaled by dpi / reference_dpi, a page without dpi uses them as they are."

[background_window_px]
value = 81
status = "UNMEASURED"
meaning = "Side, in pixels at reference_dpi, of the square closing window that removes strokes from the background estimate; much larger than any stroke, smaller than the lighting's changes. Half of it is also how far bright paper can leak into a dark stain at a sharp edge."

[floor_window_px]
value = 405
status = "UNMEASURED"
meaning = "Side, in pixels at reference_dpi, of the much wider closing whose level times floor_share the background estimate never goes below, so a seal or blot wider than background_window_px but narrower than this keeps its darkness."

[floor_share]
value = 0.8
status = "UNMEASURED"
meaning = "Share of the wide closing (floor_window_px) below which the background estimate is never taken; 0 turns this floor off."

[min_background_share]
value = 0.5
status = "UNMEASURED"
meaning = "The background estimate is never taken darker than this share of the page's paper level, whatever the wide closing says, so a dark area wider than floor_window_px (a scanner backdrop) is not lifted to paper."

[min_paper_share]
value = 0.25
status = "UNMEASURED"
meaning = "Share of the reduced page that must be paper (above the ink threshold) for the background estimate to be trusted; below it flattening is skipped and the record says so."

[min_ink_contrast]
value = 48
status = "UNMEASURED"
meaning = "Grey levels between the dark and light classes below which the page is treated as carrying no ink, so every pixel counts as paper."

[lift_strength]
value = 0.2
status = "UNMEASURED"
meaning = "Strength of the faint-ink lift, 0 (no lift) to 0.4; the tone curve's slope at the paper level is 1 + strength * lift_shape, and at black 1 - strength."

[lift_shape]
value = 3
status = "UNMEASURED"
meaning = "Shape of the lift curve, 1 to 8: higher puts the darkening nearer the paper level and leaves dark ink more alone."

[sharpen]
value = 0
status = "UNMEASURED"
meaning = "1 applies a mild unsharp mask after the lift; 0 (the default) does not."

[sharpen_radius_px]
value = 1.0
status = "UNMEASURED"
meaning = "Radius of the unsharp mask in pixels; must stay below the stroke width."

[sharpen_percent]
value = 30
status = "UNMEASURED"
meaning = "Amount of the unsharp mask in percent; small."
