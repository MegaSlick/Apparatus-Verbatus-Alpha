# For pagekit's own repository once it splits out. The parent project neither reads
# nor installs this file; pagekit runs there as a top-level folder.
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagekit"
dynamic = ["version"]
description = "Page preparation for scanned masters: turn, split, level, crop, and a review sheet."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.3"]

[project.scripts]
pagekit = "pagekit.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pagekit.__version__" }

[tool.setuptools.package-data]
pagekit = [
  "thresholds.toml",
  "thresholds_prepare.toml",
  "thresholds_skew.toml",
  "thresholds_split.toml",
  "thresholds_tone.toml",
]
