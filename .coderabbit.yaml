language: en-GB

# Capped at 250 characters by the schema, so what this project *is* lives in the
# repository-wide path instruction below rather than here.
tone_instructions: >-
  Read by the project lead, who does not write code, on work that is entirely AI-generated. Name
  the concrete failure a defect causes, not the category it belongs to. A finding that
  cannot say what breaks is not a finding.

reviews:
  # Default is `chill`. This repository wants everything and filters afterwards.
  profile: assertive

  # `request_changes_workflow: false` — CodeRabbit must never be able to block a merge.
  # Merging is decided by the rules in AGENTS.md, never here.
  request_changes_workflow: false

  high_level_summary: true
  # Keep the generated overview in the walkthrough rather than rewriting the PR body.
  high_level_summary_in_walkthrough: true
  review_details: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    # This counts reviewed commits, not review runs. After two reviewed commits CodeRabbit
    # pauses; a later material commit needs a manual incremental request and HEAD coverage check.
    auto_pause_after_reviewed_commits: 2

  pre_merge_checks:
    # Every mode stays `warning`. `error` requires resolution before merging, and a
    # check that can hold his merge button is enforcement he cannot undo.
    title:
      mode: warning
    description:
      mode: warning
    # Quoted, because a YAML 1.1 parser resolves bare `off` to the boolean `false`
    # and this field wants the string. The CLI validator accepts either; PyYAML and
    # the yamllint enabled below do not. Found by CodeRabbit on PR 23.
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: Carried code is named as carried
        mode: warning
        instructions: >-
          PRINCIPLES.md principle 12: code adapted from elsewhere is named as adapted in
          the commit message, and third-party code records its source and licence.
          Adapted, renamed and reformatted count as copied.
          When available evidence identifies carried code, check its source and attribution
          against the commit and report. Name that evidence; resemblance or AI authorship
          alone does not prove copying. If provenance cannot be established, report the
          limitation rather than inventing a source or claiming the carry was verified.
      - name: No witness picker
        mode: warning
        instructions: >-
          PRINCIPLES.md principle 1 forbids anything that selects among
          witnesses — under any name: choosing, ranking to pick, voting, best-of,
          confidence-thresholding down to one, or discarding a witness as bad. Witnesses
          are clues, never options; the Perlector reads and never picks. No witness is
          ever thrown away, however corrupt, absent or confidently wrong. Flag any code
          that reduces a set of witnesses to a chosen one, and say which rule it meets.
      - name: Nothing is lost silently
        mode: warning
        instructions: >-
          PRINCIPLES.md principle 2. Flag changes that reduce a declared
          collection without reconciling the source, retained, and published identities or
          counts; substitute an ordinary value for required missing or unverified evidence;
          swallow a write failure; or publish complete/success after a required record
          disappears. Trace the changed producer or consumer through a supported path and
          check whether a regression independently establishes the missing member and proves
          it is retained, held, or refused before publication. Treat explicitly typed null
          according to its contract. State any uncertainty or unavailable evidence rather
          than claiming a hypothetical bypass was demonstrated.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    # Off by default; this repository wants the simplification pass offered.
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true

  path_instructions:
    - path: "**"
      instructions: >-
        What this project reads, because it decides how expensive a defect is. The
        material is Quebec parish registers and fur-trade-era records from public sources
        such as FamilySearch and public archives. The corpus is deliberately
        heterogeneous — handwriting across centuries, typed transcriptions and printed
        books together — and that is on purpose, not an oversight to be cleaned up. Runs
        cover whole parishes, approaching the population of a small town, and the
        established readings feed kinship reconstruction across generations. So a fault
        that drops, skips or silently substitutes one act is not a small bug: it removes
        a person from a family, and nothing downstream can tell that it happened. Weigh
        anything that loses, reorders or quietly defaults a record accordingly. Several
        vision models report on each act as witnesses; a trained reader establishes the
        text. Witnesses are clues, never options — code that picks among them is a
        defect however well it scores. Report every finding with a concrete trigger, impact,
        evidence, and any uncertainty, including low-severity findings. Label an improvement
        that is not required for correctness as optional; session disposition filters findings,
        rather than suppressing them.
    - path: "operations/pod/**"
      instructions: >-
        This is the money path: it creates, adopts, guards and shuts down GPU pods that
        bill by the hour, and a fault here costs real money or loses a run. Hold it to a
        higher bar than the rest of the tree. A failure must be reported as the thing it
        actually is — a durable-store fault must not surface as an arming fault, and a
        request fault must not surface as a lease fault. Unbounded waits on a billing pod
        are defects. `assert` on this path is acceptable only where the invariant is
        already enforced by a `raise` that survives `python -O`, and the comment beside it
        must name that `raise`.
    - path: ".githooks/**"
      instructions: >-
        The git hooks and the check scripts CI runs. Flag any check that fails open: a
        check that cannot run is a failure, not a pass (PRINCIPLES.md principle 8). The
        hooks stay removable with `git config --unset core.hooksPath`.
    - path: ".claude/**"
      instructions: >-
        Claude Code settings, read-only agent roles and session skills. Changes need the
        project lead's approval (AGENTS.md). Flag drift: a skill or role that contradicts
        AGENTS.md, or names a file or section that no longer exists.
    - path: "**/*.py"
      instructions: >-
        This repository selects only Ruff rules `E4, E7, E9, F, I, B` in `pyproject.toml`.
        Do not raise `S`, `RUF` or other unselected rules as findings, and do not propose
        `# noqa` for a rule that is not run here. Test drivers passing a fixed argv to
        `subprocess` are not command injection.
    - path: "**/test_*.py"
      instructions: >-
        Every test here is AI-written. Mutation coverage is sampled, not comprehensive.
        Check whether the input or a positive control independently establishes the named
        condition, and whether deleting or bypassing the production behaviour would fail
        at the intended assertion rather than during import, setup, or an unrelated guard.
        A diagnostic string is supporting evidence; also look for an outcome, state, cause,
        side effect, count, or identity assertion proving the guarded behaviour ran. Report
        the specific surviving regression when one is demonstrated; do not infer test
        effectiveness from the number of passing tests.

  tools:
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    ast-grep:
      essential_rules: true

issue_enrichment:
  planning:
    enabled: true
    auto_planning:
      enabled: false

code_generation:
  unit_tests:
    path_instructions:
      - path: "**/*.py"
        instructions: >-
          Generate behaviour-focused tests with independent expected values, including positive
          and negative cases that fail when the named behaviour regresses. Isolate external services
          and unrelated collaborators explicitly, never the behaviour under test. Do not call live
          network services or pods,
          edit core documents, push, or merge automatically.

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # Every review reads the principles it is reviewing against.
    filePatterns:
      - "PRINCIPLES.md"
      - "ARCHITECTURE.md"
      - "GLOSSARY.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "**/README.md"
  learnings:
    # Keep learnings scoped to this repository.
    scope: local
  pull_requests:
    scope: local
  issues:
    scope: local
