# Weekly pull requests for outdated dependencies. Pins here are exact, so each update is
# reviewed and tested like any other change.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # The pod group: CI never installs it, so a routine update can only be qualified on
    # a GPU pod. Only version updates are ignored; security updates still arrive.
    ignore:
      - dependency-name: "vllm"
        update-types: &version-updates ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "transformers"
        update-types: *version-updates
      - dependency-name: "torch"
        update-types: *version-updates
      - dependency-name: "ultralytics"
        update-types: *version-updates
      - dependency-name: "qwen-vl-utils"
        update-types: *version-updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
