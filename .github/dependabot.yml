# Weekly pull requests for outdated dependencies. Pins here are exact, so each update is
# reviewed and tested like any other change.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # The pod group: CI never installs it, so an update can only be qualified on a GPU pod.
    ignore:
      - dependency-name: "vllm"
      - dependency-name: "transformers"
      - dependency-name: "torch"
      - dependency-name: "ultralytics"
      - dependency-name: "qwen-vl-utils"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
