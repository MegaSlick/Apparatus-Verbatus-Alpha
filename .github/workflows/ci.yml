name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']

# The workflow reads the repository and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Catches a hung leg. Runner speed varies about 2x (the same suite took 59 and
    # 108 minutes a night apart), so the cap sits well above the slow case.
    timeout-minutes: 150
    strategy:
      matrix:
        # 3.12 is the supported floor and 3.14 the newest supported; 3.13 was
        # dropped 2026-08-29 (Tyrel, in session) — it is bracketed by the other
        # two and no failure in the pr/ queue's runs was unique to it, so the
        # middle leg bought compute, not detection.
        python-version: ['3.12', '3.14']
    steps:
      # v6.1.0; full commit pin prevents a mutable tag changing executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Remote verification must name the candidate itself. The composing
          # session verifies that it contains freshly fetched main before merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, so the ingress check can find the commit a change starts from
          # and fall back to scanning everything when it cannot.
          fetch-depth: 0
          # Repository-controlled checks need no authenticated Git operation.
          # Do not leave GITHUB_TOKEN in local Git config while they execute.
          persist-credentials: false

      - name: Set up Python
        # v6.3.0; update deliberately after verifying the upstream release commit.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repository ingress
        shell: bash
        # Every commit on main was scanned by the run that brought it there, so a pull
        # request scans only the commits it adds and a push to main only the ones it
        # pushes. A tag, a new branch or a start commit that cannot be found gets the
        # full history, so a deleted credential still cannot turn the check green.
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          printf '%s\0%s\0' "$GITHUB_REF" "$GITHUB_HEAD_REF" |
            python3 .githooks/check_ingress.py --ref-fields
          if [[ "$GITHUB_REF" != refs/tags/* && "${SCAN_BASE:-}" =~ ^[0-9a-f]{40}$ &&
                "$SCAN_BASE" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null; then
            python3 .githooks/check_ingress.py --history "$SCAN_BASE..HEAD"
          else
            python3 .githooks/check_ingress.py --history HEAD
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 .githooks/check_ingress.py --ref-object "$GITHUB_REF"
          fi

      - name: Install the frozen dependency environment
        # Two commands because they check different things. `uv lock --check`
        # is the one that fails when uv.lock no longer describes pyproject.toml
        # — `--frozen` deliberately skips that check, so a step with only the
        # sync would install happily from a stale lock and report a green gate.
        # The sync is then the smoke test that the exact `--frozen` install spec
        # 04 assumes really does resolve. The uv version comes from
        # pyproject.toml's own `[tool.uv] required-version` — the same single
        # declaration `.githooks/check-all.sh` reads — rather than a second
        # hardcoded copy here that could silently drift from it (F040).
        run: |
          required_uv_version=$(python -c '
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)
          print(project["tool"]["uv"]["required-version"].removeprefix("=="))
          ')
          python -m pip install "uv==$required_uv_version"
          uv lock --check
          uv sync --frozen --group test --group audit

      - name: Repository checks
        # `--parallel` hands the suite to four xdist workers, one file at a
        # time per worker. It is passed here and not in the local gate: the
        # runner is a fresh machine with nothing else on it, while a laptop
        # gate shares its cores with the session that started it. The census
        # is identical either way; only the wall time differs, and the leg's
        # timeout above is the budget this is meant to keep clear of.
        run: sh .githooks/check-all.sh --ci --parallel

  # Branch protection requires the single context `check`. The matrix above
  # publishes one context per Python version (`test (3.12)` and so on), so this
  # summary job is the one required name, and it refuses unless every matrix
  # leg succeeded — a skipped or cancelled leg is a failure here, not a pass.
  check:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every matrix leg succeeded
        run: test "${{ needs.test.result }}" = "success"
