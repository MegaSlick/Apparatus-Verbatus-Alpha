name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']

# The workflow reads the repository and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v6.1.0; full commit pin prevents a mutable tag changing executed code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # The ingress check examines every reachable commit so that deleting a
          # leaked credential in a later commit cannot turn the check green.
          fetch-depth: 0
          # Repository-controlled checks need no authenticated Git operation.
          # Do not leave GITHUB_TOKEN in local Git config while they execute.
          persist-credentials: false

      - name: Set up Python
        # v6.3.0; update deliberately after verifying the upstream release commit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Repository ingress
        shell: bash
        run: |
          printf '%s\0%s\0' "$GITHUB_REF" "$GITHUB_HEAD_REF" |
            python3 .githooks/check_ingress.py --ref-fields
          python3 .githooks/check_ingress.py --history HEAD
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 .githooks/check_ingress.py --ref-object "$GITHUB_REF"
          fi

      - name: Install check tools
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Repository checks
        run: sh .githooks/check-all.sh --ci

  # main never holds an unsterilized instrument: a pull request may carry
  # cleanroom/ drafts while under review, but it may not merge until the tray
  # is empty. Kept as its own job so a loaded tray is distinguishable from a
  # failing check. Make it a required check on main for it to actually gate.
  cleanroom-empty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep this pin identical to the checkout used by the check job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: The cleanroom is empty
        # git's own failure must not read as an empty tray: capture ls-files
        # separately and fail on it, then filter. A check that cannot run is
        # a failure, not a pass.
        shell: bash
        run: |
          # NUL-delimited throughout. A path containing a newline would
          # otherwise split into two, and each half would fail to match the
          # README exemption — or a crafted name could match it and hide the
          # rest of the tray. Converting back to newlines for grep would
          # reintroduce exactly that, so each entry is compared whole.
          # A tray check a filename can fool is not a check.
          list="$RUNNER_TEMP/cleanroom-list"
          if ! git ls-files -z cleanroom/ > "$list"; then
            echo "git ls-files failed" >&2; exit 2
          fi
          stray_count=0
          while IFS= read -r -d '' entry; do
            [ -z "$entry" ] && continue
            [ "$entry" = "cleanroom/README.md" ] && continue
            stray_count=$((stray_count + 1))
          done < "$list"
          if [ "$stray_count" -ne 0 ]; then
            echo "The cleanroom still holds $stray_count unsterilized draft(s)." >&2
            echo "Run 'git ls-files cleanroom/' locally to inspect them." >&2
            echo "Sterilize and place them, or remove them, before merging." >&2
            exit 1
          fi
