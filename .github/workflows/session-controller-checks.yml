name: Session controller offline checks

on:
  push:
    branches: [work/controller-checks-2026-09-22]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository ingress
        shell: bash
        run: |
          printf '%s\0' "$GITHUB_REF" |
            python3 .githooks/check_ingress.py --ref-fields
          python3 .githooks/check_ingress.py --history HEAD
      - name: Offline lifecycle tests without provider credentials
        run: python session-verification/test_live_trial_controller_20260922.py

  pinned-image-boot-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reclaim ephemeral runner space for the reviewed image
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: Exercise PID1 and init-child deadman boots and worker timeout cleanup without network or provider credentials
        id: boot-drill
        run: |
          sudo python3 session-verification/run_deadman_boot_drill.py \
            --workspace "$RUNNER_TEMP/deadman-workspace" \
            --summary "$RUNNER_TEMP/deadman-boot-drill-summary.json"
      - name: Show safe boot result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/deadman-boot-drill-summary.json"; then
            cat "$RUNNER_TEMP/deadman-boot-drill-summary.json"
          else
            printf '%s\n' '{"outcome":"drill-did-not-produce-summary"}'
          fi
      - name: Retain safe boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-image-deadman-boot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deadman-boot-drill-summary.json
            ${{ runner.temp }}/deadman-boot-drill.log
          if-no-files-found: warn
          retention-days: 7

  native-chandra-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: helper
          persist-credentials: false
      - name: Check out the exact live application baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 99fe5d7df52953c193182c0995fc449532b38fb9
          path: application
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install frozen test dependencies and only the pinned native caller dependencies
        working-directory: application
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 99fe5d7df52953c193182c0995fc449532b38fb9
          python -m pip install 'uv==0.12.1'
          uv lock --check
          uv sync --frozen --group test
          uv export --frozen --only-group pod --no-hashes --no-emit-project \
            --output-file "$RUNNER_TEMP/native-caller-constraints.txt"
          uv pip install --python .venv/bin/python \
            --constraint "$RUNNER_TEMP/native-caller-constraints.txt" openai pydantic-settings
          cp -R "$GITHUB_WORKSPACE/helper/session_verification" ./session_verification
      - name: Fetch the pinned upstream caller outside the repository
        shell: bash
        run: |
          git init "$RUNNER_TEMP/upstream-chandra"
          git -C "$RUNNER_TEMP/upstream-chandra" remote add origin https://github.com/datalab-to/chandra.git
          git -C "$RUNNER_TEMP/upstream-chandra" fetch --no-tags --depth=1 origin d4f7467435aa4137d9539f000ddf0b7ced3eb43f
          git -C "$RUNNER_TEMP/upstream-chandra" checkout --detach d4f7467435aa4137d9539f000ddf0b7ced3eb43f
          test "$(git -C "$RUNNER_TEMP/upstream-chandra" rev-parse HEAD)" = d4f7467435aa4137d9539f000ddf0b7ced3eb43f
      - name: Exercise native retries with synthetic pixels and fake responses only
        working-directory: application
        shell: bash
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
          PYTHONPATH=. \
          CHANDRA_UPSTREAM_TEST_ROOT="$RUNNER_TEMP/upstream-chandra" \
            .venv/bin/python -m pytest session_verification/test_chandra_native_isolation.py
