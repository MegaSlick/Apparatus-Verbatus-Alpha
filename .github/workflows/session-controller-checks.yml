name: Session controller offline checks

on:
  push:
    branches: [work/controller-checks-2026-09-22]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Offline lifecycle tests without provider credentials
        run: python session-verification/test_live_trial_controller_20260922.py
