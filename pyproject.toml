[project]
name = "verbatus"
version = "0.0.0"
description = "Apparatus Verbatus — recovers the ipsissima verba from historical registers"
requires-python = ">=3.12"
dependencies = [
    # Hugging Face snapshot metadata/download client used by common.chairs.  It is
    # pinned so a configured model identity is resolved by a reproducible client.
    "huggingface_hub==1.31.0",
    # Basic image codecs used to make every supported raster and TIFF page readable
    # at the Exemplar boundary and by downstream crop operations.
    "Pillow==12.3.0",
    # Pillow plugin backed by libheif for iPhone-native HEIC/HEIF sources. The
    # door and downstream crop reader both register it explicitly. Licence: its own
    # code is BSD-3-Clause, but its binary wheels are GPLv2 because they bundle x265
    # (the bundled libheif and libde265 are LGPLv3).
    "pillow-heif==1.5.0",
    # PDFium binding used to rasterise complete PDF pages once at the submit door.
    "pypdfium2==5.12.1",
    # Unit-cost edit distance for scoring readings against reference transcriptions
    # (MIT licence). Called bare, with processor=None, so this project makes every
    # normalization decision itself rather than inheriting a scorer's defaults.
    "rapidfuzz==3.14.5",
    # UAX #29 extended grapheme clusters, the units of the character error rate when
    # scoring readings against reference transcriptions (MIT licence).
    "uniseg==0.10.1",
    # Maintained Apache-2.0 AWS SDK used only for RunPod's documented
    # S3-compatible network-volume upload path.
    "boto3==1.43.53",
]

[project.scripts]
verbatus = "operations.operator.entry:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

# The one uv pin: .githooks/check-all.sh and .github/workflows/ci.yml read it from here,
# and uv itself refuses to run against this project at any other version.
[tool.uv]
required-version = "==0.12.1"

[dependency-groups]
# The tests and static tools the gate runs from uv's frozen environment.
test = [
    "pytest==9.1.1",
    # Runs the suite across worker processes. The gate disables plugin autoloading,
    # so it takes effect only when a run names it with `-p xdist`.
    "pytest-xdist==3.8.0",
    "ruff==0.15.4",
    "PyYAML==6.0.3",
    "shellcheck-py==0.11.0.1",
]
# The dependency-audit gate invokes this exact pinned tool.  An unavailable
# advisory service is a failed gate, never an implied clean audit. packaging is
# imported by .githooks/serving_audit.py, so it is pinned here rather than left to
# whatever pip-audit happens to pull in.
audit = ["pip-audit==2.10.1", "packaging==26.2"]
# The model-serving stack, installed only on a GPU pod (the pod bootstrap syncs this
# group); the Linux/x86_64 markers keep any other machine from resolving torch or a
# CUDA wheel. The versions match the `required_packages` rows in
# config/serving_recipes_real.toml, which `ServingManager` checks before it launches;
# `operations/pod/test_pod_run.py` keeps the two in step.
# No `flash-attn`: vLLM brings its own FlashAttention, and the PyPI package ships no
# wheel, so it would be compiled from source on the pod.
#
# Licences (full citations in operations/pod/README.md):
#   vllm==0.30.0           Apache-2.0  github.com/vllm-project/vllm
#   transformers==5.14.1   Apache-2.0  github.com/huggingface/transformers
#   qwen-vl-utils==0.0.14  Apache-2.0  github.com/QwenLM/Qwen2.5-VL (PyPI: qwen-vl-utils)
#   ultralytics==8.4.14    AGPL-3.0    github.com/ultralytics/ultralytics
#   torch==2.13.0          BSD-3-Clause github.com/pytorch/pytorch
# `ultralytics` runs DAI's record detector on the CPU; 8.4.14 is the version its pinned
# checkpoint was written with. `torch` is pinned for the same detector, at the version
# vLLM already resolves.
pod = [
    "vllm==0.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers==5.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "qwen-vl-utils==0.0.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "ultralytics==8.4.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Deliberately narrow. Verbatus runs only from a source checkout: runtime code finds
# `pipeline/`, `config/`, `proof/` and `gold/` beside the checkout, not as package data,
# and `common/checkout.py` refuses to start anywhere else (operations/README.md).
[tool.setuptools.packages.find]
include = ["common", "common.*", "operations", "operations.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow: real breakage such as undefined names, unused imports and
# obvious mistakes. Style beyond this is the formatter's job.
# No type checker: on generated code it flags thousands of lines of working code, and
# a gate that cries wolf gets ignored.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q -p no:tach"
markers = [
    "full: slower integration and exhaustive boundary cases reserved for the full gate",
    "hostile_local: hostile local filesystem and terminal input cases run only in CI",
    "scanner: core credential-detection cases the everyday gate runs even though they are also full",
    # The marked test fetches the pinned vendor sources to re-measure the carried
    # bytes, so it needs the network. Both gates collect it, so the test skips itself
    # unless the run names `-m vendor_network` (common/test_vendor_parity.py).
    "vendor_network: fetches the pinned vendor sources to re-measure the carried-bytes pins",
]
# Setting this key replaces pytest's built-in list, which skips dotted directories;
# that is what lets the tests in .claude/ and .githooks/ be collected. The usual noise
# directories are named again. `worktrees` holds agent checkouts, whose duplicate test
# basenames would break collection.
norecursedirs = [".git", ".venv", "venv", ".ruff_cache", ".pytest_cache",
                 ".mypy_cache", ".tox", "node_modules", "build", "dist",
                 "worktrees", "__pycache__", "workbench", "private", "scriptorium"]
